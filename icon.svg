<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46e27e"/><stop offset="1" stop-color="#0f8a43"/></linearGradient>
    <radialGradient id="luz" cx="0.3" cy="0.12" r="0.75"><stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#eef2ef"/><stop offset="1" stop-color="#c7d2cb"/></linearGradient>
    <linearGradient id="bloque" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7f9f8"/><stop offset="1" stop-color="#d3dcd6"/></linearGradient>
    <linearGradient id="laton" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd978"/><stop offset="0.5" stop-color="#f0b73a"/><stop offset="1" stop-color="#c98a1c"/></linearGradient>
    <linearGradient id="capa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9ecdf"/></linearGradient>
    <linearGradient id="caliente" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="0.7" stop-color="#ffe2b0"/><stop offset="1" stop-color="#ff9a3c"/></linearGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffb347" stop-opacity="0.95"/><stop offset="0.45" stop-color="#ff8a1f" stop-opacity="0.45"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></radialGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#04361a" flood-opacity="0.38"/></filter>
    <filter id="suave" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#04361a" flood-opacity="0.25"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#luz)"/>
<g transform="translate(0 34)">

  <!-- Cama de impresión -->
  <rect x="206" y="802" width="612" height="26" rx="13" fill="#ffffff" opacity="0.42"/>

  <!-- Pieza (maceta) en capas -->
  <g filter="url(#sombra)">
    <rect x="322" y="738" width="380" height="56" rx="28" fill="url(#capa)"/>
    <rect x="300" y="674" width="424" height="56" rx="28" fill="url(#capa)"/>
    <rect x="288" y="610" width="448" height="56" rx="28" fill="url(#capa)"/>
    <rect x="282" y="546" width="460" height="56" rx="28" fill="url(#capa)"/>
    <!-- Capa en proceso: termina bajo la boquilla con el filamento caliente -->
    <path d="M308 482 h204 a28 28 0 0 1 0 56 h-204 a28 28 0 0 1 0 -56 z" fill="url(#caliente)"/>
  </g>
  <ellipse cx="520" cy="500" rx="70" ry="54" fill="url(#brillo)"/>

  <!-- Hotend -->
  <g filter="url(#sombra)">
    <!-- Disipador: núcleo con aletas -->
    <rect x="468" y="110" width="88" height="150" rx="12" fill="#cdd7d1"/>
    <rect x="404" y="104" width="216" height="26" rx="13" fill="url(#metal)"/>
    <rect x="404" y="148" width="216" height="26" rx="13" fill="url(#metal)"/>
    <rect x="404" y="192" width="216" height="26" rx="13" fill="url(#metal)"/>
    <rect x="404" y="236" width="216" height="26" rx="13" fill="url(#metal)"/>
    <!-- Garganta -->
    <rect x="494" y="258" width="36" height="34" fill="#c3cec7"/>
    <!-- Bloque calefactor -->
    <rect x="432" y="288" width="160" height="92" rx="20" fill="url(#bloque)"/>
    <rect x="456" y="314" width="40" height="40" rx="12" fill="#c6d1ca" opacity="0.8"/>
  </g>
  <!-- Boquilla de latón -->
  <g filter="url(#suave)">
    <path d="M470 380 h84 l-14 52 h-56 z" fill="url(#laton)"/>
    <path d="M492 432 h40 l-14 30 h-12 z" fill="#e5a62b"/>
  </g>
  <!-- Filamento saliendo -->
  <rect x="505" y="458" width="14" height="40" rx="7" fill="#ffd9a3"/>
</g>
</svg>
