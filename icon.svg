<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Fondo de un solo color: iOS lo separa del dibujo en el modo transparente -->
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123a22"/><stop offset="1" stop-color="#07170d"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(0 34)">
    <!-- Cama de impresión -->
    <rect x="206" y="802" width="612" height="26" rx="13" fill="#ffffff" opacity="0.5"/>
    <!-- Pieza (maceta) en capas -->
    <rect x="322" y="738" width="380" height="56" rx="28" fill="#ffffff"/>
    <rect x="300" y="674" width="424" height="56" rx="28" fill="#ffffff"/>
    <rect x="288" y="610" width="448" height="56" rx="28" fill="#ffffff"/>
    <rect x="282" y="546" width="460" height="56" rx="28" fill="#ffffff"/>
    <!-- Capa en proceso con la punta caliente -->
    <path d="M308 482 h204 a28 28 0 0 1 0 56 h-204 a28 28 0 0 1 0 -56 z" fill="#ffffff"/>
    <circle cx="512" cy="510" r="28" fill="#ffa043"/>
    <!-- Disipador con aletas -->
    <rect x="468" y="110" width="88" height="150" rx="12" fill="#e2ebe5"/>
    <rect x="404" y="104" width="216" height="26" rx="13" fill="#ffffff"/>
    <rect x="404" y="148" width="216" height="26" rx="13" fill="#ffffff"/>
    <rect x="404" y="192" width="216" height="26" rx="13" fill="#ffffff"/>
    <rect x="404" y="236" width="216" height="26" rx="13" fill="#ffffff"/>
    <!-- Garganta y bloque calefactor -->
    <rect x="494" y="258" width="36" height="34" fill="#e2ebe5"/>
    <rect x="432" y="288" width="160" height="92" rx="20" fill="#ffffff"/>
    <!-- Boquilla de latón -->
    <path d="M470 380 h84 l-14 52 h-56 z" fill="#ffc94d"/>
    <path d="M492 432 h40 l-14 30 h-12 z" fill="#f2ae2e"/>
    <!-- Filamento -->
    <rect x="505" y="458" width="14" height="40" rx="7" fill="#ffe2bd"/>
  </g>
</svg>
