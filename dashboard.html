<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MiniPrints — Dashboard</title>
  <script src="theme.js?v=20260924x"></script>
  <script src="categorias.js?v=20260924x"></script>
  <script src="inventario.js?v=20260924x"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260924x" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="ios-charts.js?v=20260924x"></script>
  <link rel="stylesheet" href="ios.css?v=20260924x" />
  <link rel="stylesheet" href="nav.css?v=20260924x" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MiniPrints" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <script type="module" src="firebase-sync.js?v=20260924x"></script>

  <!-- DASHBOARD -->
  <div class="page-container">
    <main class="dash-main">
      <div class="dash-header">
        <div>
          <h1 class="dash-title">Panel de Control</h1>
          <p class="dash-subtitle" id="dash-subtitle">Cargando datos…</p>
        </div>
      </div>

      <div class="home-stack">
        <!-- Metas: del mes, anual y por evento, apiladas como tarjetas de Wallet -->
        <section class="goals" aria-labelledby="goals-t">
          <div class="cat-head">
            <h2 class="cat-title" id="goals-t">Metas</h2>
            <button type="button" class="goals-add" onclick="abrirMeta()" aria-label="Nueva meta de evento">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <div class="goals-stack" id="goals-stack"></div>
        </section>

        <!-- Indicadores rápidos -->
        <div class="stat-tiles">
          <a class="stat-tile" href="stock-piezas.html" aria-labelledby="st-stock-lbl" aria-describedby="st-stock-val">
            <div class="st-top">
              <span class="st-label" id="st-stock-lbl">Piezas en<br>stock</span>
              <span class="st-icon st-icon--orange" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 2.8 20.2 7.2v9.6L12 21.2l-8.2-4.4V7.2z"/><path d="M3.8 7.2 12 11.6l8.2-4.4M12 11.6v9.6"/></svg>
              </span>
            </div>
            <div class="st-value" id="st-stock-val"><span class="st-num">—</span> <span class="st-unit">piezas</span></div>
          </a>
          <a class="stat-tile" href="ventas.html" aria-labelledby="st-ventas-lbl" aria-describedby="st-ventas-val">
            <div class="st-top">
              <span class="st-label" id="st-ventas-lbl">Ventas<br>del mes</span>
              <span class="st-icon st-icon--blue" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M5.2 8h13.6l-1 11.6a1.5 1.5 0 0 1-1.5 1.4H7.7a1.5 1.5 0 0 1-1.5-1.4z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
              </span>
            </div>
            <div class="st-value" id="st-ventas-val"><span class="st-num">—</span> <span class="st-unit">ventas</span></div>
          </a>
        </div>

        <!-- Ventas por mes -->
        <section class="month-card" aria-labelledby="month-title">
          <div class="month-head">
            <div>
              <h2 class="month-title" id="month-title">Ventas por mes</h2>
              <div class="month-total"><span class="month-total-num" id="month-total">—</span> <span class="month-total-unit" id="month-total-unit"></span></div>
              <div class="month-caption" id="month-caption"></div>
            </div>
            <div class="cat-seg" role="radiogroup" aria-label="Medida">
              <button type="button" role="radio" data-metric="ventas" aria-checked="true">Ventas</button>
              <button type="button" role="radio" data-metric="ingresos" aria-checked="false">Ingresos</button>
            </div>
          </div>
          <div class="month-chart"><canvas id="chart-meses" role="img" aria-label="Ventas por mes del año"></canvas></div>
        </section>

        <!-- Ventas por categoría -->
        <section class="cat-section" aria-labelledby="cat-title">
          <div class="cat-head">
            <h2 class="cat-title" id="cat-title">Ventas por categoría</h2>
            <div class="cat-seg" role="radiogroup" aria-label="Periodo">
              <button type="button" role="radio" data-range="mes" aria-checked="true">Este mes</button>
              <button type="button" role="radio" data-range="todo" aria-checked="false">Todo</button>
            </div>
          </div>
          <div class="cat-grid" id="cat-grid"></div>
          <p class="cat-note" id="cat-note" hidden></p>
        </section>
      </div>
    </main>
  </div>

  <!-- Hoja: meta por evento -->
  <div class="sheet inv-sheet" id="sh-meta" role="dialog" aria-modal="true" aria-labelledby="sh-meta-t" hidden>
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sh-meta-t">Nueva meta</h2>
      <button class="sheet-close" type="button" data-sheet-close aria-label="Cerrar"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11"/></svg></button>
    </div>
    <div class="inv-f">
      <label for="me-nombre">¿Para qué es?</label>
      <input type="text" id="me-nombre" placeholder="Ej: Pago de impresora" maxlength="40" autocomplete="off" />
    </div>
    <div class="inv-row2">
      <div class="inv-f">
        <label for="me-monto">Monto</label>
        <div class="vs-price inv-precio"><span>$</span><input type="number" id="me-monto" inputmode="decimal" min="0" step="1" placeholder="0" /></div>
      </div>
      <div class="inv-f">
        <label for="me-limite">Fecha límite</label>
        <input type="date" id="me-limite" aria-describedby="me-limite-h" />
      </div>
    </div>
    <p class="inv-hint" id="me-limite-h">La fecha límite es opcional.</p>
    <div class="inv-f" id="me-abonos-f">
      <span class="inv-f-lbl" id="me-abonos-lbl">Abonos</span>
      <div class="me-abonar">
        <div class="vs-price inv-precio"><span>$</span><input type="number" id="me-abono" inputmode="decimal" min="0" step="1" placeholder="Cantidad a abonar" aria-label="Cantidad a abonar" enterkeyhint="done" /></div>
        <button type="button" class="cat-nueva-ok" onclick="abonarMeta()">Abonar</button>
      </div>
      <div class="inv-group" id="me-abonos"></div>
    </div>
    <div class="inv-btns">
      <button type="button" class="inv-btn" onclick="guardarMeta()">Guardar</button>
      <button type="button" class="inv-btn is-danger" id="me-borrar" onclick="borrarMeta()">Eliminar meta</button>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <script>
    const DB = { ventas: [], piezas: {}, categorias: {} };
    function ventaItems(v) { return v.items || [{ pieza: v.pieza, cantidad: v.cantidad, precio: v.precio }]; }
    function ventaPagada(v) { return !v.estatusPago || v.estatusPago === 'pagado'; }
    function loadDB() {
      try { const v = localStorage.getItem('mp_ventas');       if (v) DB.ventas       = JSON.parse(v); } catch(e){}
      try { const p = localStorage.getItem('mp_piezas');       if (p) DB.piezas       = JSON.parse(p); } catch(e){}
      try { const c = localStorage.getItem('mp_categorias');   if (c) DB.categorias   = JSON.parse(c); } catch(e){}
    }

    function mesKey(v) {
      if (!v.fecha) return '';
      if (v.fecha.match(/^\d{4}-\d{2}-\d{2}$/)) return v.fecha.substring(0,7);
      const parts = v.fecha.split(' ');
      const meses = {ene:'01',feb:'02',mar:'03',abr:'04',may:'05',jun:'06',jul:'07',ago:'08',sep:'09',oct:'10',nov:'11',dic:'12'};
      if (parts.length >= 3) { const m = meses[parts[1]?.toLowerCase()?.substring(0,3)]||'01'; return `${parts[2]}-${m}`; }
      return v.fecha.substring(0,7);
    }

    function localYM(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
    function getMesActual() { return localYM(new Date()); }

    // ── Metas: del mes, anual y por evento ─────────────
    const fmtCorto = n => '$' + Math.round(n).toLocaleString('es-MX');
    const RING_R = 38, RING_C = 2 * Math.PI * RING_R;
    const GOAL_KEYS = { mes: 'mp_meta_mensual', anual: 'mp_meta_anual' };
    const ICONO = {
      mes:    '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>',
      anual:  '<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
      evento: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
    };
    const LAPIZ = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
    let metaFoco = null;

    function leer(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }
    function metasEventos() { const l = leer('mp_metas_eventos', []); return Array.isArray(l) ? l : []; }
    function guardarEventos(l) { localStorage.setItem('mp_metas_eventos', JSON.stringify(l)); }
    function abonado(m) { return (m.abonos || []).reduce((s, a) => s + (Number(a.m) || 0), 0); }
    function ingresos(filtro) {
      return DB.ventas.filter(v => ventaPagada(v) && filtro(mesKey(v)))
        .reduce((s, v) => s + ventaItems(v).reduce((si, it) => si + it.precio * it.cantidad, 0), 0);
    }
    function plazo(limite) {
      if (!limite) return '';
      const dias = Math.round((new Date(limite + 'T12:00:00') - new Date(MP_INV.fecha.hoy() + 'T12:00:00')) / 864e5);
      if (dias > 1) return `Faltan ${dias} días`;
      if (dias === 1) return 'Vence mañana';
      if (dias === 0) return 'Vence hoy';
      return `Venció hace ${-dias} ${dias === -1 ? 'día' : 'días'}`;
    }

    function tarjetaMeta(o) {
      const pct = o.meta > 0 ? Math.min(o.logrado / o.meta * 100, 100) : 0;
      const editar = o.tipo === 'evento'
        ? `onclick="abrirMeta('${o.id}')" aria-label="Editar o abonar a ${MP_INV.esc(o.titulo)}"`
        : o.auto
          ? `onclick="editarAnual(event)" aria-label="Editar la meta anual"`
          : `onclick="toggleGoalInput('${o.tipo}')" aria-label="Editar ${o.chip.toLowerCase()}"`;
      return `
      <article class="goal-widget gw--${o.tipo} ${o.color || ''}" data-meta="${o.id || o.tipo}" data-nombre="${MP_INV.esc(o.chip)}">
        <div class="gw-top">
          <span class="gw-chip"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONO[o.tipo]}</svg><span>${MP_INV.esc(o.chip)}</span></span>
          <button class="gw-edit" type="button" ${editar}>${LAPIZ}</button>
          <span class="gw-tab-pct" aria-hidden="true">${o.meta > 0 ? Math.floor(pct) + '%' : '—'}</span>
        </div>
        <div class="gw-body">
          <div class="gw-text">
            <h2 class="gw-title">${MP_INV.esc(o.meta > 0 ? (pct >= 100 ? o.cumplida : o.titulo) : o.vacia)}</h2>
            <p class="gw-sub">${o.meta > 0 ? `${fmtCorto(o.logrado)} de ${fmtCorto(o.meta)}` : 'Toca el lápiz para fijarla'}</p>
            ${o.extra ? `<p class="gw-extra">${MP_INV.esc(o.extra)}</p>` : ''}
          </div>
          <div class="gw-ring" role="img" aria-label="${o.meta > 0 ? pct.toFixed(0) + '% de la meta' : 'Sin meta'}">
            <svg viewBox="0 0 96 96" aria-hidden="true">
              <circle class="gw-track" cx="48" cy="48" r="${RING_R}"/>
              <circle class="gw-arc" cx="48" cy="48" r="${RING_R}" stroke-dasharray="${RING_C}" stroke-dashoffset="${RING_C}" data-offset="${RING_C * (1 - pct / 100)}"/>
            </svg>
            <div class="gw-center"><span class="gw-num">${o.meta > 0 ? Math.floor(pct) + '%' : '—'}</span><span class="gw-unit">${o.meta > 0 ? 'logrado' : 'sin meta'}</span></div>
          </div>
        </div>
        ${o.tipo === 'evento' || o.auto ? '' : `
        <div class="goal-input-wrap" id="goal-input-wrap-${o.tipo}">
          <input class="goal-input" id="goal-input-${o.tipo}" type="number" inputmode="decimal" placeholder="${o.tipo === 'anual' ? 'Ej: 180000' : 'Ej: 15000'}" value="${o.meta || ''}" aria-label="${o.chip} en pesos">
          <button class="goal-save-btn" onclick="saveGoal('${o.tipo}')">Guardar</button>
        </div>`}
      </article>`;
    }

    // Con meta anual, la del mes se calcula sola: lo que falta del año repartido
    // entre los meses que quedan (incluido este). Sin meta anual se usa la manual.
    function metaMensual() {
      const anual = parseFloat(localStorage.getItem('mp_meta_anual') || '0');
      if (!(anual > 0)) return { meta: parseFloat(localStorage.getItem('mp_meta_mensual') || '0') };
      const hoy = new Date(), anio = String(hoy.getFullYear()), mes = getMesActual();
      const antes = ingresos(k => k.startsWith(anio) && k < mes);
      const restantes = 12 - hoy.getMonth();
      const falta = anual - antes;
      return {
        auto: true,
        meta: falta > 0 ? falta / restantes : anual / 12,
        extra: restantes > 1 ? `Meta anual en ${restantes} meses` : 'Último mes del año',
      };
    }
    function editarAnual(e) {
      if (e) e.stopPropagation();
      activarMeta('anual');
      setTimeout(() => toggleGoalInput('anual'), 540);
    }
    let metaActiva = null;
    const TAB = 52;
    function renderGoal() {
      const stack = document.getElementById('goals-stack');
      const anio = String(new Date().getFullYear());
      const tarjetas = [
        tarjetaMeta({ tipo: 'mes', chip: 'Meta del mes', titulo: 'Tu progreso del mes', cumplida: '¡Meta cumplida!', vacia: 'Define tu meta del mes',
          logrado: ingresos(k => k === getMesActual()), ...metaMensual() }),
        tarjetaMeta({ tipo: 'anual', chip: 'Meta anual', titulo: `Tu progreso de ${anio}`, cumplida: '¡Meta del año cumplida!', vacia: 'Define tu meta del año',
          meta: parseFloat(localStorage.getItem('mp_meta_anual') || '0'), logrado: ingresos(k => k.startsWith(anio)) }),
        ...metasEventos().map((m, i) => {
          const logrado = abonado(m), monto = Number(m.monto) || 0;
          return tarjetaMeta({ tipo: 'evento', id: m.id, color: 'gw-c' + (i % 4), chip: m.nombre, titulo: `Faltan ${fmtCorto(monto - logrado)}`, cumplida: '¡Lograda!', vacia: m.nombre,
            meta: monto, logrado, extra: logrado >= monto ? '' : plazo(m.limite) });
        }),
      ];
      stack.innerHTML = tarjetas.join('');
      if (!stack.dataset.listo) {
        stack.dataset.listo = '1';
        try { metaActiva = sessionStorage.getItem('mp_meta_activa'); } catch (e) {}
        stack.addEventListener('click', e => {
          const c = e.target.closest('.goal-widget');
          if (c && !c.classList.contains('activa')) activarMeta(c.dataset.meta);
        });
        stack.addEventListener('keydown', e => {
          const c = e.target.closest('.goal-widget');
          if (c && e.target === c && !c.classList.contains('activa') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); activarMeta(c.dataset.meta); }
        });
        // La altura de la pila sigue a la tarjeta del frente (p. ej. al abrir el campo de la meta)
        stack._ro = new ResizeObserver(() => ajustarAltura());
      }
      if (metaFoco) { metaActiva = metaFoco; metaFoco = null; }
      if (!stack.querySelector(`[data-meta="${metaActiva}"]`)) metaActiva = 'mes';
      stack._ro.disconnect();
      [...stack.children].forEach(c => stack._ro.observe(c));
      acomodar(false);
      // Anima los anillos desde cero, como los widgets de iOS
      requestAnimationFrame(() => requestAnimationFrame(() => {
        stack.querySelectorAll('.gw-arc').forEach(arc => { arc.style.strokeDashoffset = arc.dataset.offset; });
      }));
    }
    // Wallet: las demás metas se asoman arriba como pestañas y la activa va al frente
    function acomodar(animar) {
      const stack = document.getElementById('goals-stack');
      const cards = [...stack.children];
      const act = cards.find(c => c.dataset.meta === metaActiva) || cards[0];
      const resto = cards.filter(c => c !== act);
      if (!animar) stack.classList.add('sin-anim');
      resto.forEach((c, i) => {
        c.classList.remove('activa');
        c.style.transform = `translateY(${i * TAB}px)`;
        c.style.zIndex = i + 1;
        c.tabIndex = 0;
        c.setAttribute('role', 'button');
        c.setAttribute('aria-label', 'Mostrar ' + c.dataset.nombre);
        const w = c.querySelector('.goal-input-wrap'); if (w) w.classList.remove('open');
      });
      act.classList.add('activa');
      try { sessionStorage.setItem('mp_meta_activa', act.dataset.meta); } catch (e) {}
      act.style.transform = `translateY(${resto.length * TAB}px)`;
      act.style.zIndex = resto.length + 1;
      act.removeAttribute('tabindex'); act.removeAttribute('role'); act.removeAttribute('aria-label');
      ajustarAltura();
      if (!animar) requestAnimationFrame(() => requestAnimationFrame(() => stack.classList.remove('sin-anim')));
    }
    function ajustarAltura() {
      const stack = document.getElementById('goals-stack');
      const act = stack.querySelector('.goal-widget.activa');
      if (act) stack.style.height = (stack.children.length - 1) * TAB + act.offsetHeight + 'px';
    }
    function activarMeta(id) {
      metaActiva = id;
      acomodar(true);
      if (navigator.vibrate) navigator.vibrate(8);
    }
    function toggleGoalInput(tipo) {
      const w = document.getElementById('goal-input-wrap-' + tipo);
      w.classList.toggle('open');
      if (w.classList.contains('open')) document.getElementById('goal-input-' + tipo).focus({ preventScroll: true });
    }
    function saveGoal(tipo) {
      const v = parseFloat(document.getElementById('goal-input-' + tipo).value);
      if (!isNaN(v) && v > 0) { localStorage.setItem(GOAL_KEYS[tipo], v); metaFoco = tipo; renderGoal(); }
    }

    // ── Hoja de meta por evento ──
    let metaEdit = null;
    function abrirMeta(id) {
      const m = id ? metasEventos().find(x => x.id === id) : null;
      metaEdit = m ? m.id : null;
      document.getElementById('sh-meta-t').textContent = m ? m.nombre : 'Nueva meta';
      document.getElementById('me-nombre').value = m ? m.nombre : '';
      document.getElementById('me-monto').value = m ? m.monto : '';
      document.getElementById('me-limite').value = m ? (m.limite || '') : '';
      document.getElementById('me-abono').value = '';
      document.getElementById('me-abonos-f').hidden = !m;
      document.getElementById('me-borrar').hidden = !m;
      if (m) pintarAbonos(m);
      MP_INV.abrir('sh-meta');
    }
    function pintarAbonos(m) {
      const lista = (m.abonos || []).map((a, i) => ({ ...a, i })).reverse();
      document.getElementById('me-abonos-lbl').textContent = `Abonos · ${fmtCorto(abonado(m))} de ${fmtCorto(m.monto)}`;
      document.getElementById('me-abonos').innerHTML = lista.length
        ? lista.map(a => `<div class="inv-group-row"><span>${MP_INV.fecha.diaLargo(a.f)}</span><span class="me-abono-m">${MP_INV.money(a.m)}<button type="button" class="me-quitar" onclick="quitarAbono(${a.i})" aria-label="Quitar abono de ${MP_INV.money(a.m)}">✕</button></span></div>`).join('')
        : '<div class="inv-group-row"><span class="me-vacio">Aún no hay abonos</span></div>';
    }
    function guardarMeta() {
      const nombre = document.getElementById('me-nombre').value.trim().toUpperCase();
      const monto = parseFloat(document.getElementById('me-monto').value);
      const limite = document.getElementById('me-limite').value;
      if (!nombre) { MP_INV.toast('Escribe para qué es la meta'); return; }
      if (!(monto > 0)) { MP_INV.toast('Escribe el monto de la meta'); return; }
      const l = metasEventos();
      if (metaEdit) {
        const m = l.find(x => x.id === metaEdit);
        if (!m) return;
        Object.assign(m, { nombre, monto, limite });
      } else {
        metaEdit = 'm' + Date.now().toString(36);
        l.push({ id: metaEdit, nombre, monto, limite, abonos: [], creada: MP_INV.fecha.hoy() });
      }
      guardarEventos(l);
      metaFoco = metaEdit;
      MP_INV.cerrar();
      renderGoal();
      MP_INV.toast('Meta guardada');
    }
    function abonarMeta() {
      const monto = parseFloat(document.getElementById('me-abono').value);
      if (!(monto > 0)) { MP_INV.toast('Escribe la cantidad a abonar'); return; }
      const l = metasEventos();
      const m = l.find(x => x.id === metaEdit);
      if (!m) return;
      (m.abonos = m.abonos || []).push({ f: MP_INV.fecha.hoy(), m: monto });
      guardarEventos(l);
      document.getElementById('me-abono').value = '';
      pintarAbonos(m);
      metaFoco = m.id;
      renderGoal();
      MP_INV.toast(abonado(m) >= m.monto ? '¡Meta completada! 🎉' : `Abono de ${MP_INV.money(monto)} registrado`);
    }
    function quitarAbono(i) {
      const l = metasEventos();
      const m = l.find(x => x.id === metaEdit);
      if (!m || !m.abonos || !m.abonos[i]) return;
      if (!confirm(`¿Quitar el abono de ${MP_INV.money(m.abonos[i].m)}?`)) return;
      m.abonos.splice(i, 1);
      guardarEventos(l);
      pintarAbonos(m);
      metaFoco = m.id;
      renderGoal();
    }
    function borrarMeta() {
      const l = metasEventos();
      const m = l.find(x => x.id === metaEdit);
      if (!m || !confirm(`¿Eliminar la meta "${m.nombre}"?`)) return;
      guardarEventos(l.filter(x => x.id !== metaEdit));
      MP_INV.cerrar();
      renderGoal();
      MP_INV.toast('Meta eliminada');
    }
    document.getElementById('me-abono').addEventListener('keydown', e => { if (e.key === 'Enter') abonarMeta(); });

    // ── Indicadores: piezas en stock y número de ventas del mes ──
    function renderTiles() {
      const stock  = Object.values(DB.piezas).reduce((s, c) => s + (Number(c) || 0), 0);
      const ventasMes = DB.ventas.filter(v => mesKey(v) === getMesActual()).length;
      document.querySelector('#st-stock-val .st-num').textContent   = stock.toLocaleString('es-MX');
      document.querySelector('#st-stock-val .st-unit').textContent  = stock === 1 ? 'pieza' : 'piezas';
      document.querySelector('#st-ventas-val .st-num').textContent  = ventasMes.toLocaleString('es-MX');
      document.querySelector('#st-ventas-val .st-unit').textContent = ventasMes === 1 ? 'venta' : 'ventas';
    }

    // ── Ventas por categoría ───────────────────────────
    // Íconos en estilo SF Symbols (trazo)

    // Base + las que agregues en Piezas (categorias.js)
    const categoriasConIcono = () => MP_CAT.lista.map(c => ({ ...c, icon: MP_CAT.icono(c.id) }));
    const escCat = t => String(t).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
    // La categoría viene de categorias.js (asignada o deducida por el nombre)
    function categoriaDe(pieza) { return MP_CAT.de(pieza, DB.categorias); }

    let catRange = 'mes';
    const ICON_ESTADO = {
      top:  '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="currentColor"/><path d="M8 11.5v-7M5 7.2 8 4.2l3 3" stroke="var(--cat-on)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      ok:   '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="currentColor"/><path d="M4.8 8.2 7 10.3l4.2-4.6" stroke="var(--cat-on)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      baja: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="currentColor"/><path d="M8 4.5v7M5 8.8l3 3 3-3" stroke="var(--cat-on)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      cero: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="currentColor"/><path d="M5 8h6" stroke="var(--cat-on)" stroke-width="1.7" stroke-linecap="round"/></svg>',
    };

    function renderCategorias() {
      const CATEGORIAS = categoriasConIcono();
      const uds = Object.fromEntries(CATEGORIAS.map(c => [c.id, 0]));
      let sinCategoria = 0;
      DB.ventas
        .filter(v => catRange === 'todo' || mesKey(v) === getMesActual())
        .forEach(v => ventaItems(v).forEach(it => {
          const cat = categoriaDe(it.pieza);
          const n = Number(it.cantidad) || 0;
          if (cat && cat in uds) uds[cat] += n; else sinCategoria += n;
        }));
      const max = Math.max(0, ...Object.values(uds));

      document.getElementById('cat-grid').innerHTML = CATEGORIAS.map(c => {
        const n = uds[c.id];
        const pct = max > 0 ? n / max : 0;
        const estado = n === 0 ? 'cero' : n === max ? 'top' : pct >= 0.5 ? 'ok' : 'baja';
        const texto  = { top: 'Más vendida', ok: 'Normal', baja: 'Baja', cero: 'Sin ventas' }[estado];
        const nivel  = Math.round(pct * 100);
        return `
          <article class="cat-card cat--${estado}" aria-label="${escCat(c.nombre)}: ${n} ${n === 1 ? 'unidad' : 'unidades'}, ${texto}">
            <div class="cat-info">
              <div class="cat-name"><svg class="cat-ico" viewBox="0 0 24 24" aria-hidden="true">${c.icon}</svg>${escCat(c.nombre)}</div>
              <div class="cat-value"><span class="cat-num">${n.toLocaleString('es-MX')}</span><span class="cat-unit">uds</span></div>
              <div class="cat-status">${ICON_ESTADO[estado]}${texto}</div>
            </div>
            <div class="cat-gauge" aria-hidden="true">
              <div class="cat-fill" style="height:calc((100% - 8px) * ${nivel / 100})"></div>
              <div class="cat-knob" style="bottom:calc(9px + (100% - 18px) * ${nivel / 100})"></div>
            </div>
          </article>`;
      }).join('');

      const note = document.getElementById('cat-note');
      note.hidden = sinCategoria === 0;
      note.textContent = sinCategoria ? `${sinCategoria} ${sinCategoria === 1 ? 'pieza vendida' : 'piezas vendidas'} sin categoría` : '';
    }

    document.querySelectorAll('.cat-seg button').forEach(b => b.addEventListener('click', () => {
      catRange = b.dataset.range;
      document.querySelectorAll('.cat-seg button').forEach(x => x.setAttribute('aria-checked', String(x === b)));
      renderCategorias();
    }));

    // ── Ventas por mes (enero a diciembre del año actual) ──
    let chartMeses = null, monthMetric = 'ventas';
    const MESES_CORTOS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    function renderMeses() {
      const hoy = new Date(), anio = hoy.getFullYear(), mesActual = hoy.getMonth();
      const datos = MESES_CORTOS.map((_, i) => {
        const key = `${anio}-${String(i + 1).padStart(2, '0')}`;
        const delMes = DB.ventas.filter(v => mesKey(v) === key);
        return monthMetric === 'ventas'
          ? delMes.length
          : delMes.filter(ventaPagada).reduce((s, v) => s + ventaItems(v).reduce((si, it) => si + it.precio * it.cantidad, 0), 0);
      });
      const total = datos.reduce((a, b) => a + b, 0);
      const esVentas = monthMetric === 'ventas';
      document.getElementById('month-total').textContent = esVentas ? total.toLocaleString('es-MX') : '$' + Math.round(total).toLocaleString('es-MX');
      document.getElementById('month-total-unit').textContent = esVentas ? (total === 1 ? 'venta' : 'ventas') : '';
      document.getElementById('month-caption').textContent = `Total ${anio}` + (esVentas ? '' : ' · solo ventas pagadas');

      if (!window.Chart) return;
      const angosto = window.innerWidth < 430;
      const labels = MESES_CORTOS.map(m => angosto ? m[0].toUpperCase() : m);
      const fmtY = v => esVentas ? v : (v >= 1000 ? '$' + (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : '$' + v);
      if (chartMeses) chartMeses.destroy();
      chartMeses = new Chart(document.getElementById('chart-meses'), {
        type: 'bar',
        data: { labels, datasets: [{
          label: esVentas ? 'Ventas' : 'Ingresos',
          data: datos,
          // El mes actual resaltado, los futuros más tenues, como la app Salud
          backgroundColor: datos.map((_, i) => i === mesActual ? IOS.green : i > mesActual ? IOS.grid : IOS.greenSoft),
          hoverBackgroundColor: IOS.green,
          borderRadius: 6,
          maxBarThickness: 26,
        }]},
        options: {
          plugins: { legend: { display: false }, tooltip: { callbacks: {
            title: items => MESES_CORTOS[items[0].dataIndex] + ' ' + anio,
            label: ctx => esVentas ? `${ctx.parsed.y} ${ctx.parsed.y === 1 ? 'venta' : 'ventas'}` : '$' + Math.round(ctx.parsed.y).toLocaleString('es-MX'),
          }}},
          scales: IOS.scales(fmtY, { x: { ticks: { color: IOS.label2, font: { size: 11 }, autoSkip: false, maxRotation: 0 } },
                                     y: { beginAtZero: true, ticks: { color: IOS.label2, font: { size: 11 }, padding: 6, maxTicksLimit: 4, precision: 0, callback: fmtY } } }),
        }
      });
    }
    document.querySelectorAll('[data-metric]').forEach(b => b.addEventListener('click', () => {
      monthMetric = b.dataset.metric;
      document.querySelectorAll('[data-metric]').forEach(x => x.setAttribute('aria-checked', String(x === b)));
      renderMeses();
    }));
    let _anchoPrevio = window.innerWidth;
    window.addEventListener('resize', () => {
      if ((_anchoPrevio < 430) !== (window.innerWidth < 430)) renderMeses();
      _anchoPrevio = window.innerWidth;
    });

    function renderSubtitle() {
      document.getElementById('dash-subtitle').textContent =
        'Actualizado ' + new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    }

    function mpInit() {
      loadDB();
      renderSubtitle();
      renderGoal();
      renderTiles();
      renderMeses();
      renderCategorias();
    }
    window.addEventListener('mp-sync-ready', mpInit, { once: true });
    window.addEventListener('mp-sync-update', mpInit);
  </script>
  <script src="nav.js?v=20260924x"></script>
</body>
