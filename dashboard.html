<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MiniPrints — Dashboard</title>
  <script src="theme.js?v=20260923o"></script>
  <script src="categorias.js?v=20260923o"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260923o" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="ios-charts.js?v=20260923o"></script>
  <link rel="stylesheet" href="ios.css?v=20260923o" />
  <link rel="stylesheet" href="nav.css?v=20260923o" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <script type="module" src="firebase-sync.js?v=20260923o"></script>

  <!-- DASHBOARD -->
  <div class="page-container">
    <main class="dash-main">
      <div class="dash-header">
        <div>
          <h1 class="dash-title">Panel de Control</h1>
          <p class="dash-subtitle" id="dash-subtitle">Cargando datos…</p>
        </div>
      </div>

      <div class="home-stack">
        <!-- Meta del mes -->
        <section class="goal-widget" id="goal-card" aria-label="Meta del mes"></section>

        <!-- Indicadores rápidos -->
        <div class="stat-tiles">
          <a class="stat-tile" href="stock-piezas.html" aria-labelledby="st-stock-lbl" aria-describedby="st-stock-val">
            <div class="st-top">
              <span class="st-label" id="st-stock-lbl">Piezas en<br>stock</span>
              <span class="st-icon st-icon--orange" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 2.8 20.2 7.2v9.6L12 21.2l-8.2-4.4V7.2z"/><path d="M3.8 7.2 12 11.6l8.2-4.4M12 11.6v9.6"/></svg>
              </span>
            </div>
            <div class="st-value" id="st-stock-val"><span class="st-num">—</span> <span class="st-unit">piezas</span></div>
          </a>
          <a class="stat-tile" href="ventas.html" aria-labelledby="st-ventas-lbl" aria-describedby="st-ventas-val">
            <div class="st-top">
              <span class="st-label" id="st-ventas-lbl">Ventas<br>del mes</span>
              <span class="st-icon st-icon--blue" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M5.2 8h13.6l-1 11.6a1.5 1.5 0 0 1-1.5 1.4H7.7a1.5 1.5 0 0 1-1.5-1.4z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
              </span>
            </div>
            <div class="st-value" id="st-ventas-val"><span class="st-num">—</span> <span class="st-unit">ventas</span></div>
          </a>
        </div>

        <!-- Ventas por mes -->
        <section class="month-card" aria-labelledby="month-title">
          <div class="month-head">
            <div>
              <h2 class="month-title" id="month-title">Ventas por mes</h2>
              <div class="month-total"><span class="month-total-num" id="month-total">—</span> <span class="month-total-unit" id="month-total-unit"></span></div>
              <div class="month-caption" id="month-caption"></div>
            </div>
            <div class="cat-seg" role="radiogroup" aria-label="Medida">
              <button type="button" role="radio" data-metric="ventas" aria-checked="true">Ventas</button>
              <button type="button" role="radio" data-metric="ingresos" aria-checked="false">Ingresos</button>
            </div>
          </div>
          <div class="month-chart"><canvas id="chart-meses" role="img" aria-label="Ventas por mes del año"></canvas></div>
        </section>

        <!-- Ventas por categoría -->
        <section class="cat-section" aria-labelledby="cat-title">
          <div class="cat-head">
            <h2 class="cat-title" id="cat-title">Ventas por categoría</h2>
            <div class="cat-seg" role="radiogroup" aria-label="Periodo">
              <button type="button" role="radio" data-range="mes" aria-checked="true">Este mes</button>
              <button type="button" role="radio" data-range="todo" aria-checked="false">Todo</button>
            </div>
          </div>
          <div class="cat-grid" id="cat-grid"></div>
          <p class="cat-note" id="cat-note" hidden></p>
        </section>
      </div>
    </main>
  </div>

  <script>
    const DB = { ventas: [], piezas: {}, categorias: {} };
    function ventaItems(v) { return v.items || [{ pieza: v.pieza, cantidad: v.cantidad, precio: v.precio }]; }
    function ventaPagada(v) { return !v.estatusPago || v.estatusPago === 'pagado'; }
    function loadDB() {
      try { const v = localStorage.getItem('mp_ventas');       if (v) DB.ventas       = JSON.parse(v); } catch(e){}
      try { const p = localStorage.getItem('mp_piezas');       if (p) DB.piezas       = JSON.parse(p); } catch(e){}
      try { const c = localStorage.getItem('mp_categorias');   if (c) DB.categorias   = JSON.parse(c); } catch(e){}
    }

    function mesKey(v) {
      if (!v.fecha) return '';
      if (v.fecha.match(/^\d{4}-\d{2}-\d{2}$/)) return v.fecha.substring(0,7);
      const parts = v.fecha.split(' ');
      const meses = {ene:'01',feb:'02',mar:'03',abr:'04',may:'05',jun:'06',jul:'07',ago:'08',sep:'09',oct:'10',nov:'11',dic:'12'};
      if (parts.length >= 3) { const m = meses[parts[1]?.toLowerCase()?.substring(0,3)]||'01'; return `${parts[2]}-${m}`; }
      return v.fecha.substring(0,7);
    }

    function localYM(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
    function getMesActual() { return localYM(new Date()); }

    function renderGoal() {
      const meta   = parseFloat(localStorage.getItem('mp_meta_mensual')||'0');
      const ingEste = DB.ventas.filter(v=>ventaPagada(v)&&mesKey(v)===getMesActual()).reduce((s,v)=>s+ventaItems(v).reduce((si,it)=>si+it.precio*it.cantidad,0),0);
      const pct    = meta>0 ? Math.min(ingEste/meta*100,100) : 0;
      const R = 38, C = 2 * Math.PI * R;
      const fmtCorto = n => '$' + Math.round(n).toLocaleString('es-MX');
      document.getElementById('goal-card').innerHTML = `
        <div class="gw-top">
          <span class="gw-chip">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
            Meta del mes
          </span>
          <button class="gw-edit" type="button" onclick="toggleGoalInput()" aria-label="Editar meta">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
          </button>
        </div>
        <div class="gw-body">
          <div class="gw-text">
            <h2 class="gw-title">${meta>0 ? (pct>=100 ? '¡Meta cumplida!' : 'Tu progreso del mes') : 'Define tu meta del mes'}</h2>
            <p class="gw-sub">${meta>0 ? `${fmtCorto(ingEste)} de ${fmtCorto(meta)}` : 'Toca el lápiz para fijarla'}</p>
          </div>
          <div class="gw-ring" role="img" aria-label="${meta>0 ? pct.toFixed(0)+'% de la meta' : 'Sin meta'}">
            <svg viewBox="0 0 96 96" aria-hidden="true">
              <circle class="gw-track" cx="48" cy="48" r="${R}"/>
              <circle class="gw-arc" cx="48" cy="48" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-offset="${C * (1 - pct / 100)}"/>
            </svg>
            <div class="gw-center"><span class="gw-num">${meta>0 ? Math.floor(pct) + '%' : '—'}</span><span class="gw-unit">${meta>0 ? 'logrado' : 'sin meta'}</span></div>
          </div>
        </div>
        <div class="goal-input-wrap" id="goal-input-wrap">
          <input class="goal-input" id="goal-input" type="number" inputmode="decimal" placeholder="Ej: 15000" value="${meta||''}" aria-label="Meta mensual en pesos">
          <button class="goal-save-btn" onclick="saveGoal()">Guardar</button>
        </div>`;
      // Anima el anillo desde cero, como los widgets de iOS
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const arc = document.querySelector('#goal-card .gw-arc');
        if (arc) arc.style.strokeDashoffset = arc.dataset.offset;
      }));
    }
    function toggleGoalInput() { document.getElementById('goal-input-wrap').classList.toggle('open'); }
    function saveGoal() {
      const v = parseFloat(document.getElementById('goal-input').value);
      if (!isNaN(v)&&v>0) { localStorage.setItem('mp_meta_mensual',v); document.getElementById('goal-input-wrap').classList.remove('open'); renderGoal(); }
    }

    // ── Indicadores: piezas en stock y número de ventas del mes ──
    function renderTiles() {
      const stock  = Object.values(DB.piezas).reduce((s, c) => s + (Number(c) || 0), 0);
      const ventasMes = DB.ventas.filter(v => mesKey(v) === getMesActual()).length;
      document.querySelector('#st-stock-val .st-num').textContent   = stock.toLocaleString('es-MX');
      document.querySelector('#st-stock-val .st-unit').textContent  = stock === 1 ? 'pieza' : 'piezas';
      document.querySelector('#st-ventas-val .st-num').textContent  = ventasMes.toLocaleString('es-MX');
      document.querySelector('#st-ventas-val .st-unit').textContent = ventasMes === 1 ? 'venta' : 'ventas';
    }

    // ── Ventas por categoría ───────────────────────────
    // Íconos en estilo SF Symbols (trazo)
    const CATEGORIAS = [
      { id: 'miniaturas', nombre: 'Miniaturas', icon: '<circle cx="12" cy="6.5" r="3"/><path d="M9.5 9.5 8.5 16h7l-1-6.5"/><path d="M6.5 20.5h11M7.5 16h9l1 4.5h-11z"/>' },
      { id: 'llaveros',   nombre: 'Llaveros',   icon: '<circle cx="8" cy="15" r="4.5"/><path d="M11.2 11.8 20 3M16.5 6.5l2.5 2.5M14.5 8.5l2 2"/>' },
      { id: 'figuras',    nombre: 'Figuras',    icon: '<path d="M12 3.5l2.5 5.2 5.7.8-4.1 4 1 5.7L12 16.5l-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/>' },
      { id: 'oficina',    nombre: 'Oficina',    icon: '<rect x="3" y="7.5" width="18" height="12" rx="2.5"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5M3 13h18"/>' },
      { id: 'hogar',      nombre: 'Hogar',      icon: '<path d="M7 11h10l-1.3 9H8.3z"/><path d="M12 11V7m0 0c0-2.2 1.8-3.5 4-3.5 0 2.2-1.8 3.5-4 3.5zm0 0c0-2.2-1.8-3.5-4-3.5 0 2.2 1.8 3.5 4 3.5z"/>' },
    ];
    // La categoría viene de categorias.js (asignada o deducida por el nombre)
    function categoriaDe(pieza) { return MP_CAT.de(pieza, DB.categorias); }

    let catRange = 'mes';
    const ICON_ESTADO = {
      top:  '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="currentColor"/><path d="M8 11.5v-7M5 7.2 8 4.2l3 3" stroke="var(--cat-on)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      ok:   '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="currentColor"/><path d="M4.8 8.2 7 10.3l4.2-4.6" stroke="var(--cat-on)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      baja: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="currentColor"/><path d="M8 4.5v7M5 8.8l3 3 3-3" stroke="var(--cat-on)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      cero: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="currentColor"/><path d="M5 8h6" stroke="var(--cat-on)" stroke-width="1.7" stroke-linecap="round"/></svg>',
    };

    function renderCategorias() {
      const uds = Object.fromEntries(CATEGORIAS.map(c => [c.id, 0]));
      let sinCategoria = 0;
      DB.ventas
        .filter(v => catRange === 'todo' || mesKey(v) === getMesActual())
        .forEach(v => ventaItems(v).forEach(it => {
          const cat = categoriaDe(it.pieza);
          const n = Number(it.cantidad) || 0;
          if (cat && cat in uds) uds[cat] += n; else sinCategoria += n;
        }));
      const max = Math.max(0, ...Object.values(uds));

      document.getElementById('cat-grid').innerHTML = CATEGORIAS.map(c => {
        const n = uds[c.id];
        const pct = max > 0 ? n / max : 0;
        const estado = n === 0 ? 'cero' : n === max ? 'top' : pct >= 0.5 ? 'ok' : 'baja';
        const texto  = { top: 'Más vendida', ok: 'Normal', baja: 'Baja', cero: 'Sin ventas' }[estado];
        const nivel  = Math.round(pct * 100);
        return `
          <article class="cat-card cat--${estado}" aria-label="${c.nombre}: ${n} ${n === 1 ? 'unidad' : 'unidades'}, ${texto}">
            <div class="cat-info">
              <div class="cat-name"><svg class="cat-ico" viewBox="0 0 24 24" aria-hidden="true">${c.icon}</svg>${c.nombre}</div>
              <div class="cat-value"><span class="cat-num">${n.toLocaleString('es-MX')}</span><span class="cat-unit">uds</span></div>
              <div class="cat-status">${ICON_ESTADO[estado]}${texto}</div>
            </div>
            <div class="cat-gauge" aria-hidden="true">
              <div class="cat-fill" style="height:calc((100% - 8px) * ${nivel / 100})"></div>
              <div class="cat-knob" style="bottom:calc(9px + (100% - 18px) * ${nivel / 100})"></div>
            </div>
          </article>`;
      }).join('');

      const note = document.getElementById('cat-note');
      note.hidden = sinCategoria === 0;
      note.textContent = sinCategoria ? `${sinCategoria} ${sinCategoria === 1 ? 'pieza vendida' : 'piezas vendidas'} sin categoría` : '';
    }

    document.querySelectorAll('.cat-seg button').forEach(b => b.addEventListener('click', () => {
      catRange = b.dataset.range;
      document.querySelectorAll('.cat-seg button').forEach(x => x.setAttribute('aria-checked', String(x === b)));
      renderCategorias();
    }));

    // ── Ventas por mes (enero a diciembre del año actual) ──
    let chartMeses = null, monthMetric = 'ventas';
    const MESES_CORTOS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    function renderMeses() {
      const hoy = new Date(), anio = hoy.getFullYear(), mesActual = hoy.getMonth();
      const datos = MESES_CORTOS.map((_, i) => {
        const key = `${anio}-${String(i + 1).padStart(2, '0')}`;
        const delMes = DB.ventas.filter(v => mesKey(v) === key);
        return monthMetric === 'ventas'
          ? delMes.length
          : delMes.filter(ventaPagada).reduce((s, v) => s + ventaItems(v).reduce((si, it) => si + it.precio * it.cantidad, 0), 0);
      });
      const total = datos.reduce((a, b) => a + b, 0);
      const esVentas = monthMetric === 'ventas';
      document.getElementById('month-total').textContent = esVentas ? total.toLocaleString('es-MX') : '$' + Math.round(total).toLocaleString('es-MX');
      document.getElementById('month-total-unit').textContent = esVentas ? (total === 1 ? 'venta' : 'ventas') : '';
      document.getElementById('month-caption').textContent = `Total ${anio}` + (esVentas ? '' : ' · solo ventas pagadas');

      if (!window.Chart) return;
      const angosto = window.innerWidth < 430;
      const labels = MESES_CORTOS.map(m => angosto ? m[0].toUpperCase() : m);
      const fmtY = v => esVentas ? v : (v >= 1000 ? '$' + (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : '$' + v);
      if (chartMeses) chartMeses.destroy();
      chartMeses = new Chart(document.getElementById('chart-meses'), {
        type: 'bar',
        data: { labels, datasets: [{
          label: esVentas ? 'Ventas' : 'Ingresos',
          data: datos,
          // El mes actual resaltado, los futuros más tenues, como la app Salud
          backgroundColor: datos.map((_, i) => i === mesActual ? IOS.green : i > mesActual ? IOS.grid : IOS.greenSoft),
          hoverBackgroundColor: IOS.green,
          borderRadius: 6,
          maxBarThickness: 26,
        }]},
        options: {
          plugins: { legend: { display: false }, tooltip: { callbacks: {
            title: items => MESES_CORTOS[items[0].dataIndex] + ' ' + anio,
            label: ctx => esVentas ? `${ctx.parsed.y} ${ctx.parsed.y === 1 ? 'venta' : 'ventas'}` : '$' + Math.round(ctx.parsed.y).toLocaleString('es-MX'),
          }}},
          scales: IOS.scales(fmtY, { x: { ticks: { color: IOS.label2, font: { size: 11 }, autoSkip: false, maxRotation: 0 } },
                                     y: { beginAtZero: true, ticks: { color: IOS.label2, font: { size: 11 }, padding: 6, maxTicksLimit: 4, precision: 0, callback: fmtY } } }),
        }
      });
    }
    document.querySelectorAll('[data-metric]').forEach(b => b.addEventListener('click', () => {
      monthMetric = b.dataset.metric;
      document.querySelectorAll('[data-metric]').forEach(x => x.setAttribute('aria-checked', String(x === b)));
      renderMeses();
    }));
    let _anchoPrevio = window.innerWidth;
    window.addEventListener('resize', () => {
      if ((_anchoPrevio < 430) !== (window.innerWidth < 430)) renderMeses();
      _anchoPrevio = window.innerWidth;
    });

    function renderSubtitle() {
      document.getElementById('dash-subtitle').textContent =
        'Actualizado ' + new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    }

    function mpInit() {
      loadDB();
      renderSubtitle();
      renderGoal();
      renderTiles();
      renderMeses();
      renderCategorias();
    }
    window.addEventListener('mp-sync-ready', mpInit, { once: true });
    window.addEventListener('mp-sync-update', mpInit);
  </script>
  <script src="nav.js?v=20260923o"></script>
</body>
</html>
