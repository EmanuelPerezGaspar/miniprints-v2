<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MiniPrints — Dashboard</title>
  <script src="theme.js?v=20260923b"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260923b" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="ios-charts.js?v=20260923b"></script>
  <link rel="stylesheet" href="ios.css?v=20260923b" />
  <link rel="stylesheet" href="nav.css?v=20260923b" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <script type="module" src="firebase-sync.js?v=20260923b"></script>

  <!-- DASHBOARD -->
  <div class="page-container">
    <div class="dash-layout">



      <!-- Main -->
      <main class="dash-main">
        <div class="dash-header">
          <div>
            <h1 class="dash-title">Panel de Control</h1>
            <p class="dash-subtitle" id="dash-subtitle">Cargando datos…</p>
          </div>
        </div>

        <!-- Body: KPIs izquierda + contenido derecha -->
        <div class="dash-body">

          <!-- Columna izquierda: KPIs -->
          <div class="dash-left">
            <div class="kpi-grid" id="kpi-grid" role="list" aria-label="Indicadores clave"></div>
          </div>

          <!-- Contenido derecha -->
          <div class="dash-content">

            <!-- Meta del mes -->
            <section class="goal-widget" id="goal-card" aria-label="Meta del mes"></section>

            <!-- Alertas de re-orden -->
            <div id="alert-banner"></div>

            <!-- Stats strip: métricas rápidas -->
            <div class="stats-strip" id="stats-strip"></div>

            <!-- Charts -->
            <div class="charts-row">
              <div class="chart-card">
                <div class="chart-header">
                  <span class="chart-title">Ingresos — últimos 6 meses</span>
                </div>
                <div class="chart-wrap">
                  <canvas id="chartRevenue" aria-label="Gráfico de ingresos mensuales" role="img"></canvas>
                </div>
              </div>
              <div class="chart-card chart-wide">
                <div class="chart-header">
                  <span class="chart-title">Piezas más vendidas</span>
                  <div class="chart-toggle">
                    <button class="ct-btn active" id="ct-uds" onclick="setPiezasMode('uds')">Unidades</button>
                    <button class="ct-btn" id="ct-ing" onclick="setPiezasMode('ing')">Ingresos</button>
                  </div>
                </div>
                <div class="chart-wrap">
                  <canvas id="chartStatus" aria-label="Piezas más vendidas" role="img"></canvas>
                </div>
              </div>
            </div>

            <!-- Tables -->
            <div class="tables-row">
              <div class="table-card">
                <div class="table-head">
                  <span class="table-title">Ventas recientes</span>
                  <a href="ventas.html" class="link-all">Ver todas →</a>
                </div>
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th scope="col">Pieza</th>
                        <th scope="col">Cant.</th>
                        <th scope="col">Total</th>
                        <th scope="col">Fecha</th>
                      </tr>
                    </thead>
                    <tbody id="tbody-ventas"></tbody>
                  </table>
                </div>
              </div>

              <div class="table-card">
                <div class="table-head">
                  <span class="table-title">Stock de materiales</span>
                  <a href="stock-material.html" class="link-all">Ver inventario →</a>
                </div>
                <div id="mat-list" class="top-products"></div>
              </div>
            </div>

          </div><!-- /dash-content -->
        </div><!-- /dash-body -->
      </main>
    </div>
  </div>

  <script>

    const DB = { materials: {}, piezas: {}, ventas: [], cotizaciones: [] };
    function ventaItems(v) { return v.items || [{ pieza: v.pieza, cantidad: v.cantidad, precio: v.precio }]; }
    function ventaPagada(v) { return !v.estatusPago || v.estatusPago === 'pagado'; }
    function loadDB() {
      try { const m = localStorage.getItem('mp_materials');    if (m) DB.materials    = JSON.parse(m); } catch(e){}
      try { const p = localStorage.getItem('mp_piezas');       if (p) DB.piezas       = JSON.parse(p); } catch(e){}
      try { const v = localStorage.getItem('mp_ventas');       if (v) DB.ventas       = JSON.parse(v); } catch(e){}
      try { const c = localStorage.getItem('mp_cotizaciones'); if (c) DB.cotizaciones = JSON.parse(c); } catch(e){}
    }

    const fmt = n => '$' + parseFloat(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
    function mesKey(v) {
      if (!v.fecha) return '';
      if (v.fecha.match(/^\d{4}-\d{2}-\d{2}$/)) return v.fecha.substring(0,7);
      const parts = v.fecha.split(' ');
      const meses = {ene:'01',feb:'02',mar:'03',abr:'04',may:'05',jun:'06',jul:'07',ago:'08',sep:'09',oct:'10',nov:'11',dic:'12'};
      if (parts.length >= 3) { const m = meses[parts[1]?.toLowerCase()?.substring(0,3)]||'01'; return `${parts[2]}-${m}`; }
      return v.fecha.substring(0,7);
    }

    function genDots(count, radius, cx, cy) {
      const dots = [];
      for (let i = 0; i < count; i++) {
        const a = (i / count) * 2 * Math.PI;
        dots.push({
          x: Math.round((cx + radius * Math.cos(a)) * 100) / 100,
          y: Math.round((cy + radius * Math.sin(a)) * 100) / 100,
          delay: (i * 0.018).toFixed(3)
        });
      }
      return dots;
    }

    function renderKPIs() {
      const ingresos = DB.ventas.filter(ventaPagada).reduce((s,v)=>s+ventaItems(v).reduce((si,it)=>si+it.precio*it.cantidad,0),0);
      const ganancia = ingresos - DB.cotizaciones.reduce((s,c)=>s+(c.costo_base||0),0);
      const totalPiezas = Object.values(DB.piezas).reduce((s,n)=>s+n,0);
      const totalMateriales = Object.keys(DB.materials).length;
      const critico = Object.values(DB.materials).filter(m=>m.pesoTotal<=200).length;
      const margen = ingresos > 0 ? ((ganancia/ingresos)*100).toFixed(1) : '0';
      const gananciaColor = parseFloat(margen)>=20?IOSC.green:parseFloat(margen)>=10?IOSC.yellow:IOSC.red;

      const costoProduccion = DB.cotizaciones.reduce((s,c)=>s+(c.costo_base||0),0);
      const coverageRatio  = costoProduccion > 0 ? ingresos / costoProduccion : (ingresos > 0 ? 1 : 0);
      const coveragePct    = (coverageRatio * 100).toFixed(1);
      const coverageFrac   = Math.min(coverageRatio, 1);
      const dotColor       = coverageRatio >= 1 ? IOSC.green : coverageRatio >= 0.5 ? IOSC.yellow : IOSC.red;

      const outerDots = genDots(36, 68, 80, 80);
      const innerDots = genDots(24, 52, 80, 80);
      const outerLit  = Math.round(36 * coverageFrac);
      const innerLit  = Math.round(24 * coverageFrac);
      const outerSvg  = outerDots.map((d,i)=>`<circle class="kc-dot" cx="${d.x}" cy="${d.y}" r="3" fill="${dotColor}" opacity="${i<outerLit?'0.75':'0.15'}" style="animation-delay:${d.delay}s"/>`).join('');
      const innerSvg  = innerDots.map((d,i)=>`<circle class="kc-dot" cx="${d.x}" cy="${d.y}" r="3" fill="${dotColor}" opacity="${i<innerLit?'0.75':'0.15'}" style="animation-delay:${(+d.delay+0.4).toFixed(3)}s"/>`).join('');

      document.getElementById('kpi-grid').innerHTML = `
        <div class="kpi-combined-card">
          <div class="kc-dots-wrap">
            <svg class="kc-svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
              ${outerSvg}${innerSvg}
            </svg>
            <div class="kc-center">
              <div class="kc-total-label">Cobertura</div>
              <div class="kc-total-value" style="color:${dotColor};">${coveragePct}%</div>
            </div>
            <div class="kc-fade"></div>
          </div>
          <div class="kc-bottom">
            <div class="kc-stat">
              <div class="kc-stat-header">
                <div class="kc-stat-bar" style="background:var(--ios-purple);"></div>
                <span class="kc-stat-label">Costo Prod.</span>
              </div>
              <div class="kc-stat-value">${fmt(costoProduccion)}</div>
              <div class="kc-stat-sub">Base 100%</div>
            </div>
            <div class="kc-stat">
              <div class="kc-stat-header">
                <div class="kc-stat-bar" style="background:${dotColor};"></div>
                <span class="kc-stat-label">Ingresos</span>
              </div>
              <div class="kc-stat-value" style="color:${dotColor};">${fmt(ingresos)}</div>
              <div class="kc-stat-sub">${DB.ventas.length} ventas</div>
            </div>
          </div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><span class="kpi-label">Piezas en stock</span>
            <div class="kpi-icon" style="background:rgba(10,132,255,0.12);"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="${IOSC.blue}" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div>
          </div>
          <div class="kpi-value">${totalPiezas}</div>
          <div class="kpi-change neutral" style="color:var(--text-dim);">${Object.keys(DB.piezas).length} modelos</div>
          ${(()=>{
            const piezaMap = {};
            DB.ventas.forEach(v=>{ ventaItems(v).forEach(it=>{ piezaMap[it.pieza]=(piezaMap[it.pieza]||0)+it.cantidad; }); });
            const totalVendidas = Object.values(piezaMap).reduce((s,n)=>s+n,0);
            const top = Object.entries(piezaMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
            if(!top.length) return '';
            return `<div class="pieces-list">${top.map(([nombre,qty],i)=>{
              const pct = totalVendidas>0?((qty/totalVendidas)*100).toFixed(1):'0';
              const delay = (i*0.07).toFixed(2);
              return `<div class="psi" style="animation-delay:${delay}s">
                <div class="psi-left">
                  <div class="psi-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${IOSC.blue}" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                  </div>
                  <div class="psi-info">
                    <div class="psi-name" title="${nombre}">${nombre}</div>
                    <div class="psi-rank">#${i+1} más vendida</div>
                  </div>
                </div>
                <div class="psi-right">
                  <div class="psi-qty">${qty} uds</div>
                  <div class="psi-pct">
                    <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="18 15 12 9 6 15"/></svg>
                    ${pct}%
                  </div>
                </div>
              </div>`;
            }).join('')}</div>`;
          })()}
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><span class="kpi-label">Materiales</span>
            <div class="kpi-icon" style="background:rgba(${critico>0?'239,68,68':'167,139,250'},0.12);"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="${critico>0?IOSC.red:IOSC.purple}" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></div>
          </div>
          <div class="kpi-value">${totalMateriales}</div>
          <div class="kpi-change neutral" style="color:${critico>0?IOSC.red:'var(--text-dim)'};">${critico>0?critico+' en stock crítico':'Stock OK'}</div>
        </div>`;

      const now = new Date();
      document.getElementById('dash-subtitle').textContent =
        'Actualizado ' + now.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    }

    function renderVentas() {
      const recientes = [...DB.ventas].reverse().slice(0,7);
      document.getElementById('tbody-ventas').innerHTML = recientes.length
        ? recientes.map(v=>{
            const items  = ventaItems(v);
            const totalV = items.reduce((s,it)=>s+it.precio*it.cantidad,0);
            const cantV  = items.reduce((s,it)=>s+it.cantidad,0);
            const piezaLbl = items.length===1
              ? (items[0].pieza||'—')
              : items.map(it=>it.pieza.split(' ')[0]+'×'+it.cantidad).join(' · ');
            const titleAttr = items.length>1 ? ` title="${items.map(it=>it.pieza+' ×'+it.cantidad).join(', ')}"` : '';
            return `<tr>
              <td${titleAttr}>${piezaLbl}</td>
              <td>${cantV}</td>
              <td style="color:var(--ios-green);font-weight:600;">${fmt(totalV)}</td>
              <td style="color:var(--text-dim);font-size:0.8rem;">${v.fecha||'—'}</td>
            </tr>`;
          }).join('')
        : `<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--text-dim);">Sin ventas registradas — <a href="ventas.html" style="color:var(--primary);">Registrar venta</a></td></tr>`;
    }

    // ── Stats strip ──────────────────────────────────
    function localYM(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
    function getMesActual() { return localYM(new Date()); }
    function getMesAnterior() { const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return localYM(d); }

    function renderStatsStrip() {
      const now = getMesActual(), prev = getMesAnterior();
      const vEste = DB.ventas.filter(v=>mesKey(v)===now);
      const vPrev = DB.ventas.filter(v=>mesKey(v)===prev);
      const ingEste = vEste.filter(ventaPagada).reduce((s,v)=>s+ventaItems(v).reduce((si,it)=>si+it.precio*it.cantidad,0),0);
      const ingPrev = vPrev.filter(ventaPagada).reduce((s,v)=>s+ventaItems(v).reduce((si,it)=>si+it.precio*it.cantidad,0),0);
      const tendPct  = ingPrev>0 ? ((ingEste-ingPrev)/ingPrev*100) : null;
      const tendUp   = tendPct!==null && tendPct>=0;

      const ventasPag = DB.ventas.filter(ventaPagada);
      const ticket = ventasPag.length ? ventasPag.reduce((s,v)=>s+ventaItems(v).reduce((si,it)=>si+it.precio*it.cantidad,0),0)/ventasPag.length : 0;

      const cotEste = DB.cotizaciones.filter(c=>{ try{ return (c.fecha||'').slice(0,7)===now; }catch(e){ return false; }});
      const totalCot = cotEste.reduce((s,c)=>s+(c.total||0),0);
      const ganCot   = cotEste.reduce((s,c)=>s+(c.ganancia||0),0);
      const margenMes = totalCot>0 ? (ganCot/totalCot*100).toFixed(1)+'%' : '—';

      const convRate = cotEste.length>0 ? (vEste.length/cotEste.length*100).toFixed(0)+'%' : '—';

      document.getElementById('stats-strip').innerHTML = `
        <div class="stat-chip">
          <span class="sc-label">Este mes</span>
          <span class="sc-value">${fmt(ingEste)}</span>
          ${tendPct!==null
            ? `<span class="sc-trend ${tendUp?'up':'down'}"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="${tendUp?'18 15 12 9 6 15':'6 9 12 15 18 9'}"/></svg>${Math.abs(tendPct).toFixed(1)}% vs mes ant.</span>`
            : `<span class="sc-trend neutral">Sin datos anteriores</span>`}
        </div>
        <div class="stat-chip">
          <span class="sc-label">Ticket promedio</span>
          <span class="sc-value">${fmt(ticket)}</span>
          <span class="sc-trend neutral">${DB.ventas.length} órdenes</span>
        </div>
        <div class="stat-chip">
          <span class="sc-label">Margen del mes</span>
          <span class="sc-value">${margenMes}</span>
          <span class="sc-trend neutral">${cotEste.length} cotizaciones</span>
        </div>
        <div class="stat-chip">
          <span class="sc-label">Cotiz. → Venta</span>
          <span class="sc-value">${convRate}</span>
          <span class="sc-trend neutral">${vEste.length}/${cotEste.length} este mes</span>
        </div>`;
    }

    // ── Meta mensual ─────────────────────────────────
    function renderGoal() {
      const meta   = parseFloat(localStorage.getItem('mp_meta_mensual')||'0');
      const ingEste = DB.ventas.filter(v=>ventaPagada(v)&&mesKey(v)===getMesActual()).reduce((s,v)=>s+ventaItems(v).reduce((si,it)=>si+it.precio*it.cantidad,0),0);
      const pct    = meta>0 ? Math.min(ingEste/meta*100,100) : 0;
      const R = 38, C = 2 * Math.PI * R;
      const fmtCorto = n => '$' + Math.round(n).toLocaleString('es-MX');
      document.getElementById('goal-card').innerHTML = `
        <div class="gw-top">
          <span class="gw-chip">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
            Meta del mes
          </span>
          <button class="gw-edit" type="button" onclick="toggleGoalInput()" aria-label="Editar meta">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
          </button>
        </div>
        <div class="gw-body">
          <div class="gw-text">
            <h2 class="gw-title">${meta>0 ? (pct>=100 ? '¡Meta cumplida!' : 'Tu progreso del mes') : 'Define tu meta del mes'}</h2>
            <p class="gw-sub">${meta>0 ? `${fmtCorto(ingEste)} de ${fmtCorto(meta)}` : 'Toca el lápiz para fijarla'}</p>
          </div>
          <div class="gw-ring" role="img" aria-label="${meta>0 ? pct.toFixed(0)+'% de la meta' : 'Sin meta'}">
            <svg viewBox="0 0 96 96" aria-hidden="true">
              <circle class="gw-track" cx="48" cy="48" r="${R}"/>
              <circle class="gw-arc" cx="48" cy="48" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-offset="${C * (1 - pct / 100)}"/>
            </svg>
            <div class="gw-center"><span class="gw-num">${meta>0 ? Math.floor(pct) + '%' : '—'}</span><span class="gw-unit">${meta>0 ? 'logrado' : 'sin meta'}</span></div>
          </div>
        </div>
        <div class="goal-input-wrap" id="goal-input-wrap">
          <input class="goal-input" id="goal-input" type="number" inputmode="decimal" placeholder="Ej: 15000" value="${meta||''}" aria-label="Meta mensual en pesos">
          <button class="goal-save-btn" onclick="saveGoal()">Guardar</button>
        </div>`;
      // Anima el anillo desde cero, como los widgets de iOS
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const arc = document.querySelector('#goal-card .gw-arc');
        if (arc) arc.style.strokeDashoffset = arc.dataset.offset;
      }));
    }
    function toggleGoalInput() { document.getElementById('goal-input-wrap').classList.toggle('open'); }
    function saveGoal() {
      const v = parseFloat(document.getElementById('goal-input').value);
      if (!isNaN(v)&&v>0) { localStorage.setItem('mp_meta_mensual',v); document.getElementById('goal-input-wrap').classList.remove('open'); renderGoal(); }
    }

    // ── Alertas de re-orden ──────────────────────────
    function renderAlerts() {
      const DAYS = 14;
      const alerts = [];
      try {
        const hist = JSON.parse(localStorage.getItem('mp_historial')||'{}');
        const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
        const gramsPerMat = {};
        DB.ventas.filter(v=>{ try{ return new Date(v.fecha)>=cutoff; }catch(e){ return false; }})
          .forEach(v=>{ ventaItems(v).forEach(it=>{ (hist[it.pieza]||[]).forEach(e=>{ gramsPerMat[e.matId]=(gramsPerMat[e.matId]||0)+e.grams*it.cantidad; }); }); });
        Object.entries(DB.materials).forEach(([id,mat])=>{
          const daily = (gramsPerMat[id]||0)/30;
          if (daily>0) { const days=Math.round(mat.pesoTotal/daily); if(days<=DAYS) alerts.push({mat,days,clr:days<=3?IOSC.red:days<=7?IOSC.orange:IOSC.yellow}); }
          else if (mat.pesoTotal<=200 && !alerts.find(a=>a.mat.id===id)) alerts.push({mat,days:null,clr:IOSC.red});
        });
      } catch(e) {
        Object.values(DB.materials).filter(m=>m.pesoTotal<=200).forEach(mat=>alerts.push({mat,days:null,clr:IOSC.red}));
      }
      const el = document.getElementById('alert-banner');
      if (!alerts.length) { el.innerHTML=''; return; }
      alerts.sort((a,b)=>(a.days??0)-(b.days??0));
      el.innerHTML = `<div class="alert-banner">
        <div class="alert-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
        <div class="alert-content">
          <div class="alert-title">Filamentos en riesgo</div>
          ${alerts.slice(0,5).map(a=>`<div class="alert-item" style="color:${a.clr};">· ${a.mat.marca} ${a.mat.color} (${a.mat.tipo}) — ${a.mat.pesoTotal}g${a.days!==null?' · ~'+a.days+' días':' · stock crítico'}</div>`).join('')}
        </div></div>`;
    }

    function renderMateriales() {
      const mats = Object.values(DB.materials).sort((a,b)=>a.pesoTotal-b.pesoTotal).slice(0,5);
      const maxPeso = Math.max(...mats.map(m=>m.pesoTotal), 1);
      document.getElementById('mat-list').innerHTML = mats.length
        ? mats.map((m,i)=>{
            const color = m.pesoTotal<=200?IOSC.red:m.pesoTotal<=500?IOSC.yellow:IOSC.green;
            const pct = Math.round((m.pesoTotal/maxPeso)*100);
            return `<div class="top-product-row">
              <span class="tp-rank">#${i+1}</span>
              <div class="tp-icon" style="background:${color}20;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/></svg></div>
              <span class="tp-name" style="font-size:0.78rem;">${m.marca} ${m.color}</span>
              <span class="tp-sales" style="color:${color};font-size:0.78rem;">${m.pesoTotal}g</span>
              <div class="tp-bar-wrap"><div class="tp-bar-track"><div class="tp-bar-fill" style="width:${pct}%;background:${color};"></div></div></div>
            </div>`;
          }).join('')
        : `<div style="padding:24px;text-align:center;color:var(--text-dim);font-size:0.85rem;">Sin materiales — <a href="stock-material.html" style="color:var(--primary);">Agregar</a></div>`;
    }

    let chartRev = null, chartTop = null;
    let piezasMode = 'uds';
    function setPiezasMode(mode) {
      piezasMode = mode;
      document.getElementById('ct-uds').classList.toggle('active', mode==='uds');
      document.getElementById('ct-ing').classList.toggle('active', mode==='ing');
      renderPiezasChart();
    }

    function renderCharts() {

      // Ingresos line chart
      if (chartRev) { chartRev.destroy(); chartRev = null; }
      const meses = [];
      for (let i=5;i>=0;i--) { const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); meses.push(localYM(d)); }
      const ingPorMes = meses.map(m=>DB.ventas.filter(v=>ventaPagada(v)&&mesKey(v)===m).reduce((s,v)=>s+ventaItems(v).reduce((si,it)=>si+it.precio*it.cantidad,0),0));
      const labM = meses.map(m=>{ const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString('es-MX',{month:'short',year:'2-digit'}); });
      // Barras por mes estilo app Salud: el mes actual resaltado
      const ultimo = ingPorMes.length - 1;
      chartRev = new Chart(document.getElementById('chartRevenue'),{
        type:'bar',
        data:{labels:labM,datasets:[{label:'Ingresos',data:ingPorMes,
          backgroundColor:ingPorMes.map((_,i)=>i===ultimo?IOS.green:IOS.greenSoft),
          hoverBackgroundColor:IOS.green,maxBarThickness:44,borderRadius:8}]},
        options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>fmt(ctx.parsed.y)}}},
          scales:IOS.scales(v=>v>=1000?'$'+(v/1000).toFixed(1)+'k':'$'+v)}
      });

      // Piezas bar chart
      renderPiezasChart();
    }

    function renderPiezasChart() {
      if (chartTop) { chartTop.destroy(); chartTop = null; }
      const piezaMap = {};
      DB.ventas.forEach(v=>{
        ventaItems(v).forEach(it=>{
          if (!piezaMap[it.pieza]) piezaMap[it.pieza]={uds:0,ing:0};
          piezaMap[it.pieza].uds += it.cantidad;
          piezaMap[it.pieza].ing += it.precio*it.cantidad;
        });
      });
      const sorted = Object.entries(piezaMap).sort((a,b)=>b[1][piezasMode]-a[1][piezasMode]).slice(0,6);
      if (sorted.length) {
        const vals = sorted.map(([,d])=>d[piezasMode]);
        chartTop = new Chart(document.getElementById('chartStatus'),{
          type:'bar',
          data:{labels:sorted.map(([p])=>p.length>16?p.substring(0,16)+'…':p),datasets:[{label:piezasMode==='uds'?'Unidades':'Ingresos',data:vals,
            backgroundColor:vals.map((_,i)=>i===0?IOS.green:IOS.greenSoft),hoverBackgroundColor:IOS.green,barThickness:18,borderRadius:999}]},
          options:{indexAxis:'y',interaction:{mode:'nearest',axis:'y',intersect:false},
            plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>piezasMode==='uds'?`${ctx.raw} uds`:fmt(ctx.raw)}}},
            scales:{
              x:{position:'top',grid:{color:IOS.grid,drawTicks:false},border:{display:false,dash:[3,3]},ticks:{color:IOS.label2,maxTicksLimit:5,padding:6,callback:v=>piezasMode==='ing'?(v>=1000?'$'+(v/1000).toFixed(1)+'k':'$'+v):v}},
              y:{grid:{display:false},border:{display:false},ticks:{color:IOS.text,font:{size:13},padding:10}}}}
        });
      } else {
        const el = document.getElementById('chartStatus');
        if(el) el.parentElement.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-size:0.85rem;">Registra ventas para ver el ranking</div>';
      }
    }

    function mpInit() {
      loadDB();
      renderKPIs();
      renderVentas();
      renderMateriales();
      renderStatsStrip();
      renderGoal();
      renderAlerts();
      setTimeout(renderCharts, 50);
    }
    window.addEventListener('mp-sync-ready', mpInit, { once: true });
    window.addEventListener('mp-sync-update', mpInit);
  </script>
  <script src="nav.js?v=20260923b"></script>
</body>
