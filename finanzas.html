<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MiniPrints — Finanzas</title>
  <script src="theme.js?v=20260924g"></script>
  <script src="inventario.js?v=20260924g"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260924g" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="ios-charts.js?v=20260924g"></script>
  <link rel="stylesheet" href="ios.css?v=20260924g" />
  <link rel="stylesheet" href="nav.css?v=20260924g" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MiniPrints" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <script type="module" src="firebase-sync.js?v=20260924g"></script>

  <div class="page-container">
    <main class="dash-main">
      <div class="dash-header inv-header">
        <div>
          <h1 class="dash-title">Finanzas</h1>
          <p class="dash-subtitle" id="fn-sub">Cuánto entra, cuánto cuesta y cuánto ganas.</p>
        </div>
      </div>

      <div class="hx-wrap">
        <div class="cq-seg" data-for="f-periodo" role="radiogroup" aria-label="Periodo">
          <button type="button" data-v="mes">Este mes</button>
          <button type="button" data-v="3m">3 meses</button>
          <button type="button" data-v="anio">Este año</button>
          <button type="button" data-v="todo">Todo</button>
        </div>
        <input type="hidden" id="f-periodo" value="mes" />

        <!-- Ganancia del periodo -->
        <section class="fn-card" id="fn-hero" aria-label="Ganancia del periodo"></section>

        <div class="inv-sum is-4" id="fn-sum"></div>

        <!-- Ingresos y costos por mes -->
        <section class="month-card" aria-labelledby="fn-mes-t">
          <div class="month-head">
            <div>
              <h2 class="month-title" id="fn-mes-t">Ingresos y costos</h2>
              <div class="month-caption" id="fn-mes-cap"></div>
            </div>
          </div>
          <div class="month-chart"><canvas id="chart-meses" role="img" aria-label="Ingresos y costos por mes"></canvas></div>
        </section>

        <h2 class="fn-sec-title">Por pieza</h2>
        <div id="fn-piezas"></div>

        <h2 class="fn-sec-title">Formas de pago</h2>
        <div id="fn-pagos"></div>
      </div>
    </main>
  </div>

  <script>
    const { esc, money, money0, fecha: F } = MP_INV;
    const DB = { materials: {}, ventas: [], cotizaciones: [] };
    let chart = null;

    const ventaItems = v => v.items || [{ pieza: v.pieza, cantidad: v.cantidad, precio: v.precio }];
    const ventaPagada = v => !v.estatusPago || v.estatusPago === 'pagado';
    const totalDe = v => ventaItems(v).reduce((s, it) => s + (Number(it.precio) || 0) * (Number(it.cantidad) || 0), 0);
    const fechaCot = c => (c.id > 1e11 ? F.isoDe(new Date(c.id)) : '') || F.iso(c.fecha);

    function loadDB() {
      const get = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
      DB.materials = get('mp_materials', {});
      DB.ventas = get('mp_ventas', []);
      DB.cotizaciones = get('mp_cotizaciones', []);
    }

    function desde() {
      const p = document.getElementById('f-periodo').value, d = new Date();
      if (p === 'mes') return F.isoDe(new Date(d.getFullYear(), d.getMonth(), 1));
      if (p === '3m') return F.isoDe(new Date(d.getFullYear(), d.getMonth() - 2, 1));
      if (p === 'anio') return `${d.getFullYear()}-01-01`;
      return '';
    }
    const NOMBRE = { mes: 'Este mes', '3m': 'Últimos 3 meses', anio: 'Este año', todo: 'Desde el inicio' };

    // Costo por unidad de cada pieza, sacado de sus cotizaciones aceptadas
    function costosUnitarios() {
      const acc = {};
      DB.cotizaciones.filter(c => c.fue_aceptada === true && c.pieza).forEach(c => {
        const a = acc[c.pieza] = acc[c.pieza] || { costo: 0, uds: 0 };
        a.costo += c.costo_base || 0; a.uds += Number(c.cantidad) || 1;
      });
      return Object.fromEntries(Object.entries(acc).map(([p, a]) => [p, a.uds ? a.costo / a.uds : 0]));
    }

    function render() {
      const d0 = desde();
      const ventas = DB.ventas.filter(v => !d0 || F.iso(v.fecha) >= d0);
      const pagadas = ventas.filter(ventaPagada);
      const aceptadas = DB.cotizaciones.filter(c => c.fue_aceptada === true && (!d0 || fechaCot(c) >= d0));
      const ingresos = pagadas.reduce((s, v) => s + totalDe(v), 0);
      const costos = aceptadas.reduce((s, c) => s + (c.costo_base || 0), 0);
      const ganancia = ingresos - costos;
      const margen = ingresos > 0 ? Math.round(ganancia / ingresos * 100) : 0;
      const porCobrar = ventas.filter(v => !ventaPagada(v)).reduce((s, v) => s + totalDe(v), 0);
      const valorMat = Object.values(DB.materials).reduce((s, m) => s + (m.pesoTotal / 1000) * m.costo, 0);
      const st = ganancia < 0 ? 'st-crit' : margen >= 30 ? 'st-ok' : 'st-low';

      document.getElementById('fn-sub').textContent = NOMBRE[document.getElementById('f-periodo').value];

      const pctCosto = ingresos > 0 ? Math.min(100, costos / ingresos * 100) : (costos > 0 ? 100 : 0);
      document.getElementById('fn-hero').className = 'fn-card ' + st;
      document.getElementById('fn-hero').innerHTML = `
        <span class="fn-label">Ganancia</span>
        <div class="fn-big"><span class="fn-big-num">${money0(ganancia)}</span>${ingresos > 0 ? `<span class="fn-pill">Margen ${margen}%</span>` : ''}</div>
        <div class="fn-split" aria-hidden="true">
          <i style="width:${pctCosto}%;background:var(--ios-orange)"></i>
          <i style="flex:1;background:${ganancia >= 0 ? 'var(--ios-green)' : 'transparent'}"></i>
        </div>
        <div class="fn-legend">
          <div class="fn-legend-row"><i style="background:var(--ios-blue)"></i><span>Ingresos cobrados</span><span>${money(ingresos)}</span></div>
          <div class="fn-legend-row"><i style="background:var(--ios-orange)"></i><span>Costo de producción</span><span>− ${money(costos)}</span></div>
          <div class="fn-legend-row"><i style="background:var(--ios-green)"></i><span>Te queda</span><span style="color:var(--st-color)">${money(ganancia)}</span></div>
        </div>
        <p class="fn-note">El costo sale de las cotizaciones aceptadas (material, luz, desgaste, mano de obra y fallas).</p>`;

      document.getElementById('fn-sum').innerHTML = `
        <div class="inv-tile" style="--tile-color:var(--ios-blue)">
          <span class="inv-tile-lbl"><i></i>Ventas</span>
          <span class="inv-tile-num">${pagadas.length}</span>
          <span class="inv-tile-sub">ticket ${money0(pagadas.length ? ingresos / pagadas.length : 0)}</span>
        </div>
        <a class="inv-tile" href="historial-ventas.html" style="--tile-color:${porCobrar ? 'var(--ios-orange)' : 'var(--ios-green)'};text-decoration:none">
          <span class="inv-tile-lbl"><i></i>Por cobrar</span>
          <span class="inv-tile-num">${money0(porCobrar)}</span>
          <span class="inv-tile-sub">${porCobrar ? 'ver pendientes' : 'todo cobrado'}</span>
        </a>
        <div class="inv-tile" style="--tile-color:var(--ios-purple)">
          <span class="inv-tile-lbl"><i></i>Impresiones</span>
          <span class="inv-tile-num">${aceptadas.length}</span>
          <span class="inv-tile-sub">cotizaciones aceptadas</span>
        </div>
        <a class="inv-tile" href="stock-material.html" style="--tile-color:var(--ios-teal);text-decoration:none">
          <span class="inv-tile-lbl"><i></i>Material</span>
          <span class="inv-tile-num">${money0(valorMat)}</span>
          <span class="inv-tile-sub">en inventario</span>
        </a>`;

      renderMeses();
      renderPiezas(pagadas);
      renderPagos(pagadas, ingresos);
    }

    function renderMeses() {
      const p = document.getElementById('f-periodo').value;
      const n = p === 'anio' ? new Date().getMonth() + 1 : p === '3m' ? 3 : 6;
      const meses = [];
      for (let i = n - 1; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); meses.push(F.isoDe(d).slice(0, 7)); }
      const ing = meses.map(m => DB.ventas.filter(v => ventaPagada(v) && F.mesKey(F.iso(v.fecha)) === m).reduce((s, v) => s + totalDe(v), 0));
      const cos = meses.map(m => DB.cotizaciones.filter(c => c.fue_aceptada === true && F.mesKey(fechaCot(c)) === m).reduce((s, c) => s + (c.costo_base || 0), 0));
      document.getElementById('fn-mes-cap').textContent = `Últimos ${n} ${n === 1 ? 'mes' : 'meses'} · ingresos cobrados vs costo de producción`;
      if (!window.Chart) return;
      if (chart) chart.destroy();
      const fmtY = v => v >= 1000 ? '$' + (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : '$' + v;
      chart = new Chart(document.getElementById('chart-meses'), {
        type: 'bar',
        data: {
          labels: meses.map(m => F.mesNombre(m, true)),
          datasets: [
            { label: 'Ingresos', data: ing, backgroundColor: IOS.blue, borderRadius: 6, maxBarThickness: 22 },
            { label: 'Costos', data: cos, backgroundColor: IOS.orange, borderRadius: 6, maxBarThickness: 22 },
          ],
        },
        options: {
          datasets: { bar: { categoryPercentage: 0.66, barPercentage: 0.88 } },
          plugins: {
            legend: { display: true, labels: { color: IOS.label2 } },
            tooltip: { displayColors: true, usePointStyle: true, callbacks: {
              title: items => F.mesNombre(meses[items[0].dataIndex]),
              label: ctx => ` ${ctx.dataset.label}: ${money0(ctx.parsed.y)}`,
            } },
          },
          scales: IOS.scales(fmtY, { y: { beginAtZero: true, ticks: { color: IOS.label2, font: { size: 11 }, padding: 6, maxTicksLimit: 4, callback: fmtY } } }),
        },
      });
    }

    function renderPiezas(pagadas) {
      const cu = costosUnitarios();
      const acc = {};
      pagadas.forEach(v => ventaItems(v).forEach(it => {
        const a = acc[it.pieza] = acc[it.pieza] || { ing: 0, uds: 0 };
        a.ing += (Number(it.precio) || 0) * (Number(it.cantidad) || 0); a.uds += Number(it.cantidad) || 0;
      }));
      const filas = Object.entries(acc).sort((a, b) => b[1].ing - a[1].ing).slice(0, 12);
      const cont = document.getElementById('fn-piezas');
      if (!filas.length) { cont.innerHTML = '<div class="hx-empty">Sin ventas cobradas en este periodo.</div>'; return; }
      const max = filas[0][1].ing || 1;
      cont.innerHTML = `<div class="hx-list is-plain">${filas.map(([p, a]) => {
        const costo = cu[p] != null ? cu[p] * a.uds : null;
        const gan = costo != null ? a.ing - costo : null;
        const m = gan != null && a.ing > 0 ? Math.round(gan / a.ing * 100) : null;
        const st = m == null ? 'st-mute' : gan < 0 ? 'st-crit' : m >= 30 ? 'st-ok' : 'st-low';
        return `<div class="hx-row ${st}" style="cursor:default">
          <span class="hx-text">
            <span class="hx-title">${esc(p)}</span>
            <span class="hx-meta">${a.uds} vendida${a.uds !== 1 ? 's' : ''} · ${m == null ? 'sin costo registrado' : 'margen ' + m + '%'}</span>
          </span>
          <span class="hx-right">
            <span class="hx-amt">${money0(a.ing)}</span>
            <span class="fn-share" aria-hidden="true"><i style="width:${(a.ing / max * 100).toFixed(0)}%"></i></span>
          </span>
        </div>`;
      }).join('')}</div>`;
    }

    function renderPagos(pagadas, ingresos) {
      const METODOS = [['Efectivo', 'st-ok'], ['Transferencia', 'st-info'], ['Tarjeta', 'st-low']];
      const cont = document.getElementById('fn-pagos');
      if (!pagadas.length) { cont.innerHTML = '<div class="hx-empty">Sin pagos en este periodo.</div>'; return; }
      cont.innerHTML = `<div class="hx-list is-plain">${METODOS.map(([m, st]) => {
        const vs = pagadas.filter(v => (v.metodoPago || 'Efectivo') === m);
        const monto = vs.reduce((s, v) => s + totalDe(v), 0);
        const pct = ingresos > 0 ? Math.round(monto / ingresos * 100) : 0;
        return `<div class="hx-row ${st}" style="cursor:default">
          <span class="hx-text"><span class="hx-title">${m}</span><span class="hx-meta">${vs.length} venta${vs.length !== 1 ? 's' : ''} · ${pct}%</span></span>
          <span class="hx-right"><span class="hx-amt">${money0(monto)}</span><span class="fn-share" aria-hidden="true"><i style="width:${pct}%"></i></span></span>
        </div>`;
      }).join('')}</div>`;
    }

    document.getElementById('f-periodo').addEventListener('change', () => { MP_INV.syncChips(); render(); });

    function mpInit() { loadDB(); MP_INV.syncChips(); render(); }
    window.addEventListener('mp-sync-ready', mpInit, { once: true });
    window.addEventListener('mp-sync-update', mpInit);
  </script>
  <script src="nav.js?v=20260924g"></script>
</body>
</html>
