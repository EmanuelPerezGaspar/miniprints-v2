<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MiniPrints — Historial de ventas</title>
  <script src="theme.js?v=20261007h"></script>
  <script src="whatsapp.js?v=20261007h"></script>
  <script src="inventario.js?v=20261007h"></script>
  <link rel="stylesheet" href="styles.css?v=20261007h" />
  <style>
    #toast { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); z-index: 1200; display: none; }
  </style>
  <link rel="stylesheet" href="ios.css?v=20261007h" />
  <link rel="stylesheet" href="nav.css?v=20261007h" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png?v=4" />
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=4" />
  <link rel="icon" type="image/svg+xml" href="icon.svg?v=4" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MiniPrints" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <script type="module" src="firebase-sync.js?v=20261007h"></script>

  <div class="page-container">
    <main class="dash-main">
      <div class="dash-header inv-header">
        <div>
          <h1 class="dash-title">Historial de ventas</h1>
          <p class="dash-subtitle" id="hx-sub">Tus ventas y cobros pendientes.</p>
        </div>
        <div class="inv-actions">
          <a class="inv-icon-btn" href="ventas.html" aria-label="Volver a Ventas">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          </a>
        </div>
      </div>

      <div class="hx-wrap">
        <div class="cq-seg" data-for="f-vista" role="radiogroup" aria-label="Vista">
          <button type="button" data-v="cal">Calendario</button>
          <button type="button" data-v="fechas">Fechas</button>
        </div>
        <input type="hidden" id="f-vista" value="cal" />
        <div id="f-rango" hidden>
          <div class="hx-dates">
            <label>Desde<input type="date" id="f-desde" /></label>
            <label>Hasta<input type="date" id="f-hasta" /></label>
          </div>
          <p class="hx-rango-info" id="hx-rango-info"></p>
        </div>

        <div class="inv-sum" id="hx-sum"></div>

        <input type="search" id="f-buscar" class="hx-search" placeholder="Buscar pieza, cliente o nota" autocomplete="off" aria-label="Buscar venta" />
        <div class="vs-cats" id="f-pago" role="radiogroup" aria-label="Filtrar por pago"></div>
        <div class="hx-info" id="hx-info"></div>

        <div id="hx-list"></div>

        <!-- Calendario del mes: punto verde = todo cobrado; naranja = hay pendientes -->
        <section class="hx-cal" id="hx-cal" aria-label="Calendario de ventas"></section>
      </div>
    </main>
  </div>

  <!-- Hoja: ventas del día elegido en el calendario -->
  <div class="sheet inv-sheet" id="sh-dia" role="dialog" aria-modal="true" aria-labelledby="sh-dia-t" hidden>
    <div class="sheet-head">
      <h2 id="sh-dia-t">Día</h2>
      <button class="sheet-close" type="button" data-sheet-close aria-label="Cerrar"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11"/></svg></button>
    </div>
    <div class="inv-hero" id="dia-hero"></div>
    <div class="hx-list" id="dia-list"></div>
  </div>

  <!-- Hoja: detalle de la venta -->
  <div class="sheet inv-sheet" id="sh-venta" role="dialog" aria-modal="true" aria-labelledby="sh-venta-t" hidden>
    <div class="sheet-head">
      <h2 id="sh-venta-t">Venta</h2>
      <button class="sheet-close hx-atras" type="button" onclick="volverDia()" aria-label="Volver a las ventas del día" hidden><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="sheet-close" type="button" data-sheet-close aria-label="Cerrar" id="v-cerrar"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11"/></svg></button>
    </div>
    <div class="inv-hero" id="v-hero"></div>
    <div class="inv-group hx-items" id="v-items"></div>
    <div class="inv-group" id="v-datos"></div>
    <div class="inv-f" id="v-cobrar">
      <span class="inv-f-lbl">Registrar el pago (hoy)</span>
      <div class="inv-quick">
        <button type="button" onclick="cobrar('Efectivo')">Efectivo</button>
        <button type="button" onclick="cobrar('Transferencia')">Transferencia</button>
        <button type="button" onclick="cobrar('Tarjeta')">Tarjeta</button>
      </div>
    </div>
    <div class="inv-btns">
      <button type="button" class="inv-btn is-plain" onclick="abrirEditar()">Editar venta</button>
      <button type="button" class="inv-btn is-wa" onclick="reenviar()">Enviar por WhatsApp</button>
      <button type="button" class="inv-btn is-danger" onclick="eliminarVenta()">Eliminar venta</button>
    </div>
  </div>

  <!-- Hoja: editar la venta -->
  <div class="sheet inv-sheet" id="sh-editar" role="dialog" aria-modal="true" aria-labelledby="sh-editar-t" hidden>
    <div class="sheet-head">
      <h2 id="sh-editar-t">Editar venta</h2>
      <button class="sheet-close" type="button" data-sheet-close aria-label="Cerrar"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11"/></svg></button>
      <button class="sheet-close hx-atras" type="button" onclick="abrirVenta(actual, !!diaAbierto, 'atras')" aria-label="Volver a la venta"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    </div>
    <div class="inv-f">
      <span class="inv-f-lbl">Piezas · pon 0 para quitar una</span>
      <div class="hx-ed-items" id="ed-items"></div>
      <p class="inv-hint" id="ed-total"></p>
    </div>
    <div class="inv-f">
      <span class="inv-f-lbl">Pago</span>
      <div class="cq-seg" data-for="ed-estatus" role="radiogroup" aria-label="Estatus del pago">
        <button type="button" data-v="pagado">Ya pagó</button>
        <button type="button" data-v="pendiente">Pendiente</button>
      </div>
      <input type="hidden" id="ed-estatus" value="pagado" />
      <div class="cq-seg" data-for="ed-metodo" role="radiogroup" aria-label="Método de pago" id="ed-metodo-seg">
        <button type="button" data-v="Efectivo">Efectivo</button>
        <button type="button" data-v="Transferencia">Transferencia</button>
        <button type="button" data-v="Tarjeta">Tarjeta</button>
      </div>
      <input type="hidden" id="ed-metodo" value="Efectivo" />
    </div>
    <div class="inv-row2">
      <div class="inv-f"><label for="ed-fecha">Fecha de venta</label><input type="date" id="ed-fecha" /></div>
      <div class="inv-f"><label for="ed-cliente">Cliente</label><input type="text" id="ed-cliente" placeholder="Opcional" maxlength="40" autocomplete="off" /></div>
    </div>
    <div class="inv-f"><label for="ed-notas">Notas</label><input type="text" id="ed-notas" placeholder="Opcional" maxlength="80" autocomplete="off" /></div>
    <div class="inv-btns">
      <button type="button" class="inv-btn" onclick="guardarEdicion()">Guardar cambios</button>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <script>
    const { esc, money, money0, fecha: F } = MP_INV;
    const DB = { piezas: {}, ventas: [] };
    const POR_PAGINA = 40;
    let limite = POR_PAGINA, pagoFiltro = 'todos';
    // Calendario: mes que se ve (AAAA-MM) y día elegido (AAAA-MM-DD)
    let mesVista = F.hoy().slice(0, 7), diaSel = F.hoy();

    const ventaItems = v => v.items || [{ pieza: v.pieza, cantidad: v.cantidad, precio: v.precio }];
    const ventaPagada = v => !v.estatusPago || v.estatusPago === 'pagado';
    const totalDe = v => ventaItems(v).reduce((s, it) => s + (Number(it.precio) || 0) * (Number(it.cantidad) || 0), 0);
    const udsDe = v => ventaItems(v).reduce((s, it) => s + (Number(it.cantidad) || 0), 0);
    const fechaVenta = v => F.iso(v.fecha);
    // El dinero cuenta el día que se cobró (si se cobró después de la venta)
    const fechaCobro = v => F.iso(v.fechaPago) || fechaVenta(v);
    const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

    function loadDB() {
      try { DB.piezas = JSON.parse(localStorage.getItem('mp_piezas')) || {}; } catch (e) { DB.piezas = {}; }
      try { DB.ventas = JSON.parse(localStorage.getItem('mp_ventas')) || []; } catch (e) { DB.ventas = []; }
      if (!Array.isArray(DB.ventas)) DB.ventas = [];
    }
    const savePiezas = () => { try { localStorage.setItem('mp_piezas', JSON.stringify(DB.piezas)); } catch (e) {} };
    const saveVentas = () => { try { localStorage.setItem('mp_ventas', JSON.stringify(DB.ventas)); } catch (e) {} };

    // ── Periodo ──
    const vista = () => document.getElementById('f-vista').value;
    function rango() {
      if (vista() === 'cal') {
        const [y, m] = mesVista.split('-').map(Number);
        return [`${mesVista}-01`, F.isoDe(new Date(y, m, 0))];
      }
      return [document.getElementById('f-desde').value, document.getElementById('f-hasta').value];
    }
    const enRango = (f, [d, h]) => (!d || f >= d) && (!h || f <= h);

    const PAGOS = [
      { id: 'todos', nombre: 'Todas' },
      { id: 'pendiente', nombre: 'Por cobrar' },
      { id: 'Efectivo', nombre: 'Efectivo' },
      { id: 'Transferencia', nombre: 'Transferencia' },
      { id: 'Tarjeta', nombre: 'Tarjeta' },
    ];
    const pasaPago = (v, f) => f === 'todos' || (f === 'pendiente' ? !ventaPagada(v) : ventaPagada(v) && v.metodoPago === f);
    const pasaBusqueda = (v, q) => !q || norm([...ventaItems(v).map(it => it.pieza), v.notas, v.cliente, v.vendedor && nombreDe(v.vendedor)].join(' ')).includes(q);
    // "emanuel.perez@gmail.com" → "Emanuel Perez"
    const nombreDe = email => String(email || '').split('@')[0].replace(/[._-]+/g, ' ').replace(/\d+$/, '').trim()
      .replace(/\b\w/g, c => c.toUpperCase()) || String(email || '');
    const textoBusqueda = () => norm(document.getElementById('f-buscar').value.trim());
    // En el calendario, filtros y búsqueda solo deciden qué días se marcan
    const coincide = v => pasaPago(v, pagoFiltro) && pasaBusqueda(v, textoBusqueda());

    function render() {
      const r = rango();
      const q = norm(document.getElementById('f-buscar').value.trim());
      const periodo = DB.ventas.filter(v => enRango(fechaVenta(v), r));

      // Resumen: lo cobrado cuenta por fecha de cobro; lo pendiente es todo lo que te deben
      const cobradas = DB.ventas.filter(v => ventaPagada(v) && enRango(fechaCobro(v), r));
      const cobrado = cobradas.reduce((s, v) => s + totalDe(v), 0);
      const uds = periodo.reduce((s, v) => s + udsDe(v), 0);
      const pendientes = DB.ventas.filter(v => !ventaPagada(v));
      const porCobrar = pendientes.reduce((s, v) => s + totalDe(v), 0);
      document.getElementById('hx-sum').innerHTML = `
        <div class="inv-tile" style="--tile-color:var(--ios-green)">
          <span class="inv-tile-lbl"><i></i>Cobrado</span>
          <span class="inv-tile-num">${money0(cobrado)}</span>
          <span class="inv-tile-sub">${cobradas.length} venta${cobradas.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="inv-tile" style="--tile-color:var(--ios-blue)">
          <span class="inv-tile-lbl"><i></i>Piezas</span>
          <span class="inv-tile-num">${uds.toLocaleString('es-MX')}</span>
          <span class="inv-tile-sub">vendidas</span>
        </div>
        <button type="button" class="inv-tile${pendientes.length ? ' is-alert' : ''}${pagoFiltro === 'pendiente' ? ' is-on' : ''}" style="--tile-color:${pendientes.length ? 'var(--ios-orange)' : 'var(--ios-green)'}"
                onclick="setPago(pagoFiltro === 'pendiente' ? 'todos' : 'pendiente')" aria-pressed="${pagoFiltro === 'pendiente'}">
          <span class="inv-tile-lbl"><i></i>Por cobrar</span>
          <span class="inv-tile-num">${money0(porCobrar)}</span>
          <span class="inv-tile-sub">${pendientes.length ? `${pendientes.length} pendiente${pendientes.length !== 1 ? 's' : ''} · ver` : 'todo cobrado'}</span>
        </button>`;

      renderCal();

      // Por cobrar y la búsqueda miran todas las fechas; los demás filtros, el periodo
      const base = pagoFiltro === 'pendiente' || q ? DB.ventas : periodo;
      const cuenta = Object.fromEntries(PAGOS.map(p => [p.id, (p.id === 'pendiente' ? DB.ventas : periodo).filter(v => pasaPago(v, p.id)).length]));
      document.getElementById('f-pago').innerHTML = PAGOS.filter(p => p.id === 'todos' || cuenta[p.id] || p.id === pagoFiltro)
        .map(p => `<button type="button" role="radio" data-f="${p.id}" aria-checked="${p.id === pagoFiltro}">${p.nombre} <span>${cuenta[p.id]}</span></button>`).join('');

      document.getElementById('hx-sub').textContent = DB.ventas.length
        ? `${DB.ventas.length} venta${DB.ventas.length !== 1 ? 's' : ''} registradas`
        : 'Tus ventas y cobros pendientes.';

      const cont = document.getElementById('hx-list');
      const info = document.getElementById('hx-info');
      if (!DB.ventas.length) {
        info.innerHTML = '';
        cont.innerHTML = `<div class="hx-empty"><b>Aún no hay ventas</b>Cuando registres una venta aparecerá aquí.<br><a class="btn btn-primary" href="ventas.html">Registrar venta</a></div>`;
        return;
      }

      // Calendario: nunca se lista aquí; los filtros marcan días y las ventas se ven al tocar uno
      if (vista() === 'cal') {
        cont.innerHTML = '';
        if (pagoFiltro === 'todos' && !q) { info.innerHTML = '<span>Toca un día con punto para ver sus ventas.</span>'; return; }
        const todas = DB.ventas.filter(coincide);
        const delMes = todas.filter(v => fechaVenta(v).startsWith(mesVista)).length;
        // Si en este mes no hay coincidencias, ofrece saltar al mes más reciente que sí tenga
        const otro = !delMes && todas.length ? todas.map(v => fechaVenta(v).slice(0, 7)).filter(Boolean).sort().pop() : '';
        const txt = !todas.length ? 'Ninguna venta coincide'
          : `${delMes} venta${delMes !== 1 ? 's' : ''} en ${F.mesNombre(mesVista).toLowerCase()}${todas.length > delMes ? ` · ${todas.length - delMes} en otros meses` : ''}`;
        info.innerHTML = `<span>${txt}</span><span class="hx-info-acc">${otro ? `<button type="button" onclick="irMes('${otro}')">Ver ${esc(F.mesNombre(otro).toLowerCase())}</button>` : ''}<button type="button" onclick="limpiar()">Quitar filtros</button></span>`;
        return;
      }

      const lista = base.filter(v => pasaPago(v, pagoFiltro) && pasaBusqueda(v, q))
        .sort((a, b) => fechaVenta(b).localeCompare(fechaVenta(a)) || b.id - a.id);
      const donde = pagoFiltro === 'pendiente' ? 'en todas las fechas' : q ? 'en todas las fechas' : vista() === 'cal' ? `en ${F.mesNombre(mesVista).toLowerCase()}` : 'en el periodo';
      info.innerHTML = `<span>${lista.length} venta${lista.length !== 1 ? 's' : ''} ${donde}</span>${pagoFiltro !== 'todos' || q ? '<button type="button" onclick="limpiar()">Quitar filtros</button>' : ''}`;
      if (!lista.length) {
        cont.innerHTML = `<div class="hx-empty"><b>Sin resultados</b>No hay ventas con estos filtros.<br><button type="button" class="btn btn-ghost" onclick="limpiar()">Quitar filtros</button></div>`;
        return;
      }
      const visibles = lista.slice(0, limite);
      const dias = [];
      visibles.forEach(v => {
        const f = fechaVenta(v), g = dias[dias.length - 1];
        if (g && g.f === f) g.ventas.push(v); else dias.push({ f, ventas: [v] });
      });
      cont.innerHTML = dias.map(g => seccionDia(g.f, g.ventas)).join('')
        + (lista.length > limite ? `<button type="button" class="hx-more" onclick="verMas()">Ver ${Math.min(POR_PAGINA, lista.length - limite)} más</button>` : '');
    }

    // Encabezado del día con lo cobrado y lo pendiente por separado
    function seccionDia(f, ventas) {
      const cob = ventas.filter(ventaPagada).reduce((s, v) => s + totalDe(v), 0);
      const pen = ventas.filter(v => !ventaPagada(v)).reduce((s, v) => s + totalDe(v), 0);
      const tot = [cob ? `Cobrado ${money(cob)}` : '', pen ? `<b class="hx-pen">Por cobrar ${money(pen)}</b>` : ''].filter(Boolean).join(' · ');
      return `<section class="hx-day">
        <div class="hx-day-head"><span>${esc(F.diaLargo(f))}</span><span>${tot}</span></div>
        <div class="hx-list">${ventas.map(filaVenta).join('')}</div>
      </section>`;
    }

    // ── Calendario ──
    const DIAS = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
    function renderCal() {
      const cal = document.getElementById('hx-cal');
      cal.hidden = vista() !== 'cal';
      if (cal.hidden) return;
      const [y, m] = mesVista.split('-').map(Number);
      const primero = new Date(y, m - 1, 1), nDias = new Date(y, m, 0).getDate();
      const hueco = (primero.getDay() + 6) % 7;   // la semana empieza en lunes
      const porDia = {};
      DB.ventas.forEach(v => { const f = fechaVenta(v); if (f.startsWith(mesVista) && coincide(v)) (porDia[f] = porDia[f] || []).push(v); });
      const hoy = F.hoy();
      let celdas = '';
      for (let i = 0; i < hueco; i++) celdas += '<span class="hx-cal-vacio"></span>';
      for (let d = 1; d <= nDias; d++) {
        const f = `${mesVista}-${String(d).padStart(2, '0')}`;
        const vs = porDia[f] || [];
        const pend = vs.some(v => !ventaPagada(v));
        const cls = ['hx-cal-dia', f === diaSel ? 'is-sel' : '', f === hoy ? 'is-hoy' : '', vs.length ? 'con-ventas' : ''].filter(Boolean).join(' ');
        const lbl = `${F.diaLargo(f)}${vs.length ? `, ${vs.length} venta${vs.length !== 1 ? 's' : ''}${pend ? ', con pendientes' : ''}` : ', sin ventas'}`;
        celdas += `<button type="button" class="${cls}" data-dia="${f}" aria-label="${esc(lbl)}"${vs.length ? '' : ' disabled'}>
          <span class="hx-cal-n">${d}</span>${vs.length ? `<i class="hx-cal-dot${pend ? ' is-pen' : ''}" aria-hidden="true"></i>` : '<i class="hx-cal-dot is-vacio" aria-hidden="true"></i>'}
        </button>`;
      }
      const esActual = mesVista === hoy.slice(0, 7);
      cal.innerHTML = `
        <div class="hx-cal-head">
          <button type="button" class="hx-cal-nav" onclick="cambiarMes(-1)" aria-label="Mes anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
          <span class="hx-cal-mes">${esc(F.mesNombre(mesVista))}</span>
          ${esActual ? '<span class="hx-cal-nav is-off" aria-hidden="true"></span>' : '<button type="button" class="hx-cal-nav" onclick="cambiarMes(1)" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>'}
        </div>
        <div class="hx-cal-sem" aria-hidden="true">${DIAS.map(d => `<span>${d}</span>`).join('')}</div>
        <div class="hx-cal-grid">${celdas}</div>
        <div class="hx-cal-ley" aria-hidden="true"><span><i class="hx-cal-dot"></i>Cobrado</span><span><i class="hx-cal-dot is-pen"></i>Con pendientes</span>${esActual ? '' : '<button type="button" onclick="irHoy()">Hoy</button>'}</div>`;
    }
    function cambiarMes(d) {
      const [y, m] = mesVista.split('-').map(Number);
      const n = new Date(y, m - 1 + d, 1);
      mesVista = F.isoDe(n).slice(0, 7);
      const hoy = F.hoy();
      if (mesVista === hoy.slice(0, 7)) diaSel = hoy;
      else {
        // Se elige el último día con ventas del mes (o el día 1)
        const dias = DB.ventas.map(fechaVenta).filter(f => f.startsWith(mesVista)).sort();
        diaSel = dias.length ? dias[dias.length - 1] : `${mesVista}-01`;
      }
      limite = POR_PAGINA;
      render();
    }
    function irMes(m) { mesVista = m; render(); }
    function irHoy() { mesVista = F.hoy().slice(0, 7); diaSel = F.hoy(); render(); }
    document.getElementById('hx-cal').addEventListener('click', e => {
      const b = e.target.closest('[data-dia]');
      if (!b) return;
      diaSel = b.dataset.dia;
      renderCal();
      abrirDia(diaSel);
    });

    // ── Hoja del día ──
    let diaAbierto = null;      // día cuya hoja abrió el detalle (para regresar)
    function abrirDia(f, cambio) {
      const ventas = DB.ventas.filter(v => fechaVenta(v) === f && coincide(v)).sort((a, b) => b.id - a.id);
      if (!ventas.length) { diaAbierto = null; return false; }
      const cob = ventas.filter(ventaPagada).reduce((s, v) => s + totalDe(v), 0);
      const pen = ventas.filter(v => !ventaPagada(v)).reduce((s, v) => s + totalDe(v), 0);
      const uds = ventas.reduce((s, v) => s + udsDe(v), 0);
      document.getElementById('sh-dia-t').textContent = F.diaLargo(f);
      document.getElementById('dia-hero').className = 'inv-hero';
      document.getElementById('dia-hero').innerHTML = `
        <span class="inv-hero-num is-small">${money(cob + pen)}</span>
        <span class="inv-hero-sub">${ventas.length} venta${ventas.length !== 1 ? 's' : ''} · ${uds} pieza${uds !== 1 ? 's' : ''}</span>
        <div class="hx-dia-split">
          <span><i class="hx-cal-dot"></i>Cobrado <b>${money(cob)}</b></span>
          ${pen ? `<span><i class="hx-cal-dot is-pen"></i>Por cobrar <b class="hx-pen">${money(pen)}</b></span>` : ''}
        </div>`;
      document.getElementById('dia-list').innerHTML = ventas.map(filaVenta).join('');
      diaAbierto = f;
      MP_INV.abrir('sh-dia', cambio);
      return true;
    }
    function volverDia() { if (!diaAbierto || !abrirDia(diaAbierto, 'atras')) MP_INV.cerrar(); }
    // Tras cobrar, editar o eliminar: si venías de un día, regresa a su hoja
    function trasCambio() {
      render();
      if (!diaAbierto || !abrirDia(diaAbierto, 'atras')) MP_INV.cerrar();
    }
    document.getElementById('dia-list').addEventListener('click', e => { const r = e.target.closest('[data-id]'); if (r) abrirVenta(Number(r.dataset.id), true, 'adelante'); });

    // ── Filas ──
    const ICO = {
      Efectivo: '<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
      Transferencia: '<svg viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>',
      Tarjeta: '<svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6 15h4"/></svg>',
      pendiente: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    };
    // "LLAVERO", "LLAVERO y FIGURA", "LLAVERO, FIGURA y 2 más"
    function resumenPiezas(v) {
      const n = ventaItems(v).map(it => it.pieza);
      if (n.length <= 2) return n.join(' y ');
      return `${n[0]}, ${n[1]} y ${n.length - 2} más`;
    }
    function filaVenta(v) {
      const pagada = ventaPagada(v), uds = udsDe(v);
      const cobradaDespues = pagada && v.fechaPago && F.iso(v.fechaPago) !== fechaVenta(v);
      const meta = [
        `${uds} pieza${uds !== 1 ? 's' : ''}`,
        pagada ? (v.metodoPago || 'Pagada') + (cobradaDespues ? ` · cobrada ${F.diaLargo(F.iso(v.fechaPago)).toLowerCase()}` : '') : 'Por cobrar',
        v.cliente ? v.cliente : '',
        v.notas || '',
      ].filter(Boolean).map(esc).join(' · ');
      return `<button type="button" class="hx-row ${pagada ? 'st-ok' : 'st-low'}" data-id="${Number(v.id)}">
        <span class="hx-ico">${pagada ? (ICO[v.metodoPago] || ICO.Efectivo) : ICO.pendiente}</span>
        <span class="hx-text">
          <span class="hx-title">${esc(resumenPiezas(v))}</span>
          <span class="hx-meta">${meta}</span>
        </span>
        <span class="hx-right">
          <span class="hx-amt">${money(totalDe(v))}</span>
          ${pagada ? '' : '<span class="hx-tag">Pendiente</span>'}
        </span>
      </button>`;
    }

    function setPago(f) { pagoFiltro = f; limite = POR_PAGINA; render(); }
    function verMas() { limite += POR_PAGINA; render(); }
    function limpiar() { pagoFiltro = 'todos'; document.getElementById('f-buscar').value = ''; limite = POR_PAGINA; render(); }
    function cambioVista() {
      const fechas = vista() === 'fechas';
      document.getElementById('f-rango').hidden = !fechas;
      pintarRangoInfo();
      MP_INV.syncChips();
      limite = POR_PAGINA;
      render();
    }
    function pintarRangoInfo() {
      const d = document.getElementById('f-desde').value, h = document.getElementById('f-hasta').value;
      document.getElementById('hx-rango-info').innerHTML = !d && !h
        ? 'Sin fechas: se muestran todas las ventas.'
        : `${d ? 'Desde ' + esc(F.diaLargo(d).toLowerCase()) : 'Desde el inicio'} ${h ? 'hasta ' + esc(F.diaLargo(h).toLowerCase()) : 'hasta hoy'} · <button type="button" onclick="borrarFechas()">Ver todas</button>`;
    }
    function borrarFechas() { document.getElementById('f-desde').value = ''; document.getElementById('f-hasta').value = ''; pintarRangoInfo(); render(); }
    document.getElementById('f-vista').addEventListener('change', cambioVista);
    ['f-desde', 'f-hasta'].forEach(id => document.getElementById(id).addEventListener('change', () => { pintarRangoInfo(); limite = POR_PAGINA; render(); }));
    document.getElementById('f-buscar').addEventListener('input', () => { limite = POR_PAGINA; render(); });
    document.getElementById('f-pago').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) setPago(b.dataset.f); });
    document.getElementById('hx-list').addEventListener('click', e => { const r = e.target.closest('[data-id]'); if (r) abrirVenta(Number(r.dataset.id), false); });

    // ── Detalle ──
    let actual = null;
    function abrirVenta(id, desdeDia, cambio) {
      const v = DB.ventas.find(x => Number(x.id) === id);
      if (!v) return;
      actual = id;
      if (!desdeDia) diaAbierto = null;
      document.querySelector('#sh-venta .hx-atras').hidden = !diaAbierto;
      const pagada = ventaPagada(v), items = ventaItems(v);
      document.getElementById('sh-venta-t').textContent = F.diaLargo(fechaVenta(v));
      document.getElementById('v-hero').className = 'inv-hero ' + (pagada ? 'st-ok' : 'st-low');
      document.getElementById('v-hero').innerHTML = `
        <span class="inv-hero-num is-small">${money(totalDe(v))}</span>
        <span class="hx-tag">${pagada ? 'Pagada' + (v.metodoPago ? ' · ' + esc(v.metodoPago) : '') : 'Pendiente de cobro'}</span>`;
      document.getElementById('v-items').innerHTML = items.map(it => `
        <div class="inv-group-row"><span>${esc(it.pieza)}</span><span>${Number(it.cantidad) || 0} × ${money(it.precio)}</span></div>`).join('')
        + `<div class="inv-group-row hx-total-row"><span>Total</span><span>${money(totalDe(v))}</span></div>`;
      document.getElementById('v-datos').innerHTML = `
        ${v.cliente ? `<div class="inv-group-row"><span>Cliente</span><span>${esc(v.cliente)}</span></div>` : ''}
        <div class="inv-group-row"><span>Fecha de venta</span><span>${esc(fechaVenta(v) ? F.diaLargo(fechaVenta(v)) : v.fecha || '—')}</span></div>
        ${pagada && v.fechaPago ? `<div class="inv-group-row"><span>Cobrada</span><span>${esc(F.diaLargo(F.iso(v.fechaPago)))}</span></div>` : ''}
        ${v.notas ? `<div class="inv-group-row"><span>Notas</span><span>${esc(v.notas)}</span></div>` : ''}
        ${v.vendedor ? `<div class="inv-group-row"><span>Registró</span><span title="${esc(v.vendedor)}">${esc(nombreDe(v.vendedor))}</span></div>` : ''}`;
      document.getElementById('v-cobrar').hidden = pagada;
      MP_INV.abrir('sh-venta', cambio);
    }
    function cobrar(metodo) {
      const v = DB.ventas.find(x => Number(x.id) === actual);
      if (!v) return;
      v.estatusPago = 'pagado'; v.metodoPago = metodo; v.fechaPago = F.hoy();
      saveVentas();
      trasCambio();
      MP_INV.toast(`Pago registrado · ${metodo}`);
    }
    function reenviar() {
      const v = DB.ventas.find(x => Number(x.id) === actual);
      if (!v) return;
      const envio = MP_WA.enviarAGrupo(MP_WA.venta(v));
      MP_INV.toast(envio === 'grupo' ? 'Mensaje copiado, pégalo en el grupo' : 'Elige tu grupo en WhatsApp');
    }
    // Al eliminar una venta las piezas regresan al inventario
    function eliminarVenta() {
      const v = DB.ventas.find(x => Number(x.id) === actual);
      if (!v || !confirm('¿Eliminar esta venta? Las piezas regresan al inventario.')) return;
      ventaItems(v).forEach(it => { DB.piezas[it.pieza] = (DB.piezas[it.pieza] || 0) + (Number(it.cantidad) || 0); });
      savePiezas();
      DB.ventas = DB.ventas.filter(x => Number(x.id) !== actual);
      saveVentas();
      trasCambio();
      MP_INV.toast('Venta eliminada · piezas devueltas al inventario');
    }

    // ── Editar ──
    let edItems = [];
    function abrirEditar() {
      const v = DB.ventas.find(x => Number(x.id) === actual);
      if (!v) return;
      edItems = ventaItems(v).map(it => ({ pieza: it.pieza, antes: Number(it.cantidad) || 0, cantidad: Number(it.cantidad) || 0, precio: Number(it.precio) || 0 }));
      pintarEdItems();
      document.getElementById('ed-estatus').value = ventaPagada(v) ? 'pagado' : 'pendiente';
      document.getElementById('ed-metodo').value = v.metodoPago || 'Efectivo';
      document.getElementById('ed-fecha').value = fechaVenta(v);
      document.getElementById('ed-cliente').value = v.cliente || '';
      document.getElementById('ed-notas').value = v.notas || '';
      pintarEdPago();
      MP_INV.abrir('sh-editar', 'adelante');
    }
    function pintarEdItems() {
      document.getElementById('ed-items').innerHTML = edItems.map((it, i) => `
        <div class="hx-ed-item${it.cantidad ? '' : ' is-quitada'}">
          <span class="hx-ed-name">${esc(it.pieza)}</span>
          <div class="cq-stepper hx-ed-qty">
            <button type="button" aria-label="Menos" onclick="pasoEd(${i}, -1)">−</button>
            <input type="number" value="${it.cantidad}" readonly aria-label="Cantidad de ${esc(it.pieza)}" />
            <button type="button" aria-label="Más" onclick="pasoEd(${i}, 1)">+</button>
          </div>
          <div class="vs-price inv-precio hx-ed-precio"><span>$</span><input type="number" inputmode="decimal" min="0" step="0.5" value="${it.precio}" aria-label="Precio de ${esc(it.pieza)}" oninput="precioEd(${i}, this.value)" /></div>
        </div>`).join('');
      pintarEdTotal();
    }
    function pintarEdTotal() {
      const t = edItems.reduce((s, it) => s + it.cantidad * it.precio, 0);
      document.getElementById('ed-total').textContent = `Total: ${money(t)}`;
    }
    function pasoEd(i, d) {
      const it = edItems[i]; if (!it) return;
      const n = it.cantidad + d;
      if (n < 0) return;
      // Para subir la cantidad tiene que haber piezas en stock
      if (n > it.antes && n - it.antes > (DB.piezas[it.pieza] || 0)) { const q = DB.piezas[it.pieza] || 0; return MP_INV.toast(q ? `Solo quedan ${q} más de "${it.pieza}" en stock` : `No hay más "${it.pieza}" en stock`); }
      it.cantidad = n;
      pintarEdItems();
    }
    function precioEd(i, val) { if (edItems[i]) { edItems[i].precio = Math.max(0, parseFloat(val) || 0); pintarEdTotal(); } }
    function pintarEdPago() {
      const pend = document.getElementById('ed-estatus').value === 'pendiente';
      document.getElementById('ed-metodo-seg').hidden = pend;
      document.getElementById('ed-cliente').placeholder = pend ? '¿Quién te debe?' : 'Opcional';
      MP_INV.syncChips();
    }
    document.getElementById('ed-estatus').addEventListener('change', pintarEdPago);
    function guardarEdicion() {
      const v = DB.ventas.find(x => Number(x.id) === actual);
      if (!v) return;
      const quedan = edItems.filter(it => it.cantidad > 0);
      if (!quedan.length) return MP_INV.toast('La venta se quedó sin piezas; usa "Eliminar venta"');
      if (quedan.some(it => !(it.precio > 0))) return MP_INV.toast('Falta el precio de alguna pieza');
      const fecha = document.getElementById('ed-fecha').value;
      if (!fecha) return MP_INV.toast('Elige la fecha de la venta');
      // El inventario se ajusta con la diferencia de cada pieza
      edItems.forEach(it => {
        const d = it.cantidad - it.antes;
        if (!d) return;
        const n = (DB.piezas[it.pieza] || 0) - d;
        if (n > 0) DB.piezas[it.pieza] = n; else delete DB.piezas[it.pieza];
      });
      savePiezas();
      const pend = document.getElementById('ed-estatus').value === 'pendiente';
      v.items = quedan.map(it => ({ pieza: it.pieza, cantidad: it.cantidad, precio: Math.round(it.precio * 100) / 100 }));
      delete v.pieza; delete v.cantidad; delete v.precio;
      v.fecha = fecha;
      v.cliente = document.getElementById('ed-cliente').value.trim();
      if (!v.cliente) delete v.cliente;
      v.notas = document.getElementById('ed-notas').value.trim();
      if (pend) { v.estatusPago = 'pendiente'; v.metodoPago = null; delete v.fechaPago; }
      else {
        const eraPendiente = v.estatusPago === 'pendiente';
        v.estatusPago = 'pagado'; v.metodoPago = document.getElementById('ed-metodo').value;
        if (eraPendiente) v.fechaPago = F.hoy();
      }
      saveVentas();
      trasCambio();
      MP_INV.toast('Venta actualizada');
    }

    function mpInit() { loadDB(); MP_INV.syncChips(); cambioVista(); }
    window.addEventListener('mp-sync-ready', mpInit, { once: true });
    window.addEventListener('mp-sync-update', () => { loadDB(); render(); });
  </script>
