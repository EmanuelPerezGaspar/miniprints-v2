<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MiniPrints — Historial de ventas</title>
  <script src="theme.js?v=20260924z"></script>
  <script src="whatsapp.js?v=20260924z"></script>
  <script src="inventario.js?v=20260924z"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260924z" />
  <style>
    #toast { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); z-index: 1200; display: none; }
  </style>
  <link rel="stylesheet" href="ios.css?v=20260924z" />
  <link rel="stylesheet" href="nav.css?v=20260924z" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MiniPrints" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <script type="module" src="firebase-sync.js?v=20260924z"></script>

  <div class="page-container">
    <main class="dash-main">
      <div class="dash-header inv-header">
        <div>
          <h1 class="dash-title">Historial</h1>
          <p class="dash-subtitle" id="hx-sub">Tus ventas y cobros pendientes.</p>
        </div>
        <div class="inv-actions">
          <a class="inv-icon-btn is-primary" href="ventas.html" aria-label="Nueva venta">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </a>
        </div>
      </div>

      <div class="hx-wrap">
        <div class="cq-seg" data-for="f-periodo" role="radiogroup" aria-label="Periodo">
          <button type="button" data-v="mes">Este mes</button>
          <button type="button" data-v="pasado">Anterior</button>
          <button type="button" data-v="todo">Todo</button>
          <button type="button" data-v="rango">Fechas</button>
        </div>
        <input type="hidden" id="f-periodo" value="mes" />
        <div class="hx-dates" id="f-rango" hidden>
          <label>Desde<input type="date" id="f-desde" /></label>
          <label>Hasta<input type="date" id="f-hasta" /></label>
        </div>

        <div class="inv-sum is-4" id="hx-sum"></div>

        <input type="search" id="f-buscar" class="hx-search" placeholder="Buscar pieza o nota" autocomplete="off" aria-label="Buscar venta" />
        <div class="vs-cats" id="f-pago" role="radiogroup" aria-label="Filtrar por pago"></div>
        <div class="hx-info" id="hx-info"></div>

        <div id="hx-list" style="display:flex;flex-direction:column;gap:18px;"></div>
      </div>
    </main>
  </div>

  <!-- Hoja: detalle de la venta -->
  <div class="sheet inv-sheet" id="sh-venta" role="dialog" aria-modal="true" aria-labelledby="sh-venta-t" hidden>
    <div class="sheet-head">
      <h2 id="sh-venta-t">Venta</h2>
      <button class="sheet-close" type="button" data-sheet-close aria-label="Cerrar"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11"/></svg></button>
    </div>
    <div class="inv-hero" id="v-hero"></div>
    <div class="inv-group hx-items" id="v-items"></div>
    <div class="inv-group" id="v-datos"></div>
    <div class="inv-f" id="v-cobrar">
      <span class="inv-f-lbl">Registrar el pago</span>
      <div class="inv-quick">
        <button type="button" onclick="cobrar('Efectivo')">Efectivo</button>
        <button type="button" onclick="cobrar('Transferencia')">Transferencia</button>
        <button type="button" onclick="cobrar('Tarjeta')">Tarjeta</button>
      </div>
    </div>
    <div class="inv-btns">
      <button type="button" class="inv-btn is-wa" onclick="reenviar()">Enviar por WhatsApp</button>
      <button type="button" class="inv-btn is-danger" onclick="eliminarVenta()">Eliminar venta</button>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <script>
    const { esc, money, fecha: F } = MP_INV;
    const DB = { piezas: {}, ventas: [] };
    const POR_PAGINA = 40;
    let limite = POR_PAGINA, pagoFiltro = 'todos';

    const ventaItems = v => v.items || [{ pieza: v.pieza, cantidad: v.cantidad, precio: v.precio }];
    const ventaPagada = v => !v.estatusPago || v.estatusPago === 'pagado';
    const totalDe = v => ventaItems(v).reduce((s, it) => s + (Number(it.precio) || 0) * (Number(it.cantidad) || 0), 0);
    const udsDe = v => ventaItems(v).reduce((s, it) => s + (Number(it.cantidad) || 0), 0);

    function loadDB() {
      try { DB.piezas = JSON.parse(localStorage.getItem('mp_piezas')) || {}; } catch (e) { DB.piezas = {}; }
      try { DB.ventas = JSON.parse(localStorage.getItem('mp_ventas')) || []; } catch (e) { DB.ventas = []; }
    }
    const savePiezas = () => { try { localStorage.setItem('mp_piezas', JSON.stringify(DB.piezas)); } catch (e) {} };
    const saveVentas = () => { try { localStorage.setItem('mp_ventas', JSON.stringify(DB.ventas)); } catch (e) {} };

    // ── Filtros ──
    function rango() {
      const p = document.getElementById('f-periodo').value;
      const d = new Date();
      if (p === 'mes') return [F.isoDe(new Date(d.getFullYear(), d.getMonth(), 1)), ''];
      if (p === 'pasado') return [F.isoDe(new Date(d.getFullYear(), d.getMonth() - 1, 1)), F.isoDe(new Date(d.getFullYear(), d.getMonth(), 0))];
      if (p === 'rango') return [document.getElementById('f-desde').value, document.getElementById('f-hasta').value];
      return ['', ''];
    }
    function enPeriodo() {
      const [desde, hasta] = rango();
      return DB.ventas.filter(v => {
        const f = F.iso(v.fecha);
        return (!desde || f >= desde) && (!hasta || f <= hasta);
      });
    }
    const PAGOS = [
      { id: 'todos', nombre: 'Todas' },
      { id: 'pendiente', nombre: 'Por cobrar' },
      { id: 'Efectivo', nombre: 'Efectivo' },
      { id: 'Transferencia', nombre: 'Transferencia' },
      { id: 'Tarjeta', nombre: 'Tarjeta' },
    ];
    const pasaPago = (v, f) => f === 'todos' || (f === 'pendiente' ? !ventaPagada(v) : ventaPagada(v) && v.metodoPago === f);

    function render() {
      const periodo = enPeriodo();
      const q = document.getElementById('f-buscar').value.trim().toLowerCase();

      // Resumen del periodo
      const pagadas = periodo.filter(ventaPagada), pendientes = periodo.filter(v => !ventaPagada(v));
      const cobrado = pagadas.reduce((s, v) => s + totalDe(v), 0);
      const porCobrar = pendientes.reduce((s, v) => s + totalDe(v), 0);
      const uds = periodo.reduce((s, v) => s + udsDe(v), 0);
      document.getElementById('hx-sum').innerHTML = `
        <div class="inv-tile" style="--tile-color:var(--ios-green)">
          <span class="inv-tile-lbl"><i></i>Cobrado</span>
          <span class="inv-tile-num">${MP_INV.money0(cobrado)}</span>
          <span class="inv-tile-sub">${pagadas.length} venta${pagadas.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="inv-tile" style="--tile-color:var(--ios-blue)">
          <span class="inv-tile-lbl"><i></i>Piezas</span>
          <span class="inv-tile-num">${uds.toLocaleString('es-MX')}</span>
          <span class="inv-tile-sub">vendidas</span>
        </div>
        <div class="inv-tile" style="--tile-color:var(--ios-purple)">
          <span class="inv-tile-lbl"><i></i>Ticket prom.</span>
          <span class="inv-tile-num">${MP_INV.money0(pagadas.length ? cobrado / pagadas.length : 0)}</span>
          <span class="inv-tile-sub">por venta</span>
        </div>
        <button type="button" class="inv-tile${pendientes.length ? ' is-alert' : ''}${pagoFiltro === 'pendiente' ? ' is-on' : ''}" style="--tile-color:${pendientes.length ? 'var(--ios-orange)' : 'var(--ios-green)'}"
                onclick="setPago(pagoFiltro === 'pendiente' ? 'todos' : 'pendiente')" aria-pressed="${pagoFiltro === 'pendiente'}">
          <span class="inv-tile-lbl"><i></i>Por cobrar</span>
          <span class="inv-tile-num">${MP_INV.money0(porCobrar)}</span>
          <span class="inv-tile-sub">${pendientes.length ? `${pendientes.length} pendiente${pendientes.length !== 1 ? 's' : ''} · ver` : 'todo cobrado'}</span>
        </button>`;

      const cuenta = Object.fromEntries(PAGOS.map(p => [p.id, periodo.filter(v => pasaPago(v, p.id)).length]));
      document.getElementById('f-pago').innerHTML = PAGOS.filter(p => p.id === 'todos' || cuenta[p.id] || p.id === pagoFiltro)
        .map(p => `<button type="button" role="radio" data-f="${p.id}" aria-checked="${p.id === pagoFiltro}">${p.nombre} <span>${cuenta[p.id]}</span></button>`).join('');

      const lista = periodo
        .filter(v => pasaPago(v, pagoFiltro))
        .filter(v => !q || ventaItems(v).some(it => String(it.pieza).toLowerCase().includes(q)) || String(v.notas || '').toLowerCase().includes(q))
        .sort((a, b) => F.iso(b.fecha).localeCompare(F.iso(a.fecha)) || b.id - a.id);

      document.getElementById('hx-sub').textContent = DB.ventas.length
        ? `${DB.ventas.length} venta${DB.ventas.length !== 1 ? 's' : ''} registradas`
        : 'Tus ventas y cobros pendientes.';
      const filtrado = pagoFiltro !== 'todos' || q;
      document.getElementById('hx-info').innerHTML = periodo.length
        ? `<span>${lista.length} de ${periodo.length} ventas en el periodo</span>${filtrado ? '<button type="button" onclick="limpiar()">Quitar filtros</button>' : ''}`
        : '';

      const cont = document.getElementById('hx-list');
      if (!DB.ventas.length) {
        cont.innerHTML = `<div class="hx-empty"><b>Aún no hay ventas</b>Cuando registres una venta aparecerá aquí.<br><a class="btn btn-primary" href="ventas.html">Registrar venta</a></div>`;
        return;
      }
      if (!lista.length) {
        cont.innerHTML = `<div class="hx-empty"><b>Sin resultados</b>No hay ventas con estos filtros.<br><button type="button" class="btn btn-ghost" onclick="verTodo()">Ver todas las ventas</button></div>`;
        return;
      }

      // Agrupar por día
      const visibles = lista.slice(0, limite);
      const dias = [];
      visibles.forEach(v => {
        const f = F.iso(v.fecha);
        const g = dias[dias.length - 1];
        if (g && g.f === f) g.ventas.push(v); else dias.push({ f, ventas: [v] });
      });
      cont.innerHTML = dias.map(g => {
        const tot = g.ventas.filter(ventaPagada).reduce((s, v) => s + totalDe(v), 0);
        return `<section class="hx-day">
          <div class="hx-day-head"><span>${F.diaLargo(g.f)}</span><span>${tot ? money(tot) : ''}</span></div>
          <div class="hx-list">${g.ventas.map(filaVenta).join('')}</div>
        </section>`;
      }).join('') + (lista.length > limite ? `<button type="button" class="hx-more" onclick="verMas()">Ver ${Math.min(POR_PAGINA, lista.length - limite)} más</button>` : '');
    }

    const ICO = {
      Efectivo: '<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
      Transferencia: '<svg viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>',
      Tarjeta: '<svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6 15h4"/></svg>',
      pendiente: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    };
    function resumenPiezas(v) {
      const items = ventaItems(v);
      return items.length === 1 ? items[0].pieza : `${items[0].pieza} y ${items.length - 1} más`;
    }
    function filaVenta(v) {
      const pagada = ventaPagada(v), uds = udsDe(v);
      const st = pagada ? 'st-ok' : 'st-low';
      return `<button type="button" class="hx-row ${st}" data-id="${v.id}">
        <span class="hx-ico">${pagada ? (ICO[v.metodoPago] || ICO.Efectivo) : ICO.pendiente}</span>
        <span class="hx-text">
          <span class="hx-title">${esc(resumenPiezas(v))}</span>
          <span class="hx-meta">${uds} pieza${uds !== 1 ? 's' : ''} · ${pagada ? esc(v.metodoPago || 'Pagada') : 'Por cobrar'}${v.notas ? ' · ' + esc(v.notas) : ''}</span>
        </span>
        <span class="hx-right">
          <span class="hx-amt">${money(totalDe(v))}</span>
          ${pagada ? '' : '<span class="hx-tag">Pendiente</span>'}
        </span>
      </button>`;
    }

    function setPago(f) { pagoFiltro = f; limite = POR_PAGINA; render(); }
    function verMas() { limite += POR_PAGINA; render(); }
    function limpiar() { pagoFiltro = 'todos'; document.getElementById('f-buscar').value = ''; limite = POR_PAGINA; render(); }
    function verTodo() { document.getElementById('f-periodo').value = 'todo'; cambioPeriodo(); limpiar(); }
    function cambioPeriodo() {
      const p = document.getElementById('f-periodo').value;
      document.getElementById('f-rango').hidden = p !== 'rango';
      if (p === 'rango' && !document.getElementById('f-desde').value) {
        const d = new Date(); d.setDate(d.getDate() - 30);
        document.getElementById('f-desde').value = F.isoDe(d);
        document.getElementById('f-hasta').value = F.hoy();
      }
      MP_INV.syncChips();
      limite = POR_PAGINA;
      render();
    }
    document.getElementById('f-periodo').addEventListener('change', cambioPeriodo);
    ['f-desde', 'f-hasta'].forEach(id => document.getElementById(id).addEventListener('change', render));
    document.getElementById('f-buscar').addEventListener('input', () => { limite = POR_PAGINA; render(); });
    document.getElementById('f-pago').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) setPago(b.dataset.f); });
    document.getElementById('hx-list').addEventListener('click', e => { const r = e.target.closest('[data-id]'); if (r) abrirVenta(Number(r.dataset.id)); });

    // ── Detalle ──
    let actual = null;
    function abrirVenta(id) {
      const v = DB.ventas.find(x => x.id === id);
      if (!v) return;
      actual = id;
      const pagada = ventaPagada(v), items = ventaItems(v);
      document.getElementById('sh-venta-t').textContent = F.diaLargo(F.iso(v.fecha));
      document.getElementById('v-hero').className = 'inv-hero ' + (pagada ? 'st-ok' : 'st-low');
      document.getElementById('v-hero').innerHTML = `
        <span class="inv-hero-num is-small">${money(totalDe(v))}</span>
        <span class="hx-tag">${pagada ? 'Pagada' + (v.metodoPago ? ' · ' + esc(v.metodoPago) : '') : 'Pendiente de cobro'}</span>`;
      document.getElementById('v-items').innerHTML = items.map(it => `
        <div class="inv-group-row"><span>${esc(it.pieza)}</span><span>${it.cantidad} × ${money(it.precio)}</span></div>`).join('')
        + `<div class="inv-group-row hx-total-row"><span>Total</span><span>${money(totalDe(v))}</span></div>`;
      document.getElementById('v-datos').innerHTML = `
        <div class="inv-group-row"><span>Fecha</span><span>${esc(F.iso(v.fecha) || v.fecha || '—')}</span></div>
        ${v.notas ? `<div class="inv-group-row"><span>Notas</span><span>${esc(v.notas)}</span></div>` : ''}`;
      document.getElementById('v-cobrar').hidden = pagada;
      MP_INV.abrir('sh-venta');
    }
    function cobrar(metodo) {
      const v = DB.ventas.find(x => x.id === actual);
      if (!v) return;
      v.estatusPago = 'pagado'; v.metodoPago = metodo;
      saveVentas();
      MP_INV.cerrar(); render();
      MP_INV.toast(`Pago registrado · ${metodo}`);
    }
    function reenviar() {
      const v = DB.ventas.find(x => x.id === actual);
      if (!v) return;
      const envio = MP_WA.enviarAGrupo(MP_WA.venta(v));
      MP_INV.toast(envio === 'grupo' ? 'Mensaje copiado, pégalo en el grupo' : 'Elige tu grupo en WhatsApp');
    }
    // Al eliminar una venta las piezas regresan al inventario
    function eliminarVenta() {
      const v = DB.ventas.find(x => x.id === actual);
      if (!v || !confirm('¿Eliminar esta venta? Las piezas regresan al inventario.')) return;
      ventaItems(v).forEach(it => { DB.piezas[it.pieza] = (DB.piezas[it.pieza] || 0) + (Number(it.cantidad) || 0); });
      savePiezas();
      DB.ventas = DB.ventas.filter(x => x.id !== actual);
      saveVentas();
      MP_INV.cerrar(); render();
      MP_INV.toast('Venta eliminada · piezas devueltas al inventario');
    }

    function mpInit() { loadDB(); MP_INV.syncChips(); render(); }
    window.addEventListener('mp-sync-ready', mpInit, { once: true });
    window.addEventListener('mp-sync-update', mpInit);
  </script>
  <script src="nav.js?v=20260924z"></script>
</body>
</html>
