<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MiniPrints — Historial de Cotizaciones</title>
  <script src="theme.js?v=20260923m"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260923m" />
  <style>
    .filters-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .filters-row input, .filters-row select {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-family: var(--font); font-size: 0.85rem; padding: 9px 14px; outline: none;
    }
    .filters-row input { flex: 1; min-width: 180px; }
    .filters-row select { cursor: pointer; }
    .cot-row-cliente { font-weight: 700; color: var(--text); }
    .cot-row-pieza { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
    #toast { position: fixed; bottom: 24px; right: 24px; background: var(--ios-bg-3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 18px; font-size: 0.85rem; color: var(--text); box-shadow: 0 8px 32px rgba(0,0,0,0.50); z-index: 999; display: none; max-width: 320px; }
    /* Prevent overflow */
    .filters-row { min-width: 0; }
    .filters-row input, .filters-row select { min-width: 0; box-sizing: border-box; }
    @media (max-width: 700px) {
      .table-wrap table { font-size: 0.8rem; }
      thead th:nth-child(4), tbody td:nth-child(4) { display: none; }
    }
    @media (max-width: 600px) {
      .filters-row { flex-direction: column; }
      .filters-row input, .filters-row select { width: 100%; }
      /* hide ganancia col on very small */
      thead th:nth-child(4), tbody td:nth-child(4) { display: none; }
    }
  </style>
  <link rel="stylesheet" href="ios.css?v=20260923m" />
  <link rel="stylesheet" href="nav.css?v=20260923m" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <script type="module" src="firebase-sync.js?v=20260923m"></script>

  <!-- CONTENT -->
  <div class="page-container">
    <div class="dash-layout">
      <main class="dash-main">
        <div class="dash-header">
          <div>
            <h1 class="dash-title">Historial de Cotizaciones</h1>
            <p class="dash-subtitle">Todas las cotizaciones generadas en el Cotizador, aceptadas o no.</p>
          </div>
        </div>

        <!-- KPI row -->
        <div class="kpi-grid" id="kpi-row" style="margin-bottom:24px;"></div>

        <!-- Filters -->
        <div class="filters-row">
          <input type="text" id="filtro-texto" placeholder="Buscar por cliente o pieza..." oninput="renderList()" />
          <select id="filtro-estado" onchange="renderList()">
            <option value="">Todos los estados</option>
            <option value="true">Aceptadas</option>
            <option value="false">No aceptadas</option>
            <option value="null">Pendientes</option>
          </select>
        </div>

        <!-- Table -->
        <div class="empty-table" id="cot-table-wrap">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Cliente / Pieza</th>
                  <th>Fecha</th>
                  <th style="text-align:right;">Total</th>
                  <th style="text-align:right;">Ganancia esp.</th>
                  <th>Estado</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tbody-cot"></tbody>
            </table>
          </div>
          <div class="empty-table-body" id="cot-empty" style="display:none;">
            <h3>Sin cotizaciones</h3>
            <p>Las cotizaciones que generes en el Cotizador aparecerán aquí.</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const DB = { cotizaciones: [] };

    function loadDB() {
      try { const c = localStorage.getItem('mp_cotizaciones'); if (c) DB.cotizaciones = JSON.parse(c); } catch(e) {}
    }
    function saveDB() {
      try { localStorage.setItem('mp_cotizaciones', JSON.stringify(DB.cotizaciones)); } catch(e) {}
    }

    const fmt = n => '$' + parseFloat(n || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function showToast(msg) {
      const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
      clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 3200);
    }

    function renderKPIs() {
      const cots = DB.cotizaciones;
      const total = cots.length;
      const aceptadas = cots.filter(c => c.fue_aceptada === true).length;
      const noAceptadas = cots.filter(c => c.fue_aceptada === false).length;
      const gananciaEsp = cots.filter(c => c.fue_aceptada === true).reduce((s, c) => s + (c.ganancia || 0), 0);
      document.getElementById('kpi-row').innerHTML = `
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-label">Total cotizaciones</div><div class="kpi-icon" style="background:rgba(10,132,255,0.12);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${IOSC.blue}" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></div></div>
          <div class="kpi-value">${total}</div>
          <div class="kpi-change neutral" style="color:var(--text-dim);">generadas en total</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-label">Aceptadas</div><div class="kpi-icon" style="background:rgba(48,209,88,0.12);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${IOSC.green}" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div></div>
          <div class="kpi-value" style="color:var(--ios-green);">${aceptadas}</div>
          <div class="kpi-change neutral" style="color:var(--text-dim);">se imprimieron</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-label">No aceptadas</div><div class="kpi-icon" style="background:rgba(255,69,58,0.12);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${IOSC.red}" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div></div>
          <div class="kpi-value" style="color:var(--ios-red);">${noAceptadas}</div>
          <div class="kpi-change neutral" style="color:var(--text-dim);">solo cotizadas</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-label">Ganancia esperada</div><div class="kpi-icon" style="background:rgba(191,90,242,0.12);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${IOSC.purple}" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div></div>
          <div class="kpi-value" style="font-size:1.4rem;color:var(--ios-purple);">${fmt(gananciaEsp)}</div>
          <div class="kpi-change neutral" style="color:var(--text-dim);">de las aceptadas</div>
        </div>`;
    }

    function estadoBadge(c) {
      if (c.fue_aceptada === true)  return '<span class="badge badge-success"><span class="badge-dot" style="background:var(--ios-green);"></span>Aceptada</span>';
      if (c.fue_aceptada === false) return '<span class="badge badge-error"><span class="badge-dot" style="background:var(--ios-red);"></span>No aceptada</span>';
      return '<span class="badge badge-warning"><span class="badge-dot" style="background:var(--ios-yellow);"></span>Pendiente</span>';
    }

    function eliminarCot(id) {
      if (!confirm('¿Eliminar esta cotización del historial?')) return;
      DB.cotizaciones = DB.cotizaciones.filter(c => c.id !== id);
      saveDB();
      renderKPIs();
      renderList();
      showToast('Cotización eliminada');
    }

    function renderList() {
      const texto  = document.getElementById('filtro-texto').value.trim().toLowerCase();
      const estado = document.getElementById('filtro-estado').value;
      let cots = DB.cotizaciones;

      if (texto) {
        cots = cots.filter(c =>
          (c.cliente || '').toLowerCase().includes(texto) ||
          (c.pieza || '').toLowerCase().includes(texto)
        );
      }
      if (estado === 'true')  cots = cots.filter(c => c.fue_aceptada === true);
      if (estado === 'false') cots = cots.filter(c => c.fue_aceptada === false);
      if (estado === 'null')  cots = cots.filter(c => c.fue_aceptada === null || c.fue_aceptada === undefined);

      const tbody = document.getElementById('tbody-cot');
      const empty = document.getElementById('cot-empty');
      const wrap  = document.querySelector('#cot-table-wrap .table-wrap');

      if (!cots.length) {
        tbody.innerHTML = '';
        wrap.style.display = 'none';
        empty.style.display = 'flex';
        return;
      }
      wrap.style.display = '';
      empty.style.display = 'none';

      tbody.innerHTML = cots.map(c => `
        <tr>
          <td>
            <div class="cot-row-cliente">${c.cliente || 'Sin nombre'}</div>
            ${c.pieza ? `<div class="cot-row-pieza">${c.pieza}${c.cantidad ? ' × ' + c.cantidad : ''}</div>` : ''}
          </td>
          <td>${c.fecha || '—'}</td>
          <td style="text-align:right;color:var(--text);font-weight:600;">${fmt(c.total)}</td>
          <td style="text-align:right;color:var(--ios-purple);">${fmt(c.ganancia)}</td>
          <td>${estadoBadge(c)}</td>
          <td style="text-align:right;">
            <button class="btn btn-ghost" style="padding:6px 10px;font-size:0.78rem;" onclick="eliminarCot(${c.id})">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
            </button>
          </td>
        </tr>`).join('');
    }


    function mpInit() { loadDB(); renderKPIs(); renderList(); }
    window.addEventListener('mp-sync-ready', mpInit, { once: true });
    window.addEventListener('mp-sync-update', mpInit);
  </script>
  <script src="nav.js?v=20260923m"></script>
</body>
</html>
