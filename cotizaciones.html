<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MiniPrints — Cotizaciones</title>
  <script src="theme.js?v=20260924w"></script>
  <script src="inventario.js?v=20260924w"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260924w" />
  <style>
    #toast { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); z-index: 1200; display: none; }
  </style>
  <link rel="stylesheet" href="ios.css?v=20260924w" />
  <link rel="stylesheet" href="nav.css?v=20260924w" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MiniPrints" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <script type="module" src="firebase-sync.js?v=20260924w"></script>

  <div class="page-container">
    <main class="dash-main">
      <div class="dash-header inv-header">
        <div>
          <h1 class="dash-title">Cotizaciones</h1>
          <p class="dash-subtitle" id="hx-sub">Lo que has cotizado y qué se aceptó.</p>
        </div>
        <div class="inv-actions">
          <a class="inv-icon-btn is-primary" href="cotizador.html" aria-label="Nueva cotización">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </a>
        </div>
      </div>

      <div class="hx-wrap">
        <div class="cq-seg" data-for="f-periodo" role="radiogroup" aria-label="Periodo">
          <button type="button" data-v="mes">Este mes</button>
          <button type="button" data-v="pasado">Anterior</button>
          <button type="button" data-v="todo">Todo</button>
          <button type="button" data-v="rango">Fechas</button>
        </div>
        <input type="hidden" id="f-periodo" value="todo" />
        <div class="hx-dates" id="f-rango" hidden>
          <label>Desde<input type="date" id="f-desde" /></label>
          <label>Hasta<input type="date" id="f-hasta" /></label>
        </div>

        <div class="inv-sum is-4" id="hx-sum"></div>

        <input type="search" id="f-buscar" class="hx-search" placeholder="Buscar cliente o pieza" autocomplete="off" aria-label="Buscar cotización" />
        <div class="vs-cats" id="f-estado" role="radiogroup" aria-label="Filtrar por estado"></div>
        <div class="hx-info" id="hx-info"></div>

        <div id="hx-list" style="display:flex;flex-direction:column;gap:18px;"></div>
      </div>
    </main>
  </div>

  <!-- Hoja: detalle de la cotización -->
  <div class="sheet inv-sheet" id="sh-cot" role="dialog" aria-modal="true" aria-labelledby="sh-cot-t" hidden>
    <div class="sheet-head">
      <h2 id="sh-cot-t">Cotización</h2>
      <button class="sheet-close" type="button" data-sheet-close aria-label="Cerrar"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11"/></svg></button>
    </div>
    <div class="inv-hero" id="c-hero"></div>
    <div class="inv-group" id="c-datos"></div>
    <div class="inv-group" id="c-desglose"></div>
    <div class="inv-f">
      <span class="inv-f-lbl">¿El cliente la aceptó?</span>
      <div class="cq-seg" data-for="c-estado" role="radiogroup" aria-label="Estado de la cotización">
        <button type="button" data-v="si">Aceptada</button>
        <button type="button" data-v="no">No aceptada</button>
      </div>
      <input type="hidden" id="c-estado" value="" />
      <p class="inv-hint">Cambiar el estado no mueve el inventario; para sumar piezas usa Inventario.</p>
    </div>
    <div class="inv-btns">
      <button type="button" class="inv-btn is-danger" onclick="eliminarCot()">Eliminar cotización</button>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <script>
    const { esc, money, fecha: F } = MP_INV;
    const DB = { cotizaciones: [] };
    const POR_PAGINA = 40;
    let limite = POR_PAGINA, estadoFiltro = 'todas';

    function loadDB() {
      try { DB.cotizaciones = JSON.parse(localStorage.getItem('mp_cotizaciones')) || []; } catch (e) { DB.cotizaciones = []; }
    }
    const saveDB = () => { try { localStorage.setItem('mp_cotizaciones', JSON.stringify(DB.cotizaciones)); } catch (e) {} };

    // El id es la marca de tiempo de cuando se guardó; es más confiable que el texto de fecha
    const fechaDe = c => (c.id > 1e11 ? F.isoDe(new Date(c.id)) : '') || F.iso(c.fecha);
    const estadoDe = c => c.fue_aceptada === true ? 'si' : c.fue_aceptada === false ? 'no' : 'pend';
    const ESTADO = {
      si:   { cls: 'st-ok',   txt: 'Aceptada' },
      no:   { cls: 'st-mute', txt: 'No aceptada' },
      pend: { cls: 'st-low',  txt: 'Sin respuesta' },
    };

    function rango() {
      const p = document.getElementById('f-periodo').value;
      const d = new Date();
      if (p === 'mes') return [F.isoDe(new Date(d.getFullYear(), d.getMonth(), 1)), ''];
      if (p === 'pasado') return [F.isoDe(new Date(d.getFullYear(), d.getMonth() - 1, 1)), F.isoDe(new Date(d.getFullYear(), d.getMonth(), 0))];
      if (p === 'rango') return [document.getElementById('f-desde').value, document.getElementById('f-hasta').value];
      return ['', ''];
    }
    function enPeriodo() {
      const [desde, hasta] = rango();
      return DB.cotizaciones.filter(c => { const f = fechaDe(c); return (!desde || f >= desde) && (!hasta || f <= hasta); });
    }

    function render() {
      const periodo = enPeriodo();
      const q = document.getElementById('f-buscar').value.trim().toLowerCase();
      const acept = periodo.filter(c => c.fue_aceptada === true);
      const decididas = periodo.filter(c => c.fue_aceptada === true || c.fue_aceptada === false).length;
      const tasa = decididas ? Math.round(acept.length / decididas * 100) : 0;
      const monto = acept.reduce((s, c) => s + (c.total || 0), 0);
      const gan = acept.reduce((s, c) => s + (c.ganancia || 0), 0);
      document.getElementById('hx-sum').innerHTML = `
        <div class="inv-tile" style="--tile-color:var(--ios-blue)">
          <span class="inv-tile-lbl"><i></i>Cotizadas</span>
          <span class="inv-tile-num">${periodo.length}</span>
          <span class="inv-tile-sub">en el periodo</span>
        </div>
        <div class="inv-tile" style="--tile-color:var(--ios-green)">
          <span class="inv-tile-lbl"><i></i>Aceptación</span>
          <span class="inv-tile-num">${tasa}<small>%</small></span>
          <span class="inv-tile-sub">${acept.length} de ${decididas}</span>
        </div>
        <div class="inv-tile" style="--tile-color:var(--ios-orange)">
          <span class="inv-tile-lbl"><i></i>Aceptado</span>
          <span class="inv-tile-num">${MP_INV.money0(monto)}</span>
          <span class="inv-tile-sub">en cotizaciones</span>
        </div>
        <div class="inv-tile" style="--tile-color:var(--ios-purple)">
          <span class="inv-tile-lbl"><i></i>Ganancia</span>
          <span class="inv-tile-num">${MP_INV.money0(gan)}</span>
          <span class="inv-tile-sub">esperada</span>
        </div>`;

      const cuenta = { todas: periodo.length, si: 0, no: 0, pend: 0 };
      periodo.forEach(c => cuenta[estadoDe(c)]++);
      document.getElementById('f-estado').innerHTML = [['todas', 'Todas'], ['si', 'Aceptadas'], ['no', 'No aceptadas'], ['pend', 'Sin respuesta']]
        .filter(([id]) => id === 'todas' || cuenta[id] || id === estadoFiltro)
        .map(([id, n]) => `<button type="button" role="radio" data-f="${id}" aria-checked="${id === estadoFiltro}">${n} <span>${cuenta[id]}</span></button>`).join('');

      const lista = periodo
        .filter(c => estadoFiltro === 'todas' || estadoDe(c) === estadoFiltro)
        .filter(c => !q || `${c.cliente || ''} ${c.pieza || ''}`.toLowerCase().includes(q))
        .sort((a, b) => fechaDe(b).localeCompare(fechaDe(a)) || b.id - a.id);

      document.getElementById('hx-sub').textContent = DB.cotizaciones.length
        ? `${DB.cotizaciones.length} cotizaci${DB.cotizaciones.length !== 1 ? 'ones' : 'ón'} guardadas`
        : 'Lo que has cotizado y qué se aceptó.';
      document.getElementById('hx-info').innerHTML = periodo.length
        ? `<span>${lista.length} de ${periodo.length} en el periodo</span>${estadoFiltro !== 'todas' || q ? '<button type="button" onclick="limpiar()">Quitar filtros</button>' : ''}`
        : '';

      const cont = document.getElementById('hx-list');
      if (!DB.cotizaciones.length) {
        cont.innerHTML = `<div class="hx-empty"><b>Aún no hay cotizaciones</b>Se guardan cuando confirmas una en Cotizar.<br><a class="btn btn-primary" href="cotizador.html">Nueva cotización</a></div>`;
        return;
      }
      if (!lista.length) {
        cont.innerHTML = `<div class="hx-empty"><b>Sin resultados</b>No hay cotizaciones con estos filtros.<br><button type="button" class="btn btn-ghost" onclick="verTodo()">Ver todas</button></div>`;
        return;
      }
      const dias = [];
      lista.slice(0, limite).forEach(c => {
        const f = fechaDe(c), g = dias[dias.length - 1];
        if (g && g.f === f) g.cots.push(c); else dias.push({ f, cots: [c] });
      });
      cont.innerHTML = dias.map(g => `<section class="hx-day">
          <div class="hx-day-head"><span>${F.diaLargo(g.f)}</span><span></span></div>
          <div class="hx-list">${g.cots.map(fila).join('')}</div>
        </section>`).join('')
        + (lista.length > limite ? `<button type="button" class="hx-more" onclick="verMas()">Ver ${Math.min(POR_PAGINA, lista.length - limite)} más</button>` : '');
    }

    const ICO = {
      si: '<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
      no: '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg>',
      pend: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    };
    function fila(c) {
      const e = estadoDe(c), st = ESTADO[e];
      const detalle = [c.pieza ? `${c.pieza}${c.cantidad ? ' × ' + c.cantidad : ''}` : '', st.txt].filter(Boolean).join(' · ');
      return `<button type="button" class="hx-row ${st.cls}" data-id="${c.id}">
        <span class="hx-ico">${ICO[e]}</span>
        <span class="hx-text">
          <span class="hx-title">${esc(c.cliente || 'Sin nombre')}</span>
          <span class="hx-meta">${esc(detalle)}</span>
        </span>
        <span class="hx-right"><span class="hx-amt">${money(c.total)}</span></span>
      </button>`;
    }

    function verMas() { limite += POR_PAGINA; render(); }
    function limpiar() { estadoFiltro = 'todas'; document.getElementById('f-buscar').value = ''; limite = POR_PAGINA; render(); }
    function verTodo() { document.getElementById('f-periodo').value = 'todo'; cambioPeriodo(); limpiar(); }
    function cambioPeriodo() {
      const p = document.getElementById('f-periodo').value;
      document.getElementById('f-rango').hidden = p !== 'rango';
      if (p === 'rango' && !document.getElementById('f-desde').value) {
        const d = new Date(); d.setDate(d.getDate() - 30);
        document.getElementById('f-desde').value = F.isoDe(d);
        document.getElementById('f-hasta').value = F.hoy();
      }
      MP_INV.syncChips(); limite = POR_PAGINA; render();
    }
    document.getElementById('f-periodo').addEventListener('change', cambioPeriodo);
    ['f-desde', 'f-hasta'].forEach(id => document.getElementById(id).addEventListener('change', render));
    document.getElementById('f-buscar').addEventListener('input', () => { limite = POR_PAGINA; render(); });
    document.getElementById('f-estado').addEventListener('click', e => {
      const b = e.target.closest('[data-f]'); if (b) { estadoFiltro = b.dataset.f; limite = POR_PAGINA; render(); }
    });
    document.getElementById('hx-list').addEventListener('click', e => { const r = e.target.closest('[data-id]'); if (r) abrirCot(Number(r.dataset.id)); });

    // ── Detalle ──
    let actual = null;
    const URG = { normal: 'Normal', express: 'Express (+25%)', urgente: 'Urgente (+50%)' };
    function abrirCot(id) {
      const c = DB.cotizaciones.find(x => x.id === id);
      if (!c) return;
      actual = id;
      const e = estadoDe(c);
      document.getElementById('sh-cot-t').textContent = c.cliente || 'Sin nombre';
      document.getElementById('c-hero').className = 'inv-hero ' + ESTADO[e].cls;
      document.getElementById('c-hero').innerHTML = `
        <span class="inv-hero-num is-small">${money(c.total)}</span>
        <span class="hx-tag">${ESTADO[e].txt}</span>`;
      const row = (a, b) => b ? `<div class="inv-group-row"><span>${a}</span><span>${b}</span></div>` : '';
      document.getElementById('c-datos').innerHTML =
        row('Fecha', esc(F.diaLargo(fechaDe(c))))
        + row('Pieza', c.pieza ? esc(c.pieza) + (c.cantidad ? ' × ' + c.cantidad : '') : '')
        + row('Tipo', c.tipo_pieza ? esc(c.tipo_pieza.charAt(0).toUpperCase() + c.tipo_pieza.slice(1)) : '')
        + row('Entrega', c.urgencia ? URG[c.urgencia] || esc(c.urgencia) : '');
      document.getElementById('c-desglose').innerHTML =
        row('Costo de producción', money(c.costo_base))
        + row('Ganancia', money(c.ganancia))
        + (c.iva ? row('IVA', money(c.iva)) : '')
        + `<div class="inv-group-row hx-total-row"><span>Total</span><span>${money(c.total)}</span></div>`;
      document.getElementById('c-estado').value = e === 'pend' ? '' : e;
      MP_INV.syncChips();
      MP_INV.abrir('sh-cot');
    }
    document.getElementById('c-estado').addEventListener('change', e => {
      const c = DB.cotizaciones.find(x => x.id === actual);
      if (!c) return;
      c.fue_aceptada = e.target.value === 'si';
      saveDB(); render();
      const est = ESTADO[estadoDe(c)];
      const hero = document.getElementById('c-hero');
      hero.className = 'inv-hero ' + est.cls;
      hero.querySelector('.hx-tag').textContent = est.txt;
      MP_INV.toast(`Marcada como ${est.txt.toLowerCase()}`);
    });
    function eliminarCot() {
      if (!confirm('¿Eliminar esta cotización del historial?')) return;
      DB.cotizaciones = DB.cotizaciones.filter(c => c.id !== actual);
      saveDB(); MP_INV.cerrar(); render();
      MP_INV.toast('Cotización eliminada');
    }

    function mpInit() { loadDB(); MP_INV.syncChips(); render(); }
    window.addEventListener('mp-sync-ready', mpInit, { once: true });
    window.addEventListener('mp-sync-update', mpInit);
  </script>
  <script src="nav.js?v=20260924w"></script>
</body>
</html>
