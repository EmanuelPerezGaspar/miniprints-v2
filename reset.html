<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset — MiniPrints v2</title>
  <script src="theme.js?v=20260923c"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--ios-bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(var(--ink), 0.05);
      border: 1px solid rgba(var(--ink), 0.1);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; line-height: 1.6; }
    .list {
      background: rgba(255,69,58,0.08);
      border: 1px solid rgba(255,69,58,0.2);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .list span { display: block; font-size: 0.85rem; color: var(--ios-red); padding: 2px 0; }
    .keep {
      background: rgba(48,209,88,0.08);
      border: 1px solid rgba(48,209,88,0.2);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: #86efac;
      text-align: left;
    }
    .btn-reset {
      background: var(--ios-red);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.85rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-bottom: 0.75rem;
      transition: background 0.2s;
    }
    .btn-reset:hover { background: #dc2626; }
    .btn-back {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid rgba(var(--ink), 0.1);
      border-radius: 10px;
      padding: 0.75rem 2rem;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
      transition: border-color 0.2s;
    }
    .btn-back:hover { border-color: var(--ios-green); color: var(--ios-green); }
    .done {
      display: none;
      color: var(--ios-green);
      font-weight: 600;
      font-size: 1.1rem;
      margin-top: 1rem;
    }
  </style>
  <link rel="stylesheet" href="ios.css?v=20260923c" />
  <link rel="stylesheet" href="nav.css?v=20260923c" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <script type="module" src="firebase-sync.js?v=20260923c"></script>
<style>
  #loom-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: var(--ios-bg);
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
}'@

    # 2. Replace visibility handler + add pageshow for iOS bfcache
    $oldHandler = @'
      window.addEventListener('resize', setup);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) cancelAnimationFrame(animId);
        else animate();
      });
      setup(); animate();
</style>
<div class="card">
    <div class="icon">⚠️</div>
    <h1>Restablecer datos</h1>
    <p>Esta acción borrará todos los datos operativos. No se puede deshacer.</p>

    <div class="list">
      <span>✗ Ventas</span>
      <span>✗ Cotizaciones</span>
      <span>✗ Stock de piezas</span>
      <span>✗ Historial de impresión</span>
      <span>✗ Peso de filamentos — restablecido a 1000g c/u</span>
    </div>

    <div class="keep">
      ✓ <strong>Materiales — nombres, precios y tipos se conservan</strong>
    </div>

    <button class="btn-reset" onclick="doReset()">Restablecer ahora</button>
    <button class="btn-back" onclick="location.href='index.html'">Cancelar</button>

    <div class="done" id="done">✓ Listo — redirigiendo...</div>
  </div>

  <script>
    function doReset() {
      ['mp_piezas', 'mp_ventas', 'mp_cotizaciones', 'mp_historial'].forEach(k => localStorage.removeItem(k));
      try {
        const mats = JSON.parse(localStorage.getItem('mp_materials') || '{}');
        Object.values(mats).forEach(m => { m.pesoTotal = 1000; });
        localStorage.setItem('mp_materials', JSON.stringify(mats));
      } catch(e) {}
      document.querySelector('.btn-reset').disabled = true;
      document.querySelector('.btn-back').disabled = true;
      document.getElementById('done').style.display = 'block';
      setTimeout(() => location.href = 'index.html', 1500);
    }
  </script>
  <script src="nav.js?v=20260923c"></script>
</body>
</html>
