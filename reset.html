<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MiniPrints — Restablecer datos</title>
  <script src="theme.js?v=20260923u"></script>
  <script src="inventario.js?v=20260923u"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260923u" />
  <style>
    #toast { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); z-index: 1200; display: none; }
  </style>
  <link rel="stylesheet" href="ios.css?v=20260923u" />
  <link rel="stylesheet" href="nav.css?v=20260923u" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MiniPrints" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <script type="module" src="firebase-sync.js?v=20260923u"></script>

  <div class="page-container">
    <main class="dash-main">
      <div class="dash-header inv-header">
        <div>
          <h1 class="dash-title">Restablecer</h1>
          <p class="dash-subtitle">Elige qué borrar para empezar de cero. Guarda un respaldo antes.</p>
        </div>
      </div>

      <div class="hx-wrap">
        <h2 class="fn-sec-title">Respaldo</h2>
        <div class="rs-btns">
          <button type="button" class="inv-btn is-plain" onclick="descargarRespaldo()">Descargar respaldo</button>
          <button type="button" class="inv-btn is-plain" onclick="document.getElementById('rs-archivo').click()">Restaurar un respaldo</button>
          <input type="file" id="rs-archivo" accept="application/json,.json" hidden />
        </div>

        <div class="hx-info" style="align-items:baseline"><h2 class="fn-sec-title" style="padding:6px 0 0">Qué borrar</h2><button type="button" id="rs-todo" onclick="seleccionarTodo()">Seleccionar todo</button></div>
        <div class="hx-list" id="rs-list"></div>
        <div class="rs-keep"><b>Siempre se conservan:</b> los ajustes del taller (luz, fallas, empaque) y el grupo de WhatsApp.</div>

        <div class="rs-btns">
          <button type="button" class="inv-btn is-danger" id="rs-btn" onclick="pedirConfirmacion()">Borrar datos seleccionados</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Hoja: confirmación -->
  <div class="sheet inv-sheet" id="sh-confirmar" role="alertdialog" aria-modal="true" aria-labelledby="sh-confirmar-t" hidden>
    <div class="sheet-head">
      <h2 id="sh-confirmar-t">¿Borrar los datos?</h2>
      <button class="sheet-close" type="button" data-sheet-close aria-label="Cancelar"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11"/></svg></button>
    </div>
    <div class="inv-hero st-crit">
      <span class="hx-ico" style="width:52px;height:52px"><svg viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4M12 17.5v.01"/></svg></span>
      <span class="inv-hero-sub" style="text-align:center;font-size:15px">Esto no se puede deshacer y se borra también en tus otros dispositivos.</span>
    </div>
    <div class="inv-group" id="rs-resumen"></div>
    <div class="inv-btns">
      <button type="button" class="inv-btn is-destroy" onclick="borrar()">Borrar ahora</button>
      <button type="button" class="inv-btn is-plain" data-sheet-close>Cancelar</button>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <script>
    const { esc } = MP_INV;
    const SYNC_KEYS = ['mp_config', 'mp_materials', 'mp_piezas', 'mp_ventas', 'mp_cotizaciones', 'mp_historial', 'mp_templates', 'mp_meta_mensual', 'mp_categorias', 'mp_wa_grupo', 'mp_wa_modo'];
    const get = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
    // Se escribe vacío (en lugar de quitar la clave) para que el borrado también se sincronice
    const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

    const OPCIONES = [
      { id: 'ventas', titulo: 'Ventas', color: 'var(--ios-green)', icon: '<path d="M5.2 8h13.6l-1 11.6a1.5 1.5 0 0 1-1.5 1.4H7.7a1.5 1.5 0 0 1-1.5-1.4z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>',
        detalle: () => { const n = get('mp_ventas', []).length; return `${n} registrada${n !== 1 ? 's' : ''}`; },
        borrar: () => set('mp_ventas', []) },
      { id: 'cotizaciones', titulo: 'Cotizaciones', color: 'var(--ios-blue)', icon: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
        detalle: () => { const n = get('mp_cotizaciones', []).length; return `${n} guardada${n !== 1 ? 's' : ''}`; },
        borrar: () => set('mp_cotizaciones', []) },
      { id: 'piezas', titulo: 'Stock de piezas', color: 'var(--ios-orange)', icon: '<path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/>',
        detalle: () => { const p = Object.values(get('mp_piezas', {})); return `${p.length} modelos · ${p.reduce((s, n) => s + n, 0)} unidades`; },
        borrar: () => { set('mp_piezas', {}); set('mp_historial', {}); } },
      { id: 'materiales', titulo: 'Filamentos', color: 'var(--ios-purple)', icon: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/>',
        detalle: () => { const n = Object.keys(get('mp_materials', {})).length; return `${n} registrado${n !== 1 ? 's' : ''} · se borra la lista`; },
        borrar: () => set('mp_materials', {}) },
      { id: 'filamento', titulo: 'Solo el peso de filamentos', color: 'var(--ios-indigo)', icon: '<path d="M12 3v18M5 8l7-5 7 5"/>',
        detalle: () => 'Conserva la lista y regresa cada rollo a 1 kg',
        oculto: () => elegido.materiales,
        borrar: () => { const m = get('mp_materials', {}); Object.values(m).forEach(x => { x.pesoTotal = 1000; }); set('mp_materials', m); } },
      { id: 'plantillas', titulo: 'Plantillas del cotizador', color: 'var(--ios-teal)', icon: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M10 10v10"/>',
        detalle: () => { const n = get('mp_templates', []).length; return `${n} guardada${n !== 1 ? 's' : ''}`; },
        borrar: () => set('mp_templates', []) },
      { id: 'extras', titulo: 'Meta del mes y categorías', color: 'var(--ios-pink)', icon: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.8"/>',
        detalle: () => { const n = Object.keys(get('mp_categorias', {})).length; const m = parseFloat(localStorage.getItem('mp_meta_mensual') || '0'); return `${m > 0 ? 'Meta $' + m.toLocaleString('es-MX') : 'Sin meta'} · ${n} categoría${n !== 1 ? 's' : ''} asignada${n !== 1 ? 's' : ''}`; },
        borrar: () => { try { localStorage.setItem('mp_meta_mensual', '0'); } catch (e) {} set('mp_categorias', {}); } },
    ];
    const elegido = Object.fromEntries(OPCIONES.map(o => [o.id, ['ventas', 'cotizaciones', 'piezas'].includes(o.id)]));
    const activas = () => OPCIONES.filter(o => elegido[o.id] && !(o.oculto && o.oculto()));
    function seleccionarTodo() {
      OPCIONES.forEach(o => { elegido[o.id] = o.id !== 'filamento'; });
      render();
    }

    function render() {
      document.getElementById('rs-list').innerHTML = OPCIONES.filter(o => !(o.oculto && o.oculto())).map(o => `
        <label class="rs-row">
          <span class="hx-ico" style="background:${o.color};color:#fff"><svg viewBox="0 0 24 24">${o.icon}</svg></span>
          <span class="hx-text"><span class="hx-title">${o.titulo}</span><span class="hx-meta">${esc(o.detalle())}</span></span>
          <span class="toggle"><input type="checkbox" data-id="${o.id}" ${elegido[o.id] ? 'checked' : ''} /><span class="toggle-track"></span><span class="toggle-thumb"></span></span>
        </label>`).join('');
      const n = activas().length;
      const todo = OPCIONES.every(o => o.id === 'filamento' || elegido[o.id]);
      document.getElementById('rs-todo').textContent = todo ? '' : 'Seleccionar todo';
      const btn = document.getElementById('rs-btn');
      btn.disabled = !n;
      btn.textContent = n ? `Borrar ${n} seleccionado${n !== 1 ? 's' : ''}` : 'Elige qué borrar';
    }
    document.getElementById('rs-list').addEventListener('change', e => {
      const c = e.target.closest('[data-id]');
      if (c) { elegido[c.dataset.id] = c.checked; render(); }
    });

    function pedirConfirmacion() {
      const sel = activas();
      if (!sel.length) return;
      document.getElementById('rs-resumen').innerHTML = sel.map(o =>
        `<div class="inv-group-row"><span>${o.titulo}</span><span>${esc(o.detalle())}</span></div>`).join('');
      MP_INV.abrir('sh-confirmar');
    }
    function borrar() {
      activas().forEach(o => o.borrar());
      MP_INV.cerrar();
      render();
      MP_INV.toast('Datos borrados');
      setTimeout(() => { location.href = 'dashboard.html'; }, 1400);
    }

    // ── Respaldo de todo en un archivo ──
    function descargarRespaldo() {
      const datos = {};
      SYNC_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v != null) datos[k] = v; });
      const blob = new Blob([JSON.stringify({ app: 'MiniPrints', fecha: new Date().toISOString(), datos }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `miniprints-respaldo-${MP_INV.fecha.hoy()}.json`;
      a.click();
      MP_INV.toast('Respaldo descargado');
    }
    document.getElementById('rs-archivo').addEventListener('change', async e => {
      const f = e.target.files[0];
      e.target.value = '';
      if (!f) return;
      let r;
      try { r = JSON.parse(await f.text()); } catch (err) { return MP_INV.toast('El archivo no es un respaldo válido'); }
      const datos = r && r.app === 'MiniPrints' && r.datos;
      if (!datos) return MP_INV.toast('El archivo no es un respaldo de MiniPrints');
      const fecha = r.fecha ? new Date(r.fecha).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' }) : 'sin fecha';
      if (!confirm(`¿Restaurar el respaldo del ${fecha}? Reemplaza los datos actuales.`)) return;
      SYNC_KEYS.forEach(k => { if (typeof datos[k] === 'string') { try { localStorage.setItem(k, datos[k]); } catch (err) {} } });
      render();
      MP_INV.toast('Respaldo restaurado');
    });

    window.addEventListener('mp-sync-ready', render, { once: true });
    window.addEventListener('mp-sync-update', render);
  </script>
  <script src="nav.js?v=20260923u"></script>
</body>
</html>
