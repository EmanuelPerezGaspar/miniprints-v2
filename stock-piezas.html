<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MiniPrints — Stock Piezas</title>
  <script src="theme.js?v=20260923n"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260923n" />
  <style>
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-dim); }
    .field input, .field select {
      width: 100%; background: rgba(var(--ink), 0.05); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); font-family: var(--font);
      font-size: 0.875rem; padding: 9px 12px; outline: none; transition: border-color 180ms;
      -moz-appearance: textfield;
    }
    .field input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .field input:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(48,209,88,0.12); }
    .field select option { background: var(--ios-bg-3); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 24px; }
    .form-card-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
    .btn-row { display: flex; gap: 8px; margin-top: 16px; }
    .section-lbl { font-size: 0.7rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-dim); margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; }
    .section-lbl::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .empty-state { text-align: center; padding: 48px 24px; color: var(--text-dim); }
    #toast { position: fixed; bottom: 24px; right: 24px; background: var(--ios-bg-3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 18px; font-size: 0.85rem; color: var(--text); box-shadow: 0 8px 32px rgba(0,0,0,0.50); z-index: 999; display: none; max-width: 320px; }
    .form-card { min-width: 0; }
    .grid-2, .grid-3 { min-width: 0; }
    @media (max-width: 480px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }

    /* ── Pieza cards ── */
    .piezas-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    @media (max-width: 1024px) { .piezas-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 600px)  { .piezas-grid { grid-template-columns: repeat(2, 1fr); } }

    .pieza-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      transition: border-color 200ms, transform 200ms, box-shadow 200ms;
    }
    .pieza-card:hover {
      border-color: rgba(var(--ink), 0.15);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    }

    /* Gradient top — color según nivel de stock */
    .pieza-card-top {
      height: 72px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pieza-card-top.s-ok       { background: linear-gradient(135deg,#052e16 0%,#14532d 100%); }
    .pieza-card-top.s-low      { background: linear-gradient(135deg,#422006 0%,#92400e 100%); }
    .pieza-card-top.s-critical { background: linear-gradient(135deg,#450a0a 0%,#7f1d1d 100%); }

    /* Número grande fantasma en el fondo */
    .pieza-card-qty-ghost {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2.6rem;
      font-weight: 900;
      color: rgba(var(--ink), 0.07);
      line-height: 1;
      user-select: none;
      pointer-events: none;
    }

    /* Ícono centrado */
    .pieza-card-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: rgba(var(--ink), 0.1);
      border: 1px solid rgba(var(--ink), 0.15);
      display: flex; align-items: center; justify-content: center;
      position: relative; z-index: 1;
    }

    /* Botón eliminar — esquina superior derecha */
    .pieza-card-del {
      position: absolute; top: 10px; right: 10px;
      width: 28px; height: 28px;
      border-radius: 8px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(var(--ink), 0.1);
      color: rgba(var(--ink), 0.35);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 180ms; z-index: 2;
    }
    .pieza-card-del:hover {
      background: rgba(255,69,58,0.2);
      border-color: rgba(255,69,58,0.4);
      color: var(--ios-red);
    }

    /* Cuerpo */
    .pieza-card-body { padding: 10px 12px 12px; }
    .pieza-card-name {
      font-size: 0.82rem; font-weight: 700;
      color: var(--text); margin-bottom: 2px;
      word-break: break-word; line-height: 1.3;
    }
    .pieza-card-meta { font-size: 0.68rem; color: var(--text-dim); margin-bottom: 8px; }

    /* Footer con controles */
    .pieza-card-footer {
      display: flex; align-items: center;
      justify-content: space-between; gap: 8px;
    }
    .qty-ctrl {
      display: flex; align-items: center; gap: 4px;
      background: rgba(var(--ink), 0.04);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 2px 4px;
    }
    .qty-btn {
      width: 22px; height: 22px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(var(--ink), 0.06); border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer; font-size: 14px; font-weight: 700;
      transition: all 180ms; line-height: 1; flex-shrink: 0;
    }
    .qty-btn:hover { background: var(--surface-hover); color: var(--text); }
    .qty-num { font-size: 0.85rem; font-weight: 800; min-width: 18px; text-align: center; }
  </style>
  <link rel="stylesheet" href="ios.css?v=20260923n" />
  <link rel="stylesheet" href="nav.css?v=20260923n" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <script type="module" src="firebase-sync.js?v=20260923n"></script>

  <div class="page-container">
    <div class="dash-layout">



      <main class="dash-main">
        <div class="dash-header">
          <div>
            <h1 class="dash-title">Stock de Piezas</h1>
            <p class="dash-subtitle">Piezas impresas disponibles para venta · El cotizador descuenta materiales automáticamente.</p>
          </div>
        </div>

        <!-- KPI row -->
        <div class="kpi-grid" style="margin-bottom:24px;" id="kpi-row"></div>

        <!-- Add piece form -->
        <div class="form-card">
          <div class="form-card-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Agregar pieza manualmente
          </div>
          <div class="grid-2" style="margin-bottom:14px;">
            <div class="field"><label>Nombre de la pieza</label><input type="text" id="pieza-nombre" placeholder="Ej: Mini Cebolla" /></div>
            <div class="field"><label>Cantidad</label><input type="number" id="pieza-cantidad" value="1" min="1" /></div>
          </div>
          <div class="section-lbl">Descontar material (opcional)</div>
          <div class="grid-3" style="margin-bottom:4px;">
            <div class="field"><label>Material</label><select id="pieza-mat-sel"><option value="">— Sin descontar —</option></select></div>
            <div class="field"><label>Gramos a usar</label><input type="number" id="pieza-mat-grams" placeholder="0" min="0" step="0.1" /></div>
            <div></div>
          </div>
          <div class="btn-row">
            <button class="btn btn-primary" onclick="agregarPieza()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Agregar al inventario
            </button>
          </div>
        </div>

        <!-- List -->
        <div class="section-lbl">Inventario actual</div>
        <div id="piezas-list"></div>
      </main>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const DB = { materials: {}, piezas: {}, historial: {} };

    function loadDB() {
      try { const m = localStorage.getItem('mp_materials'); if (m) DB.materials = JSON.parse(m); } catch(e) {}
      try { const p = localStorage.getItem('mp_piezas');    if (p) DB.piezas    = JSON.parse(p); } catch(e) {}
      try { const h = localStorage.getItem('mp_historial'); if (h) DB.historial = JSON.parse(h); } catch(e) {}
    }
    function saveMats() { try { localStorage.setItem('mp_materials', JSON.stringify(DB.materials)); } catch(e) {} }
    function savePiezas() { try { localStorage.setItem('mp_piezas', JSON.stringify(DB.piezas)); } catch(e) {} }
    function saveHistorial() { try { localStorage.setItem('mp_historial', JSON.stringify(DB.historial)); } catch(e) {} }

    function showToast(msg) {
      const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
      clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 3200);
    }
    function matsSorted() { return Object.values(DB.materials).sort((a, b) => (a.marca + a.tipo + a.color).localeCompare(b.marca + b.tipo + b.color)); }
    function matLabel(m) { return `${m.marca} · ${m.tipo} · ${m.color}`; }

    function refreshMatSelect() {
      const sel = document.getElementById('pieza-mat-sel');
      const mats = matsSorted();
      sel.innerHTML = '<option value="">— Sin descontar —</option>' +
        mats.map(m => `<option value="${m.id}">${matLabel(m)} (${m.pesoTotal}g)</option>`).join('');
    }

    async function agregarPieza() {
      const nombre = document.getElementById('pieza-nombre').value.trim();
      const cantidad = parseInt(document.getElementById('pieza-cantidad').value) || 1;
      const matSel = document.getElementById('pieza-mat-sel').value;
      const matGrams = parseFloat(document.getElementById('pieza-mat-grams').value) || 0;

      if (!nombre) return showToast('Escribe el nombre de la pieza');

      if (matSel && matGrams > 0) {
        const mat = DB.materials[matSel];
        if (!mat) return showToast('Material no encontrado');
        if (mat.pesoTotal < matGrams) return showToast(`Stock insuficiente: solo hay ${mat.pesoTotal}g`);
        DB.materials[matSel].pesoTotal = Math.max(0, mat.pesoTotal - matGrams);
        saveMats();
        if (!DB.historial[nombre]) DB.historial[nombre] = [];
        DB.historial[nombre].push({ matId: matSel, grams: matGrams });
        saveHistorial();
      }

      DB.piezas[nombre] = (DB.piezas[nombre] || 0) + cantidad;
      savePiezas();
      renderKPIs();
      renderList();
      document.getElementById('pieza-nombre').value = '';
      document.getElementById('pieza-cantidad').value = 1;
      document.getElementById('pieza-mat-grams').value = '';
      document.getElementById('pieza-mat-sel').value = '';
      showToast(`${cantidad}× "${nombre}" agregadas al inventario`);
    }

    async function ajustarPieza(nombre, delta) {
      DB.piezas[nombre] = Math.max(0, (DB.piezas[nombre] || 0) + delta);
      if (DB.piezas[nombre] === 0) delete DB.piezas[nombre];
      savePiezas();
      renderKPIs();
      renderList();
    }

    async function eliminarPieza(nombre) {
      if (!confirm(`Eliminar "${nombre}" del inventario?`)) return;
      const matsUsados = DB.historial[nombre] || [];
      if (matsUsados.length > 0) {
        matsUsados.forEach(m => {
          if (DB.materials[m.matId]) DB.materials[m.matId].pesoTotal += parseFloat(m.grams);
        });
        saveMats();
        delete DB.historial[nombre];
        saveHistorial();
        showToast('Materiales restaurados al stock');
      } else {
        showToast(`"${nombre}" eliminada`);
      }
      delete DB.piezas[nombre];
      savePiezas();
      renderKPIs();
      renderList();
    }

    function renderKPIs() {
      const piezas = Object.entries(DB.piezas);
      const total = piezas.reduce((s, [, c]) => s + c, 0);
      const tipos = piezas.length;
      const bajos = piezas.filter(([, c]) => c <= 2).length;
      document.getElementById('kpi-row').innerHTML = `
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-label">Tipos de piezas</div><div class="kpi-icon" style="background:rgba(48,209,88,0.12);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${IOSC.green}" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div></div>
          <div class="kpi-value">${tipos}</div>
          <div class="kpi-change neutral" style="color:var(--text-dim);">modelos distintos</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-label">Unidades totales</div><div class="kpi-icon" style="background:rgba(10,132,255,0.12);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${IOSC.blue}" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="1"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div></div>
          <div class="kpi-value">${total}</div>
          <div class="kpi-change neutral" style="color:var(--text-dim);">piezas en stock</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-label">Stock bajo</div><div class="kpi-icon" style="background:rgba(255,214,10,0.12);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${IOSC.yellow}" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div></div>
          <div class="kpi-value" style="color:${bajos > 0 ? IOSC.yellow : IOSC.green};">${bajos}</div>
          <div class="kpi-change neutral" style="color:var(--text-dim);">con 1-2 unidades</div>
        </div>`;
    }

    function renderList() {
      const container = document.getElementById('piezas-list');
      refreshMatSelect();
      const piezas = Object.entries(DB.piezas);
      if (!piezas.length) {
        container.innerHTML = `<div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          <p style="font-size:0.9rem;font-weight:600;margin-bottom:6px;">Sin piezas en inventario</p>
          <p style="font-size:0.8rem;">Agrega piezas manualmente o confirma una impresión en el <a href="cotizador.html" style="color:var(--primary);">Cotizador</a>.</p>
        </div>`;
        return;
      }
      container.innerHTML = `<div class="piezas-grid">${piezas.map(([nombre, cant]) => {
        const topCls  = cant > 5 ? 's-ok' : cant > 2 ? 's-low' : 's-critical';
        const badgeCls = cant > 5 ? 'badge-success' : cant > 2 ? 'badge-warning' : 'badge-error';
        const badgeTxt = cant > 5 ? 'En stock' : cant > 2 ? 'Poco' : 'Último(s)';
        const escapedName = nombre.replace(/'/g, "\\'");
        return `<div class="pieza-card">
          <div class="pieza-card-top ${topCls}">
            <div class="pieza-card-qty-ghost">${cant}</div>
            <div class="pieza-card-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(var(--ink), 0.8)" stroke-width="1.8">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                <line x1="12" y1="22.08" x2="12" y2="12"/>
              </svg>
            </div>
            <button class="pieza-card-del" onclick="eliminarPieza('${escapedName}')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
            </button>
          </div>
          <div class="pieza-card-body">
            <div class="pieza-card-name">${nombre}</div>
            <div class="pieza-card-meta">${cant} unidad${cant !== 1 ? 'es' : ''} disponible${cant !== 1 ? 's' : ''}</div>
            <div class="pieza-card-footer">
              <div class="qty-ctrl">
                <button class="qty-btn" onclick="ajustarPieza('${escapedName}', -1)">−</button>
                <span class="qty-num">${cant}</span>
                <button class="qty-btn" onclick="ajustarPieza('${escapedName}', 1)">+</button>
              </div>
              <span class="badge ${badgeCls}">${badgeTxt}</span>
            </div>
          </div>
        </div>`;
      }).join('')}</div>`;
    }


    function mpInit() { loadDB(); renderKPIs(); renderList(); }
    window.addEventListener('mp-sync-ready', mpInit, { once: true });
    window.addEventListener('mp-sync-update', mpInit);
  </script>
  <script src="nav.js?v=20260923n"></script>
</body>
</html>
