<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MiniPrints — Piezas</title>
  <script src="theme.js?v=20260924b"></script>
  <script src="categorias.js?v=20260924b"></script>
  <script src="inventario.js?v=20260924b"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260924b" />
  <style>
    #toast { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); z-index: 1200; display: none; }
  </style>
  <link rel="stylesheet" href="ios.css?v=20260924b" />
  <link rel="stylesheet" href="nav.css?v=20260924b" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MiniPrints" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <script type="module" src="firebase-sync.js?v=20260924b"></script>

  <div class="page-container">
    <main class="dash-main">
      <div class="dash-header inv-header">
        <div>
          <h1 class="dash-title">Piezas</h1>
          <p class="dash-subtitle" id="inv-sub">Piezas impresas listas para vender.</p>
        </div>
        <div class="inv-actions">
          <button type="button" class="inv-icon-btn is-primary" onclick="abrirNueva()" aria-label="Agregar piezas">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>

      <div class="inv-wrap">
        <div class="inv-sum" id="inv-sum"></div>

        <section class="form-card inv-card" aria-label="Inventario de piezas">
          <input type="search" id="inv-buscar" class="vs-search" placeholder="Buscar pieza" autocomplete="off" aria-label="Buscar pieza" />
          <div class="vs-cats" id="inv-cats" role="radiogroup" aria-label="Filtrar"></div>
          <div class="vs-list-head"><span id="inv-count"></span><span>Toca una pieza para editarla</span></div>
          <div class="inv-list" id="inv-list" role="list"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- Hoja: agregar piezas -->
  <div class="sheet inv-sheet" id="sh-nueva" role="dialog" aria-modal="true" aria-labelledby="sh-nueva-t" hidden>
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sh-nueva-t">Agregar piezas</h2>
      <button class="sheet-close" type="button" data-sheet-close aria-label="Cerrar"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11"/></svg></button>
    </div>
    <div class="inv-f">
      <label for="n-nombre">Pieza</label>
      <input type="text" id="n-nombre" list="n-nombres" placeholder="Ej: Llavero corazón" autocomplete="off" />
      <datalist id="n-nombres"></datalist>
      <p class="inv-hint" id="n-hint"></p>
    </div>
    <div class="inv-f">
      <span class="inv-f-lbl">Cantidad</span>
      <div class="cq-stepper">
        <button type="button" aria-label="Menos" onclick="pasoNueva(-1)">−</button>
        <input type="number" id="n-cant" value="1" min="1" inputmode="numeric" aria-label="Cantidad" />
        <button type="button" aria-label="Más" onclick="pasoNueva(1)">+</button>
      </div>
    </div>
    <div class="inv-f">
      <span class="inv-f-lbl">Categoría</span>
      <div class="cq-chips" data-for="n-cat" role="radiogroup" aria-label="Categoría" id="n-cats"></div>
      <input type="hidden" id="n-cat" value="" />
    </div>
    <div class="inv-group">
      <label class="inv-group-row">
        <span>Descontar filamento</span>
        <span class="toggle"><input type="checkbox" id="n-desc" onchange="toggleDescuento()" /><span class="toggle-track"></span><span class="toggle-thumb"></span></span>
      </label>
      <div class="inv-group-body" id="n-desc-body" hidden>
        <select id="n-mat" aria-label="Filamento"></select>
        <input type="number" id="n-grams" placeholder="Gramos usados en total" min="0" step="0.1" inputmode="decimal" aria-label="Gramos usados" />
      </div>
    </div>
    <div class="inv-btns">
      <button type="button" class="inv-btn" onclick="agregarPieza()">Agregar al inventario</button>
    </div>
  </div>

  <!-- Hoja: editar una pieza -->
  <div class="sheet inv-sheet" id="sh-pieza" role="dialog" aria-modal="true" aria-labelledby="sh-pieza-t" hidden>
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sh-pieza-t">Pieza</h2>
      <button class="sheet-close" type="button" data-sheet-close aria-label="Cerrar"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11"/></svg></button>
    </div>
    <p class="inv-sheet-sub" id="e-sub"></p>
    <div class="inv-f">
      <span class="inv-f-lbl">Unidades en stock</span>
      <div class="cq-stepper">
        <button type="button" aria-label="Menos" onclick="pasoEdit(-1)">−</button>
        <input type="number" id="e-cant" min="0" inputmode="numeric" aria-label="Unidades en stock" />
        <button type="button" aria-label="Más" onclick="pasoEdit(1)">+</button>
      </div>
    </div>
    <div class="inv-f">
      <span class="inv-f-lbl">Categoría</span>
      <div class="cq-chips" data-for="e-cat" role="radiogroup" aria-label="Categoría" id="e-cats"></div>
      <input type="hidden" id="e-cat" value="" />
      <p class="inv-hint" id="e-cat-hint"></p>
    </div>
    <div class="inv-group" id="e-mats"></div>
    <div class="inv-btns">
      <button type="button" class="inv-btn" onclick="guardarPieza()">Guardar</button>
      <button type="button" class="inv-btn is-danger" onclick="eliminarPieza()">Eliminar del inventario</button>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <script>
    const { esc } = MP_INV;
    const DB = { materials: {}, piezas: {}, historial: {}, categorias: {} };
    const BAJO = 2, POCO = 5;

    function loadDB() {
      const get = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
      DB.materials  = get('mp_materials', {});
      DB.piezas     = get('mp_piezas', {});
      DB.historial  = get('mp_historial', {});
      DB.categorias = get('mp_categorias', {});
    }
    const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
    const saveMats       = () => save('mp_materials', DB.materials);
    const savePiezas     = () => save('mp_piezas', DB.piezas);
    const saveHistorial  = () => save('mp_historial', DB.historial);
    const saveCategorias = () => save('mp_categorias', DB.categorias);

    const catDe = p => MP_CAT.de(p, DB.categorias);
    const catNombre = id => (MP_CAT.lista.find(c => c.id === id) || {}).nombre || 'Sin categoría';
    function estado(n) {
      if (n > POCO) return { cls: 'st-ok', txt: 'En stock' };
      if (n > BAJO) return { cls: 'st-low', txt: 'Poco stock' };
      return { cls: 'st-crit', txt: n === 1 ? 'Última unidad' : 'Por agotarse' };
    }
    const ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg>';
    const matLabel = m => `${m.tipo} ${m.color} · ${m.marca}`;
    const matsSorted = () => Object.values(DB.materials).sort((a, b) => (a.tipo + a.color + a.marca).localeCompare(b.tipo + b.color + b.marca, 'es'));

    // ── Resumen ──
    let filtro = 'todas';
    function renderResumen() {
      const piezas = Object.entries(DB.piezas);
      const uds = piezas.reduce((s, [, n]) => s + n, 0);
      const bajas = piezas.filter(([, n]) => n <= BAJO).length;
      document.getElementById('inv-sub').textContent = piezas.length
        ? `${piezas.length} modelo${piezas.length !== 1 ? 's' : ''} · ${uds} unidad${uds !== 1 ? 'es' : ''} listas para vender`
        : 'Piezas impresas listas para vender.';
      document.getElementById('inv-sum').innerHTML = `
        <div class="inv-tile" style="--tile-color:var(--ios-blue)">
          <span class="inv-tile-lbl"><i></i>Modelos</span>
          <span class="inv-tile-num">${piezas.length}</span>
          <span class="inv-tile-sub">distintos</span>
        </div>
        <div class="inv-tile" style="--tile-color:var(--ios-green)">
          <span class="inv-tile-lbl"><i></i>Unidades</span>
          <span class="inv-tile-num">${uds.toLocaleString('es-MX')}</span>
          <span class="inv-tile-sub">en stock</span>
        </div>
        <button type="button" class="inv-tile${bajas ? ' is-alert' : ''}${filtro === 'bajas' ? ' is-on' : ''}" style="--tile-color:${bajas ? 'var(--ios-orange)' : 'var(--ios-green)'}"
                onclick="setFiltro(filtro === 'bajas' ? 'todas' : 'bajas')" aria-pressed="${filtro === 'bajas'}">
          <span class="inv-tile-lbl"><i></i>Bajos</span>
          <span class="inv-tile-num">${bajas}</span>
          <span class="inv-tile-sub">${bajas ? 'toca para ver' : 'todo bien'}</span>
        </button>`;
    }

    // ── Lista ──
    function setFiltro(f) { filtro = f; renderResumen(); renderLista(); }

    function renderCats(nombres) {
      const cuenta = { todas: nombres.length, bajas: 0, otras: 0 };
      nombres.forEach(p => {
        const c = catDe(p) || 'otras';
        cuenta[c] = (cuenta[c] || 0) + 1;
        if (DB.piezas[p] <= BAJO) cuenta.bajas++;
      });
      const ops = [{ id: 'todas', nombre: 'Todas' }, { id: 'bajas', nombre: 'Por agotarse' }, ...MP_CAT.lista, { id: 'otras', nombre: 'Sin categoría' }]
        .filter(o => o.id === 'todas' || cuenta[o.id] || o.id === filtro);
      document.getElementById('inv-cats').innerHTML = ops.map(o =>
        `<button type="button" role="radio" data-f="${o.id}" aria-checked="${o.id === filtro}">${o.nombre} <span>${cuenta[o.id] || 0}</span></button>`).join('');
    }

    function renderLista() {
      const list = document.getElementById('inv-list');
      const q = document.getElementById('inv-buscar').value.trim().toLowerCase();
      const nombres = Object.keys(DB.piezas);
      renderCats(nombres);
      if (!nombres.length) {
        document.getElementById('inv-count').textContent = '';
        list.innerHTML = `<div class="inv-empty"><b>Aún no hay piezas</b>Agrégalas aquí o confirma una impresión en Cotizar.<br>
          <button type="button" class="btn btn-primary" onclick="abrirNueva()">Agregar piezas</button></div>`;
        return;
      }
      const vis = nombres
        .filter(p => filtro === 'todas' || (filtro === 'bajas' ? DB.piezas[p] <= BAJO : (catDe(p) || 'otras') === filtro))
        .filter(p => !q || p.toLowerCase().includes(q))
        .sort((a, b) => a.localeCompare(b, 'es'));
      document.getElementById('inv-count').textContent = `${vis.length} de ${nombres.length} piezas`;
      if (!vis.length) { list.innerHTML = `<div class="inv-empty">Sin resultados${q ? ` para "${esc(q)}"` : ''}</div>`; return; }
      list.innerHTML = vis.map(p => {
        const n = DB.piezas[p], st = estado(n), cat = catDe(p);
        return `<div class="inv-row ${st.cls}" role="listitem" data-p="${esc(p)}">
          <button type="button" class="inv-row-main" data-act="abrir" aria-label="Editar ${esc(p)}">
            <span class="inv-mark">${ICON}</span>
            <span class="inv-row-text">
              <span class="inv-row-name">${esc(p)}</span>
              <span class="inv-row-meta"><b>${st.txt}</b>${cat ? ' · ' + catNombre(cat) : ''}</span>
            </span>
          </button>
          <div class="inv-step" role="group" aria-label="Unidades de ${esc(p)}">
            <button type="button" data-act="menos" aria-label="Quitar una">−</button>
            <span aria-live="polite">${n}</span>
            <button type="button" data-act="mas" aria-label="Agregar una">+</button>
          </div>
        </div>`;
      }).join('');
    }

    document.getElementById('inv-cats').addEventListener('click', e => {
      const b = e.target.closest('[data-f]');
      if (b) setFiltro(b.dataset.f);
    });
    document.getElementById('inv-buscar').addEventListener('input', renderLista);
    document.getElementById('inv-list').addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const p = b.closest('[data-p]').dataset.p;
      if (b.dataset.act === 'abrir') abrirPieza(p);
      else ajustarPieza(p, b.dataset.act === 'mas' ? 1 : -1);
    });

    function ajustarPieza(nombre, delta) {
      const n = (DB.piezas[nombre] || 0) + delta;
      if (n <= 0) {
        if (!confirm(`Ya no quedan unidades de "${nombre}". ¿Quitarla del inventario?`)) return;
        delete DB.piezas[nombre];
        MP_INV.toast(`"${nombre}" salió del inventario`);
      } else {
        DB.piezas[nombre] = n;
      }
      savePiezas();
      render();
    }

    function chipsCategoria(contId, valor) {
      document.getElementById(contId).innerHTML = [...MP_CAT.lista, { id: 'otras', nombre: 'Sin categoría' }]
        .map(c => `<button type="button" role="radio" data-v="${c.id}" aria-checked="${c.id === valor}">${c.nombre}</button>`).join('');
    }

    // ── Agregar ──
    function abrirNueva() {
      document.getElementById('n-nombre').value = '';
      document.getElementById('n-cant').value = 1;
      document.getElementById('n-desc').checked = false;
      document.getElementById('n-grams').value = '';
      document.getElementById('n-nombres').innerHTML = Object.keys(DB.piezas).sort((a, b) => a.localeCompare(b, 'es'))
        .map(p => `<option value="${esc(p)}"></option>`).join('');
      const mats = matsSorted();
      document.getElementById('n-mat').innerHTML = mats.length
        ? mats.map(m => `<option value="${esc(m.id)}">${esc(matLabel(m))} — ${Math.round(m.pesoTotal)} g</option>`).join('')
        : '<option value="">No hay filamentos registrados</option>';
      document.getElementById('n-cat').value = '';
      chipsCategoria('n-cats', '');
      toggleDescuento();
      nombreNueva();
      MP_INV.abrir('sh-nueva');
      setTimeout(() => document.getElementById('n-nombre').focus(), 350);
    }
    function pasoNueva(d) {
      const i = document.getElementById('n-cant');
      i.value = Math.max(1, (parseInt(i.value) || 0) + d);
    }
    function toggleDescuento() {
      document.getElementById('n-desc-body').hidden = !document.getElementById('n-desc').checked;
    }
    // Si la pieza ya existe se suma y se sugiere su categoría
    function nombreNueva() {
      const nombre = document.getElementById('n-nombre').value.trim();
      const hint = document.getElementById('n-hint');
      const existe = Object.keys(DB.piezas).find(p => p.toLowerCase() === nombre.toLowerCase());
      hint.className = 'inv-hint' + (existe ? ' is-ok' : '');
      hint.textContent = existe ? `Ya tienes ${DB.piezas[existe]}; se sumarán a las existentes.` : '';
      const cat = nombre ? (catDe(existe || nombre) || '') : '';
      document.getElementById('n-cat').value = cat;
      MP_INV.syncChips(document.getElementById('sh-nueva'));
    }
    document.getElementById('n-nombre').addEventListener('input', nombreNueva);

    function agregarPieza() {
      let nombre = document.getElementById('n-nombre').value.trim();
      const cantidad = Math.max(1, parseInt(document.getElementById('n-cant').value) || 1);
      if (!nombre) { MP_INV.toast('Escribe el nombre de la pieza'); return document.getElementById('n-nombre').focus(); }
      nombre = Object.keys(DB.piezas).find(p => p.toLowerCase() === nombre.toLowerCase()) || nombre;

      if (document.getElementById('n-desc').checked) {
        const matId = document.getElementById('n-mat').value;
        const grams = parseFloat(document.getElementById('n-grams').value) || 0;
        const mat = DB.materials[matId];
        if (!mat) return MP_INV.toast('Elige el filamento a descontar');
        if (grams <= 0) return MP_INV.toast('Escribe los gramos usados');
        if (mat.pesoTotal < grams) return MP_INV.toast(`Solo quedan ${Math.round(mat.pesoTotal)} g de ese filamento`);
        mat.pesoTotal = Math.max(0, mat.pesoTotal - grams);
        saveMats();
        (DB.historial[nombre] = DB.historial[nombre] || []).push({ matId, grams });
        saveHistorial();
      }

      const cat = document.getElementById('n-cat').value;
      if (cat && cat !== MP_CAT.de(nombre, {})) { DB.categorias[nombre] = cat; saveCategorias(); }

      DB.piezas[nombre] = (DB.piezas[nombre] || 0) + cantidad;
      savePiezas();
      MP_INV.cerrar();
      render();
      MP_INV.toast(`${cantidad} × ${nombre} agregada${cantidad !== 1 ? 's' : ''}`);
    }

    // ── Editar ──
    let editando = null;
    function abrirPieza(nombre) {
      editando = nombre;
      const n = DB.piezas[nombre] || 0, st = estado(n);
      document.getElementById('sh-pieza-t').textContent = nombre;
      document.getElementById('e-sub').innerHTML = `<span class="${st.cls}" style="color:var(--st-color);font-weight:600">${st.txt}</span>`;
      document.getElementById('e-cant').value = n;
      const asignada = DB.categorias[nombre] || '';
      const cat = catDe(nombre) || '';
      document.getElementById('e-cat').value = cat;
      chipsCategoria('e-cats', cat);
      document.getElementById('e-cat-hint').textContent = !asignada && cat ? 'Sugerida por el nombre; toca otra si no es correcta.' : '';

      const usados = DB.historial[nombre] || [];
      const box = document.getElementById('e-mats');
      box.hidden = !usados.length;
      box.innerHTML = usados.map(u => {
        const m = DB.materials[u.matId];
        return `<div class="inv-group-row"><span>${esc(m ? matLabel(m) : 'Filamento eliminado')}</span><span>${parseFloat(u.grams)} g</span></div>`;
      }).join('');
      MP_INV.abrir('sh-pieza');
    }
    function pasoEdit(d) {
      const i = document.getElementById('e-cant');
      i.value = Math.max(0, (parseInt(i.value) || 0) + d);
    }
    function guardarPieza() {
      if (!editando) return;
      const n = Math.max(0, parseInt(document.getElementById('e-cant').value) || 0);
      if (n === 0) {
        if (!confirm(`Con 0 unidades "${editando}" sale del inventario. ¿Continuar?`)) return;
        delete DB.piezas[editando];
      } else {
        DB.piezas[editando] = n;
      }
      savePiezas();
      const cat = document.getElementById('e-cat').value;
      if (cat && cat !== MP_CAT.de(editando, {})) DB.categorias[editando] = cat;
      else delete DB.categorias[editando];
      saveCategorias();
      MP_INV.cerrar();
      render();
      MP_INV.toast('Cambios guardados');
    }
    // Al eliminar se devuelve al stock el filamento que se descontó al agregarla
    function eliminarPieza() {
      const nombre = editando;
      if (!nombre || !confirm(`¿Eliminar "${nombre}" del inventario?`)) return;
      const usados = DB.historial[nombre] || [];
      usados.forEach(u => { if (DB.materials[u.matId]) DB.materials[u.matId].pesoTotal += parseFloat(u.grams); });
      if (usados.length) { saveMats(); delete DB.historial[nombre]; saveHistorial(); }
      delete DB.piezas[nombre];
      savePiezas();
      MP_INV.cerrar();
      render();
      MP_INV.toast(usados.length ? 'Pieza eliminada · filamento devuelto al stock' : 'Pieza eliminada');
    }

    function render() { renderResumen(); renderLista(); }
    function mpInit() { loadDB(); render(); }
    window.addEventListener('mp-sync-ready', mpInit, { once: true });
    window.addEventListener('mp-sync-update', mpInit);
  </script>
  <script src="nav.js?v=20260924b"></script>
</body>
</html>
