<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MiniPrints — Material</title>
  <script src="theme.js?v=20260923u"></script>
  <script src="inventario.js?v=20260923u"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260923u" />
  <style>
    #toast { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); z-index: 1200; display: none; }
  </style>
  <link rel="stylesheet" href="ios.css?v=20260923u" />
  <link rel="stylesheet" href="nav.css?v=20260923u" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MiniPrints" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <script type="module" src="firebase-sync.js?v=20260923u"></script>

  <div class="page-container">
    <main class="dash-main">
      <div class="dash-header inv-header">
        <div>
          <h1 class="dash-title">Material</h1>
          <p class="dash-subtitle" id="inv-sub">Filamentos disponibles para imprimir.</p>
        </div>
        <div class="inv-actions">
          <button type="button" class="inv-icon-btn" onclick="MP_INV.abrir('sh-respaldo')" aria-label="Respaldo: exportar o importar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v13M3 13l4 4 4-4M17 20V7M13 11l4-4 4 4"/></svg>
          </button>
          <button type="button" class="inv-icon-btn is-primary" onclick="abrirNuevo()" aria-label="Agregar filamento">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>

      <div class="inv-wrap">
        <div class="inv-sum is-4" id="inv-sum"></div>

        <section class="form-card inv-card" aria-label="Filamentos">
          <input type="search" id="inv-buscar" class="vs-search" placeholder="Buscar filamento" autocomplete="off" aria-label="Buscar filamento" />
          <div class="vs-cats" id="inv-cats" role="radiogroup" aria-label="Filtrar"></div>
          <div class="vs-list-head"><span id="inv-count"></span><span>Toca uno para editar</span></div>
          <div class="inv-list" id="inv-list" role="list"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- Hoja: nuevo filamento / reabastecer -->
  <div class="sheet inv-sheet" id="sh-nuevo" role="dialog" aria-modal="true" aria-labelledby="sh-nuevo-t" hidden>
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sh-nuevo-t">Agregar filamento</h2>
      <button class="sheet-close" type="button" data-sheet-close aria-label="Cerrar"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11"/></svg></button>
    </div>
    <div class="inv-row3">
      <div class="inv-f"><label for="n-tipo">Material</label><input type="text" id="n-tipo" list="l-tipos" placeholder="PLA" autocomplete="off" /></div>
      <div class="inv-f"><label for="n-color">Color</label><input type="text" id="n-color" list="l-colores" placeholder="Negro" autocomplete="off" /></div>
      <div class="inv-f"><label for="n-marca">Marca</label><input type="text" id="n-marca" list="l-marcas" placeholder="Creality" autocomplete="off" /></div>
    </div>
    <datalist id="l-tipos"></datalist><datalist id="l-colores"></datalist><datalist id="l-marcas"></datalist>
    <p class="inv-hint" id="n-hint"></p>
    <div class="inv-f">
      <span class="inv-f-lbl">Cantidad</span>
      <div class="cq-chips" data-for="n-rollo" role="radiogroup" aria-label="Tamaño del rollo">
        <button type="button" data-v="1000">1 rollo · 1 kg</button>
        <button type="button" data-v="2000">2 rollos · 2 kg</button>
        <button type="button" data-v="500">500 g</button>
        <button type="button" data-v="otro">Otro</button>
      </div>
      <input type="hidden" id="n-rollo" value="1000" />
      <input type="number" id="n-peso" placeholder="Gramos" min="1" inputmode="numeric" aria-label="Gramos" hidden />
    </div>
    <div class="inv-f">
      <label for="n-costo">Precio por kg</label>
      <input type="number" id="n-costo" placeholder="$399" min="0" step="1" inputmode="decimal" />
    </div>
    <div class="inv-btns">
      <button type="button" class="inv-btn" id="n-btn" onclick="guardarNuevo()">Agregar al inventario</button>
    </div>
  </div>

  <!-- Hoja: editar filamento -->
  <div class="sheet inv-sheet" id="sh-mat" role="dialog" aria-modal="true" aria-labelledby="sh-mat-t" hidden>
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sh-mat-t">Filamento</h2>
      <button class="sheet-close" type="button" data-sheet-close aria-label="Cerrar"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11"/></svg></button>
    </div>
    <p class="inv-sheet-sub" id="e-sub"></p>
    <div class="inv-hero" id="e-hero"></div>
    <div class="inv-f">
      <span class="inv-f-lbl">Reabastecer</span>
      <div class="inv-quick">
        <button type="button" onclick="sumarPeso(1000)">+ 1 kg</button>
        <button type="button" onclick="sumarPeso(500)">+ 500 g</button>
        <button type="button" onclick="sumarPeso(250)">+ 250 g</button>
      </div>
    </div>
    <div class="inv-row2">
      <div class="inv-f"><label for="e-peso">Gramos restantes</label><input type="number" id="e-peso" min="0" inputmode="numeric" /></div>
      <div class="inv-f"><label for="e-costo">Precio por kg</label><input type="number" id="e-costo" min="0" step="1" inputmode="decimal" /></div>
    </div>
    <div class="inv-btns">
      <button type="button" class="inv-btn" onclick="guardarMat()">Guardar</button>
      <button type="button" class="inv-btn is-danger" onclick="eliminarMaterial()">Eliminar filamento</button>
    </div>
  </div>

  <!-- Hoja: respaldo -->
  <div class="sheet inv-sheet" id="sh-respaldo" role="dialog" aria-modal="true" aria-labelledby="sh-respaldo-t" hidden>
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sh-respaldo-t">Respaldo</h2>
      <button class="sheet-close" type="button" data-sheet-close aria-label="Cerrar"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11"/></svg></button>
    </div>
    <p class="inv-sheet-sub">Guarda tus filamentos en un archivo o trae una lista de otro sistema.</p>
    <button type="button" class="inv-btn is-plain" onclick="exportarJSON()">Exportar archivo</button>
    <div class="inv-f">
      <label for="import-json">Importar (pega el JSON)</label>
      <textarea id="import-json" placeholder='{"creality-pla-negro":{"id":"creality-pla-negro","marca":"CREALITY",...}}'></textarea>
      <p class="inv-hint" id="import-msg"></p>
    </div>
    <button type="button" class="inv-btn" onclick="importarJSON()">Importar</button>
  </div>

  <div id="toast" role="status"></div>

  <script>
    const { esc } = MP_INV;
    const DB = { materials: {} };
    const BAJO = 500, CRITICO = 200;

    function loadDB() {
      try { DB.materials = JSON.parse(localStorage.getItem('mp_materials')) || {}; } catch (e) { DB.materials = {}; }
    }
    function saveDB() { try { localStorage.setItem('mp_materials', JSON.stringify(DB.materials)); } catch (e) {} }

    const fmt = n => '$' + parseFloat(n || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmt0 = n => '$' + Math.round(n || 0).toLocaleString('es-MX');
    const gramos = g => Math.round(g).toLocaleString('es-MX');
    const matId = (marca, tipo, color) => (marca + '-' + tipo + '-' + color).toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
    const matsSorted = () => Object.values(DB.materials).sort((a, b) => (a.tipo + a.color + a.marca).localeCompare(b.tipo + b.color + b.marca, 'es'));

    function estado(g) {
      if (g > BAJO) return { cls: 'st-ok', txt: 'Suficiente' };
      if (g > CRITICO) return { cls: 'st-low', txt: 'Queda poco' };
      return { cls: 'st-crit', txt: g > 0 ? 'Por acabarse' : 'Agotado' };
    }

    // Color aproximado de la muestra según el nombre del color
    const COLORES = [
      [/negro|black/i, '#1c1c1e'], [/blanc|white|natural/i, '#f5f5f0'], [/gris|gray|grey|plata|silver/i, '#9a9aa0'],
      [/rojo|red/i, '#e5322d'], [/naranja|orange/i, '#ff8a1f'], [/amarill|yellow/i, '#ffd21f'],
      [/verde|green/i, '#34c759'], [/azul|blue|marino/i, '#2f6bff'], [/celeste|cian|cyan|turquesa|aqua/i, '#35c7e6'],
      [/morado|purpura|púrpura|violeta|lila|purple/i, '#9b5de5'], [/rosa|pink|fucsia|magenta/i, '#ff5fa2'],
      [/caf[eé]|marr[oó]n|brown|madera|wood|chocolate/i, '#8b5a2b'], [/dorad|oro|gold/i, '#d4a72c'],
      [/beige|crema|arena|piel/i, '#e3cfa4'], [/transl|transp|clear|cristal/i, 'rgba(160,200,255,0.35)'],
    ];
    const swatch = color => (COLORES.find(([re]) => re.test(color || '')) || [0, 'var(--ios-fill)'])[1];

    // ── Resumen ──
    let filtro = 'todos';
    function renderResumen() {
      const mats = matsSorted();
      const peso = mats.reduce((s, m) => s + m.pesoTotal, 0);
      const valor = mats.reduce((s, m) => s + (m.pesoTotal / 1000) * m.costo, 0);
      const bajos = mats.filter(m => m.pesoTotal <= CRITICO).length;
      document.getElementById('inv-sub').textContent = mats.length
        ? `${mats.length} filamento${mats.length !== 1 ? 's' : ''} · ${(peso / 1000).toLocaleString('es-MX', { maximumFractionDigits: 1 })} kg disponibles`
        : 'Filamentos disponibles para imprimir.';
      document.getElementById('inv-sum').innerHTML = `
        <div class="inv-tile" style="--tile-color:var(--ios-purple)">
          <span class="inv-tile-lbl"><i></i>Filamentos</span>
          <span class="inv-tile-num">${mats.length}</span>
          <span class="inv-tile-sub">registrados</span>
        </div>
        <div class="inv-tile" style="--tile-color:var(--ios-blue)">
          <span class="inv-tile-lbl"><i></i>Peso total</span>
          <span class="inv-tile-num">${(peso / 1000).toLocaleString('es-MX', { maximumFractionDigits: 1 })}<small>kg</small></span>
          <span class="inv-tile-sub">${gramos(peso)} g</span>
        </div>
        <div class="inv-tile" style="--tile-color:var(--ios-green)">
          <span class="inv-tile-lbl"><i></i>Valor</span>
          <span class="inv-tile-num">${fmt0(valor)}</span>
          <span class="inv-tile-sub">en material</span>
        </div>
        <button type="button" class="inv-tile${bajos ? ' is-alert' : ''}${filtro === 'bajos' ? ' is-on' : ''}" style="--tile-color:${bajos ? 'var(--ios-red)' : 'var(--ios-green)'}"
                onclick="setFiltro(filtro === 'bajos' ? 'todos' : 'bajos')" aria-pressed="${filtro === 'bajos'}">
          <span class="inv-tile-lbl"><i></i>Por acabarse</span>
          <span class="inv-tile-num">${bajos}</span>
          <span class="inv-tile-sub">${bajos ? `≤ ${CRITICO} g · toca para ver` : 'todo bien'}</span>
        </button>`;
    }

    // ── Lista ──
    function setFiltro(f) { filtro = f; renderResumen(); renderLista(); }

    function renderCats(mats) {
      const cuenta = { todos: mats.length, bajos: mats.filter(m => m.pesoTotal <= CRITICO).length };
      mats.forEach(m => { const t = 't:' + m.tipo; cuenta[t] = (cuenta[t] || 0) + 1; });
      const tipos = [...new Set(mats.map(m => m.tipo))].sort((a, b) => a.localeCompare(b, 'es'));
      const ops = [{ id: 'todos', nombre: 'Todos' }, { id: 'bajos', nombre: 'Por acabarse' }, ...tipos.map(t => ({ id: 't:' + t, nombre: t }))]
        .filter(o => o.id === 'todos' || cuenta[o.id] || o.id === filtro);
      if (tipos.length < 2) ops.splice(2);
      document.getElementById('inv-cats').innerHTML = ops.map(o =>
        `<button type="button" role="radio" data-f="${esc(o.id)}" aria-checked="${o.id === filtro}">${esc(o.nombre)} <span>${cuenta[o.id] || 0}</span></button>`).join('');
    }

    function renderLista() {
      const list = document.getElementById('inv-list');
      const q = document.getElementById('inv-buscar').value.trim().toLowerCase();
      const mats = matsSorted();
      renderCats(mats);
      if (!mats.length) {
        document.getElementById('inv-count').textContent = '';
        list.innerHTML = `<div class="inv-empty"><b>Sin filamentos</b>Registra tus rollos para que Cotizar calcule el costo del material.<br>
          <button type="button" class="btn btn-primary" onclick="abrirNuevo()">Agregar filamento</button></div>`;
        return;
      }
      const vis = mats
        .filter(m => filtro === 'todos' || (filtro === 'bajos' ? m.pesoTotal <= CRITICO : 't:' + m.tipo === filtro))
        .filter(m => !q || `${m.marca} ${m.tipo} ${m.color}`.toLowerCase().includes(q));
      document.getElementById('inv-count').textContent = `${vis.length} de ${mats.length} filamentos`;
      if (!vis.length) { list.innerHTML = `<div class="inv-empty">Sin resultados${q ? ` para "${esc(q)}"` : ''}</div>`; return; }
      list.innerHTML = vis.map(m => {
        const st = estado(m.pesoTotal);
        const pct = Math.min(100, m.pesoTotal / 10);
        return `<div class="inv-row ${st.cls}" role="listitem">
          <button type="button" class="inv-row-main" data-id="${esc(m.id)}" aria-label="Editar ${esc(m.tipo + ' ' + m.color + ' ' + m.marca)}, ${gramos(m.pesoTotal)} gramos">
            <span class="inv-swatch" style="--sw:${swatch(m.color)}"></span>
            <span class="inv-row-text">
              <span class="inv-row-name">${esc(m.tipo)} · ${esc(m.color)}</span>
              <span class="inv-row-meta">${esc(m.marca)} · ${fmt0(m.costo)}/kg${m.pesoTotal <= BAJO ? ` · <b>${st.txt}</b>` : ''}</span>
            </span>
          </button>
          <div class="inv-grams" aria-hidden="true">
            <span class="inv-grams-num">${gramos(m.pesoTotal)}<small>g</small></span>
            <span class="inv-bar"><i style="width:${pct.toFixed(0)}%"></i></span>
          </div>
          <svg class="inv-chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>
        </div>`;
      }).join('');
    }

    document.getElementById('inv-cats').addEventListener('click', e => {
      const b = e.target.closest('[data-f]');
      if (b) setFiltro(b.dataset.f);
    });
    document.getElementById('inv-buscar').addEventListener('input', renderLista);
    document.getElementById('inv-list').addEventListener('click', e => {
      const b = e.target.closest('[data-id]');
      if (b) abrirMat(b.dataset.id);
    });

    // ── Nuevo / reabastecer ──
    function abrirNuevo() {
      ['n-tipo', 'n-color', 'n-marca', 'n-costo', 'n-peso'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('n-rollo').value = '1000';
      const lista = (campo) => [...new Set(Object.values(DB.materials).map(m => m[campo]))].sort().map(v => `<option value="${esc(v)}"></option>`).join('');
      document.getElementById('l-tipos').innerHTML = lista('tipo');
      document.getElementById('l-colores').innerHTML = lista('color');
      document.getElementById('l-marcas').innerHTML = lista('marca');
      cambioRollo();
      revisarNuevo();
      MP_INV.abrir('sh-nuevo');
      setTimeout(() => document.getElementById('n-tipo').focus(), 350);
    }
    function cambioRollo() {
      const otro = document.getElementById('n-rollo').value === 'otro';
      document.getElementById('n-peso').hidden = !otro;
      MP_INV.syncChips(document.getElementById('sh-nuevo'));
      if (otro) document.getElementById('n-peso').focus();
    }
    document.getElementById('n-rollo').addEventListener('change', cambioRollo);

    function datosNuevo() {
      const v = id => document.getElementById(id).value.trim().toUpperCase();
      const marca = v('n-marca'), tipo = v('n-tipo'), color = v('n-color');
      return { marca, tipo, color, id: marca && tipo && color ? matId(marca, tipo, color) : '' };
    }
    // Si ya existe ese filamento, se reabastece en vez de duplicarse
    function revisarNuevo() {
      const { id } = datosNuevo();
      const m = id && DB.materials[id];
      const hint = document.getElementById('n-hint');
      hint.className = 'inv-hint' + (m ? ' is-ok' : '');
      hint.textContent = m ? `Ya lo tienes (${gramos(m.pesoTotal)} g): se sumará a lo que queda.` : '';
      document.getElementById('n-btn').textContent = m ? 'Reabastecer' : 'Agregar al inventario';
      const costo = document.getElementById('n-costo');
      if (m && !costo.value) costo.placeholder = fmt0(m.costo);
      else if (!m) costo.placeholder = '$399';
    }
    ['n-marca', 'n-tipo', 'n-color'].forEach(id => document.getElementById(id).addEventListener('input', revisarNuevo));

    function guardarNuevo() {
      const { marca, tipo, color, id } = datosNuevo();
      if (!tipo || !color || !marca) return MP_INV.toast('Completa material, color y marca');
      const rollo = document.getElementById('n-rollo').value;
      const peso = rollo === 'otro' ? parseFloat(document.getElementById('n-peso').value) : parseFloat(rollo);
      if (!(peso > 0)) return MP_INV.toast('Escribe cuántos gramos agregas');
      const existente = DB.materials[id];
      const costoTxt = document.getElementById('n-costo').value;
      const costo = costoTxt === '' && existente ? existente.costo : parseFloat(costoTxt);
      if (isNaN(costo) || costo < 0) return MP_INV.toast('Escribe el precio por kg');

      DB.materials[id] = existente
        ? { ...existente, pesoTotal: existente.pesoTotal + peso, costo, marca, tipo, color }
        : { id, marca, tipo, color, pesoTotal: peso, costo };
      saveDB();
      MP_INV.cerrar();
      render();
      MP_INV.toast(existente ? `Reabastecido: ${tipo} ${color} · ${gramos(DB.materials[id].pesoTotal)} g` : `Agregado: ${tipo} ${color}`);
    }

    // ── Editar ──
    let editando = null;
    function pintarHero() {
      const g = Math.max(0, parseFloat(document.getElementById('e-peso').value) || 0);
      const costo = parseFloat(document.getElementById('e-costo').value) || 0;
      const st = estado(g);
      const hero = document.getElementById('e-hero');
      hero.className = 'inv-hero ' + st.cls;
      hero.innerHTML = `<span class="inv-hero-num">${gramos(g)}<small>g</small></span>
        <span class="inv-bar"><i style="width:${Math.min(100, g / 10).toFixed(0)}%"></i></span>
        <span class="inv-hero-sub">${st.txt} · vale ${fmt(g / 1000 * costo)}</span>`;
    }
    function abrirMat(id) {
      const m = DB.materials[id];
      if (!m) return;
      editando = id;
      document.getElementById('sh-mat-t').textContent = `${m.tipo} · ${m.color}`;
      document.getElementById('e-sub').textContent = m.marca;
      document.getElementById('e-peso').value = Math.round(m.pesoTotal * 10) / 10;
      document.getElementById('e-costo').value = m.costo;
      pintarHero();
      MP_INV.abrir('sh-mat');
    }
    function sumarPeso(g) {
      const i = document.getElementById('e-peso');
      i.value = Math.round(((parseFloat(i.value) || 0) + g) * 10) / 10;
      pintarHero();
    }
    ['e-peso', 'e-costo'].forEach(id => document.getElementById(id).addEventListener('input', pintarHero));

    function guardarMat() {
      const m = DB.materials[editando];
      if (!m) return;
      const peso = parseFloat(document.getElementById('e-peso').value);
      const costo = parseFloat(document.getElementById('e-costo').value);
      if (isNaN(peso) || peso < 0) return MP_INV.toast('Gramos inválidos');
      if (isNaN(costo) || costo < 0) return MP_INV.toast('Precio inválido');
      m.pesoTotal = peso; m.costo = costo;
      saveDB();
      MP_INV.cerrar();
      render();
      MP_INV.toast('Cambios guardados');
    }
    function eliminarMaterial() {
      const m = DB.materials[editando];
      if (!m || !confirm(`¿Eliminar ${m.tipo} ${m.color} (${m.marca})?`)) return;
      delete DB.materials[editando];
      saveDB();
      MP_INV.cerrar();
      render();
      MP_INV.toast('Filamento eliminado');
    }

    // ── Respaldo ──
    function importarJSON() {
      const raw = document.getElementById('import-json').value.trim();
      const msg = document.getElementById('import-msg');
      const aviso = (t, ok) => { msg.className = 'inv-hint ' + (ok ? 'is-ok' : 'is-warn'); msg.textContent = t; };
      if (!raw) return aviso('Pega el JSON primero.');
      let data;
      try { data = JSON.parse(raw); } catch (e) { return aviso('El JSON no es válido.'); }
      // Acepta arreglo (formato Supabase) u objeto (formato localStorage)
      const rows = Array.isArray(data) ? data : Object.values(data || {});
      if (!rows.length) return aviso('El JSON está vacío.');
      let added = 0, updated = 0;
      rows.forEach(m => {
        if (!m || !m.id || !m.marca) return;
        const n = {
          id: m.id, marca: m.marca, tipo: m.tipo, color: m.color,
          pesoTotal: parseFloat(m.pesoTotal ?? m.peso_total ?? 1000),
          costo: parseFloat(m.costo ?? 0),
        };
        if (DB.materials[n.id]) updated++; else added++;
        DB.materials[n.id] = n;
      });
      saveDB();
      render();
      aviso(`${added} nuevos, ${updated} actualizados.`, true);
      document.getElementById('import-json').value = '';
    }
    function exportarJSON() {
      const blob = new Blob([JSON.stringify(DB.materials, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mp_materials_backup.json';
      a.click();
      MP_INV.toast('Archivo exportado');
    }

    function render() { renderResumen(); renderLista(); }
    function mpInit() { loadDB(); render(); }
    window.addEventListener('mp-sync-ready', mpInit, { once: true });
    window.addEventListener('mp-sync-update', mpInit);
  </script>

</body>
